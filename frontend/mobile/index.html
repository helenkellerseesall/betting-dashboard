      // by raw edge. Operator wants parlay-buildable confidence, not lotto.
      const buckets = { conviction: [], likely: [], biggerEdge: [], lotto: [] };
      for (const c of cands) {
        const cls = playClass(c, sport);
        if (cls === "conviction") buckets.conviction.push(c);
        else if (cls === "likely") buckets.likely.push(c);
        else if (cls === "bigger-edge") buckets.biggerEdge.push(c);
        else if (cls === "lotto") buckets.lotto.push(c);
        // neg-edge and unknown are silently dropped — not bettor-actionable
      }
      const byProb = (a, b) => (b.predictedProbability ?? b.modelProb ?? 0) - (a.predictedProbability ?? a.modelProb ?? 0);
      const byEdge = (a, b) => (b.edgeProbability ?? b.edge ?? 0) - (a.edgeProbability ?? a.edge ?? 0);
      buckets.conviction.sort(byProb);
      buckets.likely.sort(byProb);
      buckets.biggerEdge.sort(byEdge);  // bigger-edge section ranked by edge (its purpose)
      buckets.lotto.sort(byEdge);

      // Caps to keep the surface scannable
      buckets.conviction = buckets.conviction.slice(0, 3);
      buckets.likely = buckets.likely.slice(0, 10);
      buckets.biggerEdge = buckets.biggerEdge.slice(0, 8);
      buckets.lotto = buckets.lotto.slice(0, 12);

      let html = freshHtml + searchHtml + `<div id="search-results-region"></div>`;
      let idx = 0;

      if (buckets.conviction.length > 0) {
        html += `<div class="conviction-section">
          <div class="section-header">
            <span class="section-icon">★</span>
            <span>Tonight's Convictions</span>
            <span class="section-sub">model ≥ 65% · edge ≥ 5%</span>
          </div>
          <div class="card-grid">
            ${buckets.conviction.map(c => renderCard(c, sport, idx++, true)).join("")}
          </div>
        </div>`;
      }

      if (buckets.likely.length > 0) {
        html += `<div class="section-header likely-section">
          <span>Likely To Hit</span>
          <span class="section-sub">parlay-leg pool · ${buckets.likely.length} plays</span>
        </div>
        <div class="card-grid">
          ${buckets.likely.map(c => renderCard(c, sport, idx++, false)).join("")}
        </div>`;
      }

      if (buckets.biggerEdge.length > 0) {
        html += `<div class="section-header all-opps">
          <span>Bigger Edges</span>
          <span class="section-sub">larger payouts · less reliable · ${buckets.biggerEdge.length} plays</span>
        </div>
        <div class="card-grid">
          ${buckets.biggerEdge.map(c => renderCard(c, sport, idx++, false)).join("")}
        </div>`;
      }

      if (buckets.lotto.length > 0) {
        // v0.1.4: auto-open Lotto when it's the only populated bucket — otherwise
        // the screen looks dead (operator saw this 2026-05-21 on a variance-heavy
        // MLB slate). Show a friendly explainer above so the operator knows why
        // there are no parlay-leg plays tonight.
        const noOtherBuckets = buckets.conviction.length === 0 &&
                               buckets.likely.length === 0 &&
                               buckets.biggerEdge.length === 0;
        const openAttr = noOtherBuckets ? "open" : "";
        if (noOtherBuckets) {
          html += `<div class="empty-explainer">
            Tonight's ${sport.toUpperCase()} slate is variance-heavy — no plays in the high-hit-rate buckets, only longshots. The lotto plays are below; use small stakes.
          </div>`;
        }
        html += `<details class="lotto-section" ${openAttr}>
          <summary class="section-header lotto-toggle">
            <span>Lotto Room</span>
            <span class="section-sub">${buckets.lotto.length} variance plays · big payouts · low hit rate</span>
          </summary>
          <div class="card-grid lotto-cards">
            ${buckets.lotto.map(c => renderCard(c, sport, idx++, false)).join("")}
          </div>
        </details>`;
      }

      // Diagnostic footer — small grey line at bottom for operator transparency
      const totalShown = buckets.conviction.length + buckets.likely.length + buckets.biggerEdge.length + buckets.lotto.length;
      const dropMsg = droppedNonAllowed > 0 ? ` · ${droppedNonAllowed} non-allowed books filtered` : "";
      html += `<div class="diag-footer">source: ${sourceUsed} · ${totalShown}/${cands.length} shown${dropMsg}</div>`;

      main.innerHTML = html;
    }

    // ─────────────────────────────────────────────────────────────
    // Card expansion
    // ─────────────────────────────────────────────────────────────
    function toggleCard(idx) {
      const card = document.querySelector(`.card[data-idx="${idx}"]`);
      if (!card) return;
      card.classList.toggle("expanded");
      const btn = card.querySelector(".expand-toggle");
      if (btn) btn.textContent = card.classList.contains("expanded") ? "▴ hide signals" : "▾ show signals";
    }
    window.toggleCard = toggleCard;

    // ─────────────────────────────────────────────────────────────
    // Phase A2 (2026-05-22): Game-first view
    // Default surface for MLB/NBA tabs — tonight's games → starters → primary
    // props. Replaces the 6-no-name edge-filtered display the operator hated.
    // Stars come back as the default. Edge plays move to a secondary toggle.
    // ─────────────────────────────────────────────────────────────
    function renderModeToggle(sport) {
      const mode = state.tabMode[sport] || "games";
      const isGames = mode === "games";
      const isSharp = mode === "sharp";
      return `
        <div style="display: flex; gap: 4px; margin-bottom: 12px; padding: 0;">
          <button onclick="setTabMode('${sport}', 'games')" style="
            flex: 1; padding: 8px 12px; font-size: 12px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
            background: ${isGames ? "linear-gradient(135deg, #1E293B 0%, #141828 100%)" : "transparent"};
            border: 1px solid ${isGames ? "#FBBF24" : "#1F2937"};
            color: ${isGames ? "#FBBF24" : "#6B7280"};
            border-radius: 8px;">Tonight's Games</button>
          <button onclick="setTabMode('${sport}', 'sharp')" style="
            flex: 1; padding: 8px 12px; font-size: 12px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
            background: ${isSharp ? "linear-gradient(135deg, #1E293B 0%, #141828 100%)" : "transparent"};
            border: 1px solid ${isSharp ? "#FBBF24" : "#1F2937"};
            color: ${isSharp ? "#FBBF24" : "#6B7280"};
            border-radius: 8px;">Sharp Plays</button>
        </div>
      `;
    }
    function setTabMode(sport, mode) {
      state.tabMode[sport] = mode;
      if (mode === "games" && !state.games[sport]) {
        // Fetch games data lazily
        fetchGames(sport);
      }
      render();
    }
    window.setTabMode = setTabMode;

    async function fetchGames(sport) {
      state.games.loading = true;
      try {
        const r = await fetch(`${API}/api/ws/games?sport=${sport}`);
        const json = await r.json();
        state.games[sport] = (r.ok && json.ok) ? json : { ok: false, _error: json?.error || `HTTP ${r.status}` };
      } catch (e) {
        state.games[sport] = { ok: false, _error: e.message || String(e) };
      }
      state.games.loading = false;
      render();
    }

    function renderGamesView(main, sport) {
      const toggleHtml = renderModeToggle(sport);
      const data = state.games[sport];
      if (!data) {
        // Trigger lazy fetch on first visit
        fetchGames(sport);
        main.innerHTML = toggleHtml + `<div class="empty">Loading tonight's games…</div>`;
        return;
      }
      if (data._error) {
        main.innerHTML = toggleHtml + `<div class="error">
          Couldn't load games. <code>${escapeHtml(data._error)}</code>
        </div>`;
        return;
      }
      if (!Array.isArray(data.games) || data.games.length === 0) {
        main.innerHTML = toggleHtml + `<div class="empty">
          No ${sport.toUpperCase()} games on the slate tonight.<br>
          <span style="font-size: 11px; color: #6B7280;">If you expected games, try refreshing the slate (↻)</span>
        </div>`;
        return;
      }

      const gamesHtml = data.games.map(g => renderGameCard(g, sport)).join("");
      main.innerHTML = toggleHtml + gamesHtml +
        `<div class="diag-footer">
          games-view v0.3.0 · ${data.games.length} game${data.games.length === 1 ? "" : "s"} ·
          ${data.totalRows} snapshot rows · ${data.totalKept} kept after policy filter
        </div>`;
    }

    // 2026-06-09 FE consolidation (fork B) — THE GAMES TAB. All-sports view over
    // the odds SNAPSHOT, so it includes UPCOMING games (not just tonight), reusing
    // the snapshot game→player→prop drill-down (renderGameCard/renderPlayerCard).
    // Reads the per-sport snapshot already cached in state.games[sport] (populated
    // by fetchGames → /api/ws/games); triggers a lazy fetch for any sport not yet
    // loaded, then re-renders. No backend change — same endpoint Tonight's Games used.
    // Honesty: future games have book lines but no model picks → renderGameCard
    // labels them "UPCOMING · LINES ONLY" and the per-prop model chip stays hidden
    // (it only renders when a real modelProb exists). Never fabricates an edge.
    function renderGamesAllSports(main) {
      const sports = ["nba", "mlb"]; // operator preference: NBA-first
      state._gamesInflight = state._gamesInflight || {};
      let pending = false;
      for (const s of sports) {
        if (!state.games[s] && !state._gamesInflight[s]) {
          state._gamesInflight[s] = true;
          fetchGames(s).finally(() => { state._gamesInflight[s] = false; });
        }
        if (!state.games[s]) pending = true;
      }
      if (pending) {
        main.innerHTML = `<div class="loading" style="padding:20px;color:#9CA3AF;">Loading games…</div>`;
        return;
      }
      const todaySlate = currentSlateDateEt();
      const titleOf = { nba: "🏀 NBA", mlb: "⚾ MLB" };
      let html = `<div style="padding:8px 12px;">`;
      let gamesShown = 0;
      for (const sport of sports) {
        const data = state.games[sport];
        if (!data || data._error || !Array.isArray(data.games) || data.games.length === 0) continue;
        html += `<div class="v2-sport-header" style="font-size:12px;font-weight:700;letter-spacing:0.5px;color:#9CA3AF;margin:10px 0 8px 0;">${titleOf[sport] || sport.toUpperCase()} · ${data.games.length} game${data.games.length === 1 ? "" : "s"}</div>`;
        for (const g of data.games) {
          gamesShown++;
          html += renderGameCard(g, sport, { todaySlate });
        }
      }
      if (gamesShown === 0) {
        main.innerHTML = `<div class="empty" style="padding:20px;color:#9CA3AF;">No games on the slate right now.<br><span style="font-size:11px;color:#6B7280;">Try refreshing the slate (↻) if you expected games.</span></div>`;
        const gc0 = document.getElementById("gamesCount"); if (gc0) gc0.textContent = "0";
        return;
      }
      html += `</div>`;
      main.innerHTML = html;
      const gc = document.getElementById("gamesCount"); if (gc) gc.textContent = String(gamesShown);
    }

    function renderGameCard(g, sport, opts = {}) {
      const players = Array.isArray(g.players) ? g.players : [];
      const matchupTxt = g.matchup || `${g.awayTeam || ""} @ ${g.homeTeam || ""}` || "Game";
      const gameTimeTxt = g.gameTime ? new Date(g.gameTime).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "";

      // 2026-06-09 FE consolidation — a future-dated game has book LINES but no
      // model picks yet (picks generate on the day's slate). Label it honestly so
      // the operator knows why there are no model chips; never fabricate an edge.
      // opts.todaySlate is only passed by the GAMES tab (renderGamesAllSports);
      // the dormant Tonight's-Games path calls renderGameCard(g, sport) with no
      // opts, so this is a no-op there.
      let _etDate = null;
      try { _etDate = g.gameTime ? new Date(g.gameTime).toLocaleDateString("en-CA", { timeZone: "America/New_York" }) : null; } catch (_) {}
      const isUpcoming = !!(opts.todaySlate && _etDate && _etDate > opts.todaySlate);
      const upcomingBadge = isUpcoming
        ? `<span data-upcoming="1" style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;background:rgba(96,165,250,0.15);color:#93C5FD;letter-spacing:0.3px;white-space:nowrap;">UPCOMING · LINES ONLY</span>`
        : "";

      const primaryFamilies = sport === "nba"
        ? ["Points", "Rebounds", "Assists", "Threes", "PRA"]
        : ["Hits", "Home Runs", "Total Bases", "RBIs", "Strikeouts"];

      // Phase A.5: collapsed by default. Show game header only; tap to expand.
      const isExpanded = !!state.expandedGames[g.eventId];
      const playersHtml = isExpanded
        ? (players.map(p => renderPlayerCard(p, sport, primaryFamilies, g.eventId)).join("")
           || `<div style="padding: 16px; color: #6B7280; text-align: center; font-size: 12px;">No players with primary props in this game tonight.</div>`)
        : "";
      const caret = isExpanded ? "▾" : "▸";

      return `
        <div style="margin-bottom: 10px;">
          <div onclick="toggleGameExpand('${escapeHtml(g.eventId)}')"
               style="background: linear-gradient(180deg, #1A1424 0%, #11151F 100%);
                      border: 1px solid #1F2937;
                      border-radius: ${isExpanded ? "12px 12px 0 0" : "12px"};
                      ${isExpanded ? "border-bottom: none;" : ""}
                      padding: 12px 14px; cursor: pointer;
                      display: flex; align-items: center; gap: 10px;">
            <span style="color: #6B7280; font-size: 14px; min-width: 14px;">${caret}</span>
            <div style="flex: 1;">
              <div style="font-size: 13px; font-weight: 700; color: #F9FAFB; text-transform: uppercase; letter-spacing: 0.4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                ${escapeHtml(matchupTxt)} ${upcomingBadge}
              </div>
              <div style="font-size: 11px; color: #6B7280; margin-top: 2px;">
                ${escapeHtml(gameTimeTxt)} · ${players.length} player${players.length === 1 ? "" : "s"} with props${isUpcoming ? ` · <span style="color:#93C5FD;">picks generate closer to game time</span>` : ""}
              </div>
            </div>
          </div>
          ${isExpanded ? `<div style="background: #11151F; border: 1px solid #1F2937; border-top: 0; border-radius: 0 0 12px 12px; padding: 8px;">${playersHtml}</div>` : ""}
        </div>
      `;
    }

    function toggleGameExpand(eventId) {
      state.expandedGames[eventId] = !state.expandedGames[eventId];
      render();
    }
    window.toggleGameExpand = toggleGameExpand;

    function togglePlayerExpand(key) {
      state.expandedPlayers[key] = !state.expandedPlayers[key];
      render();
    }
    window.togglePlayerExpand = togglePlayerExpand;

    function renderPlayerCard(p, sport, primaryFamilies, eventId) {
      const teamTxt = p.team ? p.team : "team pending";
      const teamCls = p.team ? "#9CA3AF" : "#FCD34D";
      const starterTag = p.starterFlag === 1
        ? `<span style="font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: rgba(52, 211, 153, 0.15); color: #34D399; letter-spacing: 0.3px;">STARTER</span>`
        : "";
      const ceilingTag = (typeof p.ceilingScore === "number" && p.ceilingScore >= 0.55)
        ? `<span style="font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
                       background: ${p.ceilingScore >= 0.72 ? "rgba(251, 191, 36, 0.18)" : "rgba(251, 191, 36, 0.10)"};
                       color: #FBBF24; letter-spacing: 0.3px;">CEILING ${(p.ceilingScore * 100).toFixed(0)}</span>`
        : "";
      const minutesTxt = (typeof p.projectedMinutes === "number")
        ? `<span style="color: #6B7280;">${p.projectedMinutes.toFixed(1)}min</span>`
        : "";
      const recent = p.recentForm;
      const formTxt = (recent && typeof recent.last5_avg === "number")
        ? `<span style="color: #6B7280;">L5: <span style="color: #D1D5DB; font-family: ui-monospace, monospace;">${recent.last5_avg.toFixed(1)}</span></span>`
        : "";

      // Count available prop families for the summary line
      const availableFamilies = primaryFamilies
        .filter(fam => Array.isArray(p.propGroups?.[fam]) && p.propGroups[fam].length > 0);
      if (availableFamilies.length === 0) return "";

      // Calibration overlay (2026-05-23) — sort families so the model's
      // trusted props appear first inside a player card, broken props last.
      // Order: calibrated > underconfident > insufficient > overconfident > broken
      const STATUS_RANK = {
        calibrated_positive: 0,
        calibrated_neutral: 1,
        miscalibrated_underconfident: 2,
        insufficient_sample: 3,
        no_data: 4,
        miscalibrated_overconfident: 5,
        broken: 6,
      };
      availableFamilies.sort((a, b) => {
        const sa = STATUS_RANK[p.familyCalibration?.[a]?.status ?? "no_data"];
        const sb = STATUS_RANK[p.familyCalibration?.[b]?.status ?? "no_data"];
        return sa - sb;
      });

      // Phase A.5: player row collapsed by default. Tap to expand props.
      const playerKey = `${eventId}|${p.player}`;
      const isExpanded = !!state.expandedPlayers[playerKey];
      const propBlocks = isExpanded
        ? availableFamilies.map(fam => renderPlayerPropFamily(fam, p.propGroups[fam], p, sport)).join("")
        : "";
      const caret = isExpanded ? "▾" : "▸";

      return `
        <div style="background: #141828; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;">
          <div onclick="togglePlayerExpand('${escapeHtml(playerKey).replace(/'/g, "\\'")}')"
               style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <span style="color: #6B7280; font-size: 12px; min-width: 12px;">${caret}</span>
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                <span style="font-size: 14px; font-weight: 700; color: #F9FAFB;">${escapeHtml(p.player)}</span>
                ${starterTag}
                ${ceilingTag}
              </div>
              <div style="font-size: 11px; color: ${teamCls}; margin-top: 2px;">
                ${escapeHtml(teamTxt)}${minutesTxt ? " · " + minutesTxt : ""}${formTxt ? " · " + formTxt : ""}
                · <span style="color: #4B5563;">${availableFamilies.length} prop type${availableFamilies.length === 1 ? "" : "s"}</span>
              </div>
            </div>
          </div>
          ${isExpanded ? `<div style="margin-top: 10px;">${propBlocks}</div>` : ""}
        </div>
      `;
    }

    function renderPlayerPropFamily(fam, props, player, sport) {
      // Find best over and best under
      const overs  = props.filter(p => p.side === "over").sort((a, b) => Number(a.line ?? 0) - Number(b.line ?? 0));
      const unders = props.filter(p => p.side === "under").sort((a, b) => Number(b.line ?? 0) - Number(a.line ?? 0));

      // (2026-05-23 fix) Ensure the model's actual pick line is always
      // included in the visible ladder. Without this, the family header can
      // say "model → UNDER 11.5" while the displayed unders are 32.5/33.5/34.5
      // and the operator never sees the line the model is actually recommending.
      const fp = player.familyProjection && player.familyProjection[fam];
      function ensureModelLineVisible(arr, side, sliceN) {
        if (!fp || fp.bestSide !== side || !Number.isFinite(fp.bestLine)) return arr.slice(0, sliceN);
        const inWindow = arr.slice(0, sliceN);
        const alreadyShown = inWindow.some(p => Number(p.line) === Number(fp.bestLine));
        if (alreadyShown) return inWindow;
        const modelEntry = arr.find(p => Number(p.line) === Number(fp.bestLine));
        if (!modelEntry) return inWindow;
        // Mark the entry so the FE can highlight it as the model's pick.
        modelEntry._isModelPick = true;
        return [modelEntry, ...inWindow];
      }
      const oversDisplay  = ensureModelLineVisible(overs, "over", 4);
      const undersDisplay = ensureModelLineVisible(unders, "under", 3);

      const renderProp = (pp, isOver) => {
        const oddsTxt = pp.odds == null ? "—" : (pp.odds > 0 ? `+${pp.odds}` : `${pp.odds}`);
        const oddsColor = pp.odds > 0 ? "#34D399" : "#D1D5DB";
        const candForAdd = {
          player: player.player, team: player.team, sport,
          propType: fam, statFamily: fam.toLowerCase().replace(/\s+/g, "_"),
          side: pp.side, line: pp.line, odds: pp.odds, oddsAmerican: pp.odds,
          sportsbook: pp.book, book: pp.book,
        };
        const sig = legSig(candForAdd);
        const inParlay = state.parlay.some(l => legSig(l) === sig);
        // Stash candidate so + button can pull by data attribute
        const stashKey = `gv:${sport}:${player.player}:${fam}:${pp.side}:${pp.line}:${pp.book}`;
        state._gameViewStash = state._gameViewStash || {};
        state._gameViewStash[stashKey] = candForAdd;

        // Multi-book chip — show the count of OTHER books offering the same
        // side+line. Tap-target tooltip lists them. This is the "collapse
        // noise" fix from operator 2026-05-23: same line from 3 books used
        // to be 3 rows; now it's 1 row with a small "+2" chip.
        const otherBooks = Array.isArray(pp.books) ? pp.books.filter(b => b.book !== pp.book) : [];
        const bookChip = otherBooks.length > 0
          ? `<span title="${escapeHtml(otherBooks.map(b => `${b.book}: ${b.odds > 0 ? '+' : ''}${b.odds}`).join(' · '))}"
                   style="font-size: 9px; padding: 1px 4px; border-radius: 3px;
                          background: rgba(96, 165, 250, 0.15); color: #93C5FD;
                          letter-spacing: 0.3px;">+${otherBooks.length}</span>`
          : "";

        // Line-shop best-price indicator (2026-06-16, CB) — surfaces the ONE
        // OOS-confirmed model-independent edge: best available price beats
        // consensus by ~+0.59pp (.scratch/selection_edge_oos.txt, H6, n=811).
        // Pure DISPLAY — reuses pp.books; never auto-bets. Restricted to the
        // operator's USABLE books (PREFERRED_BOOKS, the 4 he bets) — a best
        // price at a book he can't use isn't actionable. Shows best odds + which
        // book + the gap vs consensus, and flags when a DIFFERENT book than the
        // shown one has the better price (= switch to capture the edge).
        let bestPriceChip = "";
        {
          const impliedOf = (o) => (o == null || o === 0) ? null
            : (o > 0 ? 100 / (o + 100) : Math.abs(o) / (Math.abs(o) + 100));
          const usable = (Array.isArray(pp.books) ? pp.books : [])
            .filter(b => isPreferredBook(b.book) && Number.isFinite(Number(b.odds)))
            .map(b => ({ book: b.book, odds: Number(b.odds), imp: impliedOf(Number(b.odds)) }));
          if (usable.length >= 2) {
            const best = usable.reduce((a, b) => b.odds > a.odds ? b : a);
            const consensus = usable.reduce((s, b) => s + b.imp, 0) / usable.length;
            const gapPP = (consensus - best.imp) * 100; // + = best price cheaper than consensus
            const isSwitch = normalizeBookName(best.book) !== normalizeBookName(pp.book);
            const switchTxt = isSwitch ? ` — switch from ${pp.book || "—"}` : " — you have it";
            const gapTxt = gapPP > 0.01 ? ` ▲${gapPP.toFixed(1)}pp` : "";
            bestPriceChip = `<span title="Best price across your ${usable.length} usable books: ${escapeHtml(best.book)} ${best.odds > 0 ? "+" : ""}${best.odds}. Consensus implied ${(consensus * 100).toFixed(1)}%; best is ${gapPP >= 0 ? "+" : ""}${gapPP.toFixed(2)}pp vs consensus${switchTxt}."
                                   style="font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
                                          background: rgba(52, 211, 153, 0.15); color: #34D399; letter-spacing: 0.2px;">
                               BEST ${best.odds > 0 ? "+" : ""}${best.odds} @ ${escapeHtml(best.book)}${gapTxt}</span>`;
          }
        }

        // Per-row model signal — surfaces what the cognition thinks about
        // THIS line (modelProb + edge). Backend joins from tracked_bets.
        // Calibration discount (2026-05-23): when the lane is known
        // miscalibrated (e.g. OVERCONFIDENT 8pp), subtract the calibration
        // delta from the displayed edge so the model can't brag past its
        // actual track record. Calibrated lanes pass through unchanged.
        let modelChip = "";
        if (Number.isFinite(pp.modelProb)) {
          const rawEdgePp = Number.isFinite(pp.edge) ? pp.edge * 100 : null;
          const calDelta = pp.laneCalibration && Number.isFinite(pp.laneCalibration.calibrationDelta)
                            ? pp.laneCalibration.calibrationDelta * 100
                            : 0;
          // Calibration delta is (modelAvg − hitRate). Positive = model overconfident
          // → discount the edge by that amount. Negative = underconfident → small bump.
          const adjEdgePp = rawEdgePp == null ? null : rawEdgePp - calDelta;
          const edgeColor = adjEdgePp == null ? "#9CA3AF"
                          : adjEdgePp >= 5 ? "#34D399"
                          : adjEdgePp >= 0 ? "#FBBF24"
                          : "#F87171";
          let edgeTxt = "";
          let tipParts = [`raw model edge ${rawEdgePp == null ? "—" : (rawEdgePp >= 0 ? "+" : "") + rawEdgePp.toFixed(1) + "pp"}`];
          if (rawEdgePp != null) {
            if (Math.abs(calDelta) >= 1) {
              edgeTxt = ` · ${adjEdgePp >= 0 ? "+" : ""}${adjEdgePp.toFixed(0)}pp est`;
              tipParts.push(`calibration discount ${calDelta >= 0 ? "-" : "+"}${Math.abs(calDelta).toFixed(1)}pp`);
              tipParts.push(`adjusted ${adjEdgePp >= 0 ? "+" : ""}${adjEdgePp.toFixed(1)}pp`);
            } else {
              edgeTxt = ` · ${rawEdgePp >= 0 ? "+" : ""}${rawEdgePp.toFixed(0)}pp edge`;
            }
          }
          modelChip = `<span title="${escapeHtml(tipParts.join(' · '))}"
                              style="font-size: 9px; padding: 1px 5px; border-radius: 3px;
                                     background: rgba(167, 139, 250, 0.12); color: ${edgeColor};
                                     font-family: ui-monospace, monospace; letter-spacing: 0.2px;">
                        ${(pp.modelProb * 100).toFixed(0)}%${edgeTxt}
                      </span>`;
        }

        // Contradiction flag (2026-05-23) — when the model picks UNDER N but
        // the player's L5 avg is materially ABOVE N (or vice versa), surface
        // a red warning. This catches the "Brunson L5 avg 26.6 → model says
        // UNDER 20.5" pathology where the model contradicts its own visible
        // evidence. Threshold: |L5 − line| > 15% of the line.
        let contradictionTag = "";
        const l5avg = player?.recentForm?.last5_avg;
        if (Number.isFinite(l5avg) && Number.isFinite(pp.line) && Number.isFinite(pp.modelProb)) {
          const delta = l5avg - pp.line;
          const tol = Math.max(0.5, Math.abs(pp.line) * 0.15);
          const sideStr = String(pp.side || "").toLowerCase();
          const isOverSide = sideStr === "over" || sideStr === "yes";
          const isUnderSide = sideStr === "under" || sideStr === "no";
          const contradicts =
            (isUnderSide && delta > tol) ||
            (isOverSide && delta < -tol);
          if (contradicts) {
            const dir = isUnderSide ? "above" : "below";
            contradictionTag = `<span title="Model picked ${escapeHtml(sideStr.toUpperCase())} ${pp.line} but recent L5 avg (${l5avg.toFixed(1)}) is ${dir} the line by ${Math.abs(delta).toFixed(1)} pts. Verify the model has matchup-specific reasoning before trusting."
                                       style="font-size: 9px; padding: 1px 5px; border-radius: 3px;
                                              background: rgba(248, 113, 113, 0.18); color: #F87171;
                                              font-weight: 700; letter-spacing: 0.3px;">
                                  vs L5 ${l5avg.toFixed(1)}
                                </span>`;
          }
        }

        // Model-pick visual marker — when ensureModelLineVisible promoted
        // this line into the ladder because it's the model's top pick, we
        // render a subtle purple left-border so the operator instantly knows
        // which row the family projection header is referencing.
        const isModelPickRow = pp._isModelPick === true;
        const rowBg = isModelPickRow
          ? (isOver ? "rgba(167, 139, 250, 0.08)" : "rgba(167, 139, 250, 0.08)")
          : (isOver ? "rgba(52, 211, 153, 0.04)" : "rgba(248, 113, 113, 0.04)");
        const rowBorder = isModelPickRow ? "2px solid #A78BFA" : "2px solid transparent";

        return `
          <div style="display: flex; align-items: center; gap: 8px; padding: 4px 6px;
                      font-size: 12px; border-radius: 6px; flex-wrap: wrap;
                      background: ${rowBg};
                      border-left: ${rowBorder};">
            <span style="font-weight: 700; min-width: 42px; color: ${isOver ? "#34D399" : "#F87171"};">${isOver ? "OVER" : "UNDER"}</span>
            <span style="min-width: 38px; font-family: ui-monospace, monospace; color: #F9FAFB;">${pp.line ?? "—"}</span>
            <span style="font-family: ui-monospace, monospace; color: ${oddsColor}; min-width: 50px;">${oddsTxt}</span>
            <span style="font-size: 9px; padding: 1px 5px; border-radius: 3px;
                         background: rgba(75, 85, 99, 0.3); color: #9CA3AF; letter-spacing: 0.3px;">${escapeHtml(pp.book || "—")}</span>
            ${bookChip}
            ${bestPriceChip}
            ${modelChip}
            ${contradictionTag}
            <button onclick="addLegFromGameView('${escapeHtml(stashKey).replace(/'/g, "\\'")}', '${sport}'); event.stopPropagation();"
                    style="margin-left: auto; width: 24px; height: 24px; border-radius: 50%;
                           background: ${inParlay ? "#A78BFA" : "rgba(167, 139, 250, 0.12)"};
                           border: 1px solid rgba(167, 139, 250, 0.35);
                           color: ${inParlay ? "#0A0E1A" : "#A78BFA"};
                           font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer;
                           display: flex; align-items: center; justify-content: center;">${inParlay ? "✓" : "+"}</button>
          </div>
        `;
      };

      const oversHtml  = oversDisplay.map(p => renderProp(p, true)).join("");
      const undersHtml = undersDisplay.map(p => renderProp(p, false)).join("");

      // Calibration overlay (2026-05-23) — badge tells the operator if the
      // model has earned trust on THIS prop family. Sourced from
      // scorecards/lane_calibration.json via the backend overlay.
      // Pull from any prop entry (they all share the family-level verdict)
      // or fall back to player.familyCalibration if set on the player.
      const calSource = (props && props[0] && props[0].laneCalibration) || (player.familyCalibration && player.familyCalibration[fam]) || null;
      let calBadge = "";
      if (calSource && calSource.badge) {
        const tone = calSource.badge.tone;
        const toneColors = {
          green: { bg: "rgba(52, 211, 153, 0.15)", fg: "#34D399" },
          amber: { bg: "rgba(251, 191, 36, 0.15)", fg: "#FBBF24" },
          red:   { bg: "rgba(248, 113, 113, 0.15)", fg: "#F87171" },
          grey:  { bg: "rgba(156, 163, 175, 0.15)", fg: "#9CA3AF" },
        };
        const c = toneColors[tone] || toneColors.grey;
        const sampleTxt = calSource.sample ? ` ${calSource.sample}` : "";
        const tipParts = [calSource.badge.tip];
        if (calSource.roi != null) tipParts.push(`ROI ${calSource.roi > 0 ? "+" : ""}${(calSource.roi * 100).toFixed(0)}%`);
        if (calSource.hitRate != null) tipParts.push(`hits ${(calSource.hitRate * 100).toFixed(0)}%`);
        const tip = tipParts.join(" · ");
        calBadge = `<span title="${escapeHtml(tip)}"
                          style="font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
                                 background: ${c.bg}; color: ${c.fg}; letter-spacing: 0.4px; margin-left: 6px;">
                      ${escapeHtml(calSource.badge.label)}${sampleTxt}
                    </span>`;
      }

      // Family-level projection header (2026-05-23) — surfaces the cognition's
      // top pick. Discounted by lane calibration delta so the model can't
      // brag past its actual track record. Also shows L5 avg next to the
      // pick so contradictions are visible at a glance.
      let projectionLine = "";
      if (fp && Number.isFinite(fp.bestEdge)) {
        const rawEdgePp = fp.bestEdge * 100;
        const calDelta = calSource && Number.isFinite(calSource.calibrationDelta)
                         ? calSource.calibrationDelta * 100 : 0;
        const adjEdgePp = rawEdgePp - calDelta;
        const edgeColor = adjEdgePp >= 5 ? "#34D399" : adjEdgePp >= 0 ? "#FBBF24" : "#F87171";
        const sideTxt = (fp.bestSide || "").toUpperCase();
        const sideColor = fp.bestSide === "over" || fp.bestSide === "yes" ? "#34D399" : "#F87171";
        const l5 = player?.recentForm?.last5_avg;
        const l5Tag = Number.isFinite(l5)
          ? `<span style="color: #6B7280; margin-left: 4px;">· L5 ${l5.toFixed(1)}</span>` : "";
        const calTag = Math.abs(calDelta) >= 1
          ? `<span style="color: #6B7280; font-size: 9px;">(raw +${rawEdgePp.toFixed(0)}pp − ${calDelta.toFixed(0)}pp cal)</span>`
          : "";
        projectionLine = `
          <div style="font-size: 10px; color: #9CA3AF; padding: 2px 0 4px; line-height: 1.4;">
            <span style="color: #A78BFA;">model</span> →
            <span style="font-weight: 700; color: ${sideColor};">${escapeHtml(sideTxt)}</span>
            <span style="font-family: ui-monospace, monospace; color: #F9FAFB;">${fp.bestLine ?? ""}</span>
            <span style="color: ${edgeColor}; font-family: ui-monospace, monospace;">${adjEdgePp >= 0 ? "+" : ""}${adjEdgePp.toFixed(0)}pp est</span>
            ${fp.tier ? `<span style="font-size: 9px; color: #6B7280; margin-left: 4px;">(${escapeHtml(fp.tier)})</span>` : ""}
            ${l5Tag}
            ${calTag ? `<div style="font-size: 9px; color: #6B7280; margin-top: 2px; padding-left: 50px;">${calTag}</div>` : ""}
          </div>
        `;
      }

      return `
        <div style="margin-bottom: 8px;">
          <div style="display: flex; align-items: center; padding: 2px 0 4px;">
            <span style="font-size: 10px; font-weight: 700; color: #9CA3AF;
                         text-transform: uppercase; letter-spacing: 0.5px;">${escapeHtml(fam)}</span>
            ${calBadge}
          </div>
          ${projectionLine}
          <div style="display: flex; flex-direction: column; gap: 2px;">
            ${oversHtml}
            ${undersHtml}
          </div>
        </div>
      `;
    }

    window.addLegFromGameView = function (stashKey, sport) {
      const cand = (state._gameViewStash || {})[stashKey];
      if (cand) addLeg(cand, sport);
    };

    // ─────────────────────────────────────────────────────────────
    // Feedback loop — GRADES tab (yesterday's logged picks)
    // ─────────────────────────────────────────────────────────────
    async function fetchGrades() {
      if (state.grades.loading) return;
      state.grades.loading = true;
      state.grades.error = null;
      try {
        const r = await fetch(`${API}/api/ws/ledger/yesterday`);
        const data = await r.json();
        if (!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
        state.grades.date   = data.date;
        state.grades.picks  = Array.isArray(data.picks) ? data.picks : [];
        state.grades.totals = data.totals || null;
      } catch (err) {
        state.grades.error = String(err && err.message || err);
      } finally {
        state.grades.loading = false;
        // Update grades tab count badge
        const el = document.getElementById("gradesCount");
        if (el) el.textContent = state.grades.picks.length || "0";
        if (state.activeSport === "grades") render();
      }
    }

    async function triggerGrade(sport) {
      if (state.grades.grading) return;
      state.grades.grading = true;
      state.grades.gradeNote = `Grading ${sport.toUpperCase()}…`;
      if (state.activeSport === "grades") render();
      try {
        const r = await fetch(`${API}/api/ws/ledger/grade`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sport, date: state.grades.date || undefined }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
          const sR = data?.steps?.ledgerSettle;
          const settled = sR?.settled != null ? sR.settled : (sR?.skipped ? "0 (nothing to settle yet)" : "?");
          state.grades.gradeNote = `✓ ${sport.toUpperCase()} graded — ${settled} bet${settled === 1 ? "" : "s"} settled.`;
        } else if (data?.deferred) {
          state.grades.gradeNote = `⏳ ${sport.toUpperCase()} not ready — ${data.reason || "slate incomplete"}.`;
        } else {
          state.grades.gradeNote = `✗ ${data?.error || `HTTP ${r.status}`}`;
        }
        await fetchGrades();
      } catch (err) {
        state.grades.gradeNote = `✗ ${String(err && err.message || err)}`;
      } finally {
        state.grades.grading = false;
        if (state.activeSport === "grades") render();
      }
    }
    window.triggerGrade = triggerGrade;

    function fmtOdds(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return v > 0 ? `+${v}` : `${v}`;
    }
    function fmtNum(n, decimals = 2) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return v.toFixed(decimals);
    }
    function fmtPct(n, decimals = 1) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return `${(v * 100).toFixed(decimals)}%`;
    }

    // 2026-05-31 — fast CLV-stamping health probe. Reads tracked_bets_*.json
    // directly (small files), so this loads even when the heavy ledger panel
    // times out. Operator's #1 GRADES ask was "proof the CLV is working."
    async function _fetchGradesHealth(targetDivId) {
      try {
        const r = await fetch(`${API}/api/ws/grades-health?days=7`);
        const d = await r.json();
        const el = document.getElementById(targetDivId); if (!el) return;
        const renderSport = (sport, w) => {
          // P2a fix 1+3 — lead with the HONEST edge metric (beat-market), not the
          // scary raw HIT%. Trap-1: num() guards every metric read.
          const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : null; };
          const beat = num(w.beatMarketRate);
          const hitN = num(w.hitRate);
          const clvSum = num(w.clvSumCents);
          const settled = num(w.settled);
          const stampedCount = num(w.clvStamped) || 0;
          const measured = beat != null && stampedCount > 0;   // CLV actually captured for this sport
          const beatPct = beat != null ? `${(beat * 100).toFixed(0)}%` : "—";
          const hit = hitN != null ? `${(hitN * 100).toFixed(0)}%` : "—";
          const clvSumTxt = clvSum != null ? `${clvSum > 0 ? "+" : ""}${clvSum.toFixed(1)}¢ total CLV` : "";
          // grey (not red) when not measured — "capture pending" is NOT "measured bad" (fix 3, NBA CLV gap).
          const okStatus = measured ? "#34D399" : "#6B7280";
          const hero = measured
            ? `<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;">
                 <div><div style="font-size:9px;color:#6B7280;letter-spacing:1px;">BEATING THE MARKET</div>
                      <div style="font-size:22px;font-weight:700;color:#34D399;font-family:ui-monospace,monospace;">${beatPct}</div></div>
                 <div style="text-align:right;font-size:10px;color:#9CA3AF;">${clvSumTxt}${clvSumTxt ? "<br>" : ""}${stampedCount} CLV-stamped</div>
               </div>`
            : `<div style="margin-top:8px;font-size:12px;color:#9CA3AF;">CLV capture pending — <span style="color:#6B7280;">not yet measured (pipeline gap, being repaired)</span></div>`;
          // HIT% demoted + contextualized — honest: raw W/L on a longshot-heavy book reads low by design.
          const hitLine = `<div style="margin-top:8px;font-size:11px;color:#9CA3AF;">HIT <span style="color:#D1D5DB;">${hit}</span> <span style="color:#6B7280;">· raw W/L on a longshot-heavy slate — expected low; the edge is in beating the close (see by-tier track record below)</span></div>`;
          return `
            <div style="background:#0F1422;border-radius:8px;padding:10px;margin-bottom:8px;border-left:3px solid ${okStatus};">
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <span style="font-size:13px;font-weight:600;color:#F9FAFB;">${sport === "nba" ? "🏀 NBA" : "⚾ MLB"}</span>
                <span style="font-size:10px;color:#6B7280;">${w.total} picks · ${w.days.length}d</span>
              </div>
              ${hero}
              ${hitLine}
              <div style="font-size:9px;color:#6B7280;margin-top:6px;">${w.wins}W ${w.losses}L${w.pushes ? ' ' + w.pushes + 'P' : ''}${settled != null ? ' · ' + settled + ' settled' : ''}${w.pending ? ' · ' + w.pending + ' pending' : ''}</div>
            </div>
          `;
        };
        let html = `<div style="font-size:11px;color:#9CA3AF;letter-spacing:1px;margin-bottom:8px;">⚙️ SYSTEM HEALTH · last ${d.days} days</div>`;
        for (const sport of ["nba", "mlb"]) {
          if (d.sports?.[sport]) html += renderSport(sport, d.sports[sport]);
        }

        // T1 #2 — TRACK RECORD BY TIER. Realized hit% vs the vig-stripped fair price
        // the book charged, per confidence tier, over the full graded ledger. Shows the
        // inverted ladder HONESTLY: every number is backend-computed from the graded
        // ledger + PRESERVED vigStripping; n<30 cells render "not yet meaningful" (no
        // fabricated rate); NBA flagged pre-F1.2 corpus. FE only renders what backend sent.
        const renderTierBlock = (sport, t) => {
          if (!t || !Array.isArray(t.tiers) || t.tiers.length === 0) return "";
          const label = sport === "nba" ? "🏀 NBA" : "⚾ MLB";
          const sub = sport === "nba" ? "pre-F1.2 fix corpus · re-checks ~14d" : (t.windowLabel || "all graded days");
          const rows = t.tiers.map(r => {
            const edge = Number(r.edgePp);
            const meaningful = (r.insufficient !== true) && Number.isFinite(edge);
            const edgeColor = meaningful ? (edge >= 0 ? "#34D399" : "#FBBF24") : "#6B7280";
            const edgeTxt = meaningful ? `${edge >= 0 ? "+" : ""}${edge.toFixed(1)}pp vs mkt` : "not yet meaningful";
            const hitTxt = (meaningful && Number.isFinite(Number(r.hitPct))) ? `${Number(r.hitPct).toFixed(0)}% hit` : "";
            return `<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:11px;padding:4px 0;border-top:1px solid #1B2030;">
                <span style="color:#D1D5DB;font-weight:600;flex:0 0 78px;">${escapeHtml(String(r.tier))}</span>
                <span style="color:#6B7280;flex:0 0 auto;">n=${r.n}</span>
                <span style="color:#9CA3AF;flex:1;text-align:right;padding-right:8px;">${hitTxt}</span>
                <span style="color:${edgeColor};font-family:ui-monospace,monospace;flex:0 0 96px;text-align:right;">${edgeTxt}</span>
              </div>`;
          }).join("");
          return `<div style="background:#0F1422;border-radius:8px;padding:10px;margin-bottom:8px;">
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
                <span style="font-size:12px;font-weight:600;color:#F9FAFB;">${label}</span>
                <span style="font-size:9px;color:#6B7280;">${escapeHtml(String(sub))}</span>
              </div>
              ${rows}
            </div>`;
        };
        const hrt = d.hitRateByTier || {};
        const hasTier = (hrt.mlb && Array.isArray(hrt.mlb.tiers) && hrt.mlb.tiers.length) ||
                        (hrt.nba && Array.isArray(hrt.nba.tiers) && hrt.nba.tiers.length);
        if (hasTier) {
          html += `<div style="font-size:11px;color:#9CA3AF;letter-spacing:1px;margin:16px 0 6px 0;">📊 TRACK RECORD BY TIER · realized hit% vs market's fair price</div>`;
          html += `<div style="font-size:10px;color:#FBBF24;margin-bottom:8px;line-height:1.45;">Higher tiers aren't beating the market yet — judge picks by the stats, not the badge. Tier ranking is under review.</div>`;
          // MLB first (larger, more reliable corpus), then NBA.
          if (hrt.mlb) html += renderTierBlock("mlb", hrt.mlb);
          if (hrt.nba) html += renderTierBlock("nba", hrt.nba);
        }

        el.innerHTML = html;
      } catch (e) {
        const el = document.getElementById(targetDivId); if (!el) return;
        el.innerHTML = `<div style="color:#F87171;font-size:11px;padding:8px;">CLV health probe failed: ${escapeHtml(String(e?.message || e))}</div>`;
      }
    }

    function renderGradesView(main) {
      const d = state.grades;
      // Lazy fetch on first open
      if (!d.loading && d.date == null && d.picks.length === 0 && !d.error) {
        fetchGrades();
      }

      // Health panel always renders first (fast endpoint, fires async)
      const healthDivId = `grades-health-${Math.random().toString(36).slice(2, 8)}`;
      const healthShell = `<div style="padding:12px 14px 0 14px;">
        <div id="${healthDivId}"><div style="color:#6B7280;font-size:11px;">Loading system health…</div></div>
      </div>`;
      setTimeout(() => _fetchGradesHealth(healthDivId), 50);

      if (d.loading) {
        main.innerHTML = `${healthShell}<div class="loading" style="padding:20px;color:#9CA3AF;">Loading yesterday's picks…</div>`;
        return;
      }
      if (d.error) {
        main.innerHTML = `${healthShell}<div class="error" style="padding: 16px; color: #F87171;">
          Ledger panel failed to load (likely heavy file timeout).<br><code style="font-size:10px;">${escapeHtml(d.error)}</code>
          <div style="margin-top:8px;font-size:11px;color:#9CA3AF;">System health panel above pulls from per-day tracked_bets files and is unaffected.</div>
        </div>`;
        return;
      }

      // 2026-05-29 — separate model-tracking display from placed-bets display.
      // When d.placedBets is null, operator hasn't actually bet anything, so
      // we show ONLY W/L accuracy of the model, not hypothetical profit/loss.
      // When d.placedBets has data, we show real money totals (future state).
      const tr = d.tracking || d.totals || { count: 0, wins: 0, losses: 0, pushes: 0, pending: 0, hitRate: null };
      const pb = d.placedBets || null;
      const wrTxt  = (tr.hitRate ?? tr.winRate) == null ? "—" : `${((tr.hitRate ?? tr.winRate) * 100).toFixed(0)}%`;
      const hasPlacedBets = pb && pb.count > 0;

      // Build right-side metric: HIT RATE for tracking-only, PROFIT for placed bets
      let rightMetricHtml;
      if (hasPlacedBets) {
        const profitTxt = `${pb.profit >= 0 ? "+" : ""}${fmtNum(pb.profit)}`;
        const profitColor = pb.profit > 0 ? "#34D399" : (pb.profit < 0 ? "#F87171" : "#D1D5DB");
        rightMetricHtml = `
          <div style="font-size: 11px; color: #6B7280;">PROFIT</div>
          <div style="font-size: 18px; font-weight: 700; color: ${profitColor}; font-family: ui-monospace, monospace;">${profitTxt}</div>
        `;
      } else {
        rightMetricHtml = `
          <div style="font-size: 11px; color: #6B7280;">MODEL HIT RATE</div>
          <div style="font-size: 18px; font-weight: 700; color: #D1D5DB; font-family: ui-monospace, monospace;">${wrTxt}</div>
        `;
      }

      // Build bottom row: ROI + Staked when placed; mode label when tracking-only
      let bottomRowHtml;
      if (hasPlacedBets) {
        const roiTxt = pb.roi == null ? "—" : `${(pb.roi * 100).toFixed(1)}%`;
        bottomRowHtml = `
          <span>Win rate: <span style="color: #D1D5DB; font-family: ui-monospace, monospace;">${wrTxt}</span></span>
          <span>ROI: <span style="color: ${pb.roi > 0 ? "#34D399" : pb.roi < 0 ? "#F87171" : "#D1D5DB"}; font-family: ui-monospace, monospace;">${roiTxt}</span></span>
          <span>Staked: <span style="color: #D1D5DB; font-family: ui-monospace, monospace;">${fmtNum(pb.staked)}</span></span>
        `;
      } else {
        const viewLabel = d.viewMode === "bettable_subset" ? "Bettable subset" : "All tracked";
        bottomRowHtml = `
          <span style="color: #6B7280;">${viewLabel} · model accuracy only · no bets placed yet</span>
        `;
      }

      const summaryHtml = `
        <div style="padding: 12px 14px; margin-bottom: 12px; background: #141828; border-radius: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
            <div style="font-size: 12px; color: #9CA3AF; letter-spacing: 0.5px;">LAST NIGHT · ${escapeHtml(d.date || "—")}</div>
            <div style="font-size: 11px; color: #6B7280;">${tr.count} logged</div>
          </div>
          <div style="display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;">
            <div>
              <span style="font-size: 22px; font-weight: 700; color: #F9FAFB;">${tr.wins}</span>
              <span style="font-size: 11px; color: #6B7280;">W</span>
              <span style="font-size: 18px; color: #6B7280; margin: 0 4px;">·</span>
              <span style="font-size: 22px; font-weight: 700; color: #F9FAFB;">${tr.losses}</span>
              <span style="font-size: 11px; color: #6B7280;">L</span>
              ${tr.pushes ? `<span style="font-size: 18px; color: #6B7280; margin: 0 4px;">·</span>
                            <span style="font-size: 16px; color: #9CA3AF;">${tr.pushes}P</span>` : ""}
              ${tr.pending ? `<span style="font-size: 18px; color: #6B7280; margin: 0 4px;">·</span>
                            <span style="font-size: 14px; color: #FBBF24;">${tr.pending} pending</span>` : ""}
            </div>
            <div style="margin-left: auto; text-align: right;">
              ${rightMetricHtml}
            </div>
          </div>
          <div style="display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #9CA3AF;">
            ${bottomRowHtml}
          </div>
        </div>
      `;

      const noteColor = d.gradeNote && d.gradeNote.startsWith("✓") ? "#34D399"
                      : d.gradeNote && d.gradeNote.startsWith("⏳") ? "#FBBF24"
                      : d.gradeNote && d.gradeNote.startsWith("✗") ? "#F87171"
                      : "#9CA3AF";
      const gradeBtns = `
        <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
          <button onclick="triggerGrade('mlb')" ${d.grading ? "disabled" : ""}
                  style="flex: 1; min-width: 110px; padding: 10px; background: rgba(52, 211, 153, 0.12);
                         border: 1px solid rgba(52, 211, 153, 0.35); color: #34D399; border-radius: 8px;
                         font-size: 12px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer;
                         opacity: ${d.grading ? 0.5 : 1};">GRADE MLB</button>
          <button onclick="triggerGrade('nba')" ${d.grading ? "disabled" : ""}
                  style="flex: 1; min-width: 110px; padding: 10px; background: rgba(249, 115, 22, 0.12);
                         border: 1px solid rgba(249, 115, 22, 0.35); color: #F97316; border-radius: 8px;
                         font-size: 12px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer;
                         opacity: ${d.grading ? 0.5 : 1};">GRADE NBA</button>
          <button onclick="fetchGrades()" ${d.loading ? "disabled" : ""}
                  style="flex: 0 0 auto; padding: 10px 14px; background: rgba(167, 139, 250, 0.12);
                         border: 1px solid rgba(167, 139, 250, 0.35); color: #A78BFA; border-radius: 8px;
                         font-size: 12px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer;">↻</button>
        </div>
        ${d.gradeNote ? `<div style="font-size: 11px; color: ${noteColor}; margin: -6px 0 12px 4px;">${escapeHtml(d.gradeNote)}</div>` : ""}
      `;

      if (d.picks.length === 0) {
        main.innerHTML = `
          ${healthShell}
          ${summaryHtml}
          ${gradeBtns}
          <div style="padding: 24px 16px; text-align: center; color: #6B7280;">
            <div style="font-size: 14px; margin-bottom: 8px;">No picks logged for ${escapeHtml(d.date || "yesterday")}.</div>
            <div style="font-size: 11px;">Tap <span style="color: #FBBF24; font-weight: 700;">L</span> next to any prop in the Games view to start logging.</div>
          </div>
        `;
        return;
      }

      const pickHtml = d.picks.map(p => {
        const resultColor = p.result === "win" ? "#34D399"
                          : p.result === "loss" ? "#F87171"
                          : p.result === "push" ? "#9CA3AF"
                          : "#FBBF24";
        const resultTxt = (p.result || "pending").toUpperCase();
        const sideTxt = (p.side || "").toUpperCase();
        const sideColor = p.side === "over" || p.side === "yes" ? "#34D399"
                        : p.side === "under" || p.side === "no" ? "#F87171"
                        : "#D1D5DB";
        const clvTag = p.clvPct != null
          ? `<span style="font-size: 10px; padding: 1px 5px; border-radius: 3px;
                         background: ${p.beatMarket ? "rgba(52, 211, 153, 0.12)" : "rgba(248, 113, 113, 0.12)"};
                         color: ${p.beatMarket ? "#34D399" : "#F87171"}; font-family: ui-monospace, monospace;">
                CLV ${p.clvPct > 0 ? "+" : ""}${p.clvPct.toFixed(1)}¢</span>`
          : "";
        const actualTxt = p.actualStat != null
          ? `<span style="color: #9CA3AF;">actual: <span style="color: #F9FAFB; font-family: ui-monospace, monospace;">${p.actualStat}</span></span>`
          : "";
        return `
          <div style="background: #141828; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;">
            <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;">
              <span style="font-size: 13px; font-weight: 700; color: #F9FAFB; flex: 1; min-width: 0;">${escapeHtml(p.player || "Unknown")}</span>
              <span style="font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
                           background: ${resultColor === "#FBBF24" ? "rgba(251, 191, 36, 0.12)" : "rgba(75, 85, 99, 0.2)"};
                           color: ${resultColor}; letter-spacing: 0.5px;">${resultTxt}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: #9CA3AF; flex-wrap: wrap;">
              <span style="color: ${sideColor}; font-weight: 700;">${sideTxt}</span>
              <span style="font-family: ui-monospace, monospace; color: #F9FAFB;">${p.line ?? "—"}</span>
              <span>${escapeHtml(p.statFamily || p.prop || "")}</span>
              <span style="color: #6B7280;">·</span>
              <span style="font-family: ui-monospace, monospace; color: ${p.odds > 0 ? "#34D399" : "#D1D5DB"};">${fmtOdds(p.odds)}</span>
              <span style="font-size: 9px; padding: 1px 5px; border-radius: 3px;
                           background: rgba(75, 85, 99, 0.3); color: #9CA3AF;">${escapeHtml(p.sportsbook || "—")}</span>
              ${clvTag}
            </div>
            ${actualTxt ? `<div style="font-size: 11px; margin-top: 4px;">${actualTxt}</div>` : ""}
          </div>
        `;
      }).join("");

      main.innerHTML = healthShell + summaryHtml + gradeBtns + pickHtml;
    }

    // ── 2026-07-07 EXEC-CARD — one-tap REAL-MONEY bet recording ──────────────
    // Panel lives in the pick tap-modal. POSTs to /api/ws/place-bet, which reuses
    // the EXACT addPlacedBet path (validation + tuple lookup + auto-stamp +
    // decisionType=placed + realMoney=true). Distinct from the "L" follow-logger
    // below (/ledger/log, decisionType=followed, not real money).
    // Stakes are ROUND-NUMBER presets ($1/$2/$5) by design — the card never
    // computes or displays a "suggested" stake. Duplicate-tap safe: button
    // disables in-flight AND the backend already_recorded-guards the
    // deterministic id.
    function _renderPlaceBetPanel(p) {
      if (!p || !p.player) return "";
      return `
        <div style="border-top:1px solid #1B2030;margin-top:10px;padding-top:10px;">
          ${_renderOpenInBook(p)}
          <div style="display:flex;gap:8px;">
          <button id="pb-open" onclick="window._pbOpen()"
            style="flex:1;padding:9px 0;border-radius:8px;border:1px solid #14532D;background:rgba(52,211,153,0.10);color:#34D399;font-size:13px;font-weight:700;cursor:pointer;">
            💵 I bet this
          </button>
          <button onclick="window._slipAdd()"
            style="flex:0 0 auto;padding:9px 14px;border-radius:8px;border:1px solid #1E3A8A;background:rgba(96,165,250,0.10);color:#60A5FA;font-size:13px;font-weight:700;cursor:pointer;">
            ＋ Slip
          </button>
          </div>
          <div id="pb-form" style="display:none;margin-top:8px;">
            <div style="display:flex;gap:6px;align-items:center;">
              <span style="font-size:11px;color:#9CA3AF;">Stake $</span>
              ${[1, 2, 5].map((v) => `<button onclick="window._pbStake(${v})" style="padding:6px 12px;border-radius:6px;border:1px solid #374151;background:#1F2937;color:#F9FAFB;font-size:12px;font-weight:700;cursor:pointer;">${v}</button>`).join("")}
              <input id="pb-stake" type="number" inputmode="numeric" min="1" step="1" value="1"
                oninput="window._pbStake(null)"
                style="width:58px;padding:6px;border-radius:6px;border:1px solid #374151;background:#0A0E1A;color:#F9FAFB;font-size:12px;text-align:center;" />
            </div>
            <div style="display:flex;gap:6px;align-items:center;margin-top:6px;">
              <span style="font-size:11px;color:#9CA3AF;">Odds I got</span>
              <input id="pb-odds" type="number" inputmode="numeric" value="${Number(p.oddsAmerican ?? p.odds) || ""}"
                style="width:74px;padding:6px;border-radius:6px;border:1px solid #374151;background:#0A0E1A;color:#F9FAFB;font-size:12px;text-align:center;" />
              <span style="font-size:9px;color:#6B7280;">card price ${_oddsNice(p.oddsAmerican ?? p.odds)} — your slip is ground truth; edit if the book gave a different price</span>
            </div>
            <button id="pb-confirm" onclick="window._pbConfirm(this)"
              style="width:100%;margin-top:8px;padding:9px 0;border-radius:8px;border:0;background:#34D399;color:#0A0E1A;font-size:13px;font-weight:800;cursor:pointer;">
              Confirm — record $<span id="pb-amt">1</span> bet
            </button>
            <div id="pb-result" style="margin-top:8px;font-size:11px;line-height:1.45;"></div>
          </div>
        </div>`;
    }
    window._pbOpen = function () {
      const f = document.getElementById("pb-form");
      const b = document.getElementById("pb-open");
      if (f) f.style.display = "block";
      if (b) b.style.display = "none";
    };
    window._pbStake = function (v) {
      const inp = document.getElementById("pb-stake");
      if (v != null && inp) inp.value = v;
      const amt = document.getElementById("pb-amt");
      if (amt && inp) amt.textContent = String(Math.max(1, Math.round(Number(inp.value) || 1)));
    };
    window._pbConfirm = async function (btnEl) {
      const p = window._pbCurrentPick;
      const out = document.getElementById("pb-result");
      if (!p || !out) return;
      const stake = Math.max(1, Math.round(Number(document.getElementById("pb-stake")?.value) || 1));
      // 2026-07-07 FEEDBACK-A1 — the recorded odds are the odds the operator GOT
      // (editable field, prefilled with the card price). The book slip is ground
      // truth; toWin recomputes server-side from these odds.
      const oddsGot = Number(document.getElementById("pb-odds")?.value);
      if (!Number.isFinite(oddsGot) || oddsGot === 0) {
        out.innerHTML = `<div style="background:#450A0A;border-left:3px solid #F87171;border-radius:6px;padding:8px 10px;color:#FECACA;">Enter the odds from your slip (e.g. -110).</div>`;
        return;
      }
      btnEl.disabled = true; btnEl.textContent = "Recording…";
      try {
        const r = await fetch(`${API}/api/ws/place-bet`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sport:     p.sport || "mlb",
            player:    p.player,
            stat:      p.statFamily,
            propType:  p.propType || null,
            marketKey: p.marketKey || null,
            side:      p.side,
            line:      p.line,
            odds:      oddsGot,
            book:      p.sportsbook || p.book,
            stake,
            matchup:   p.matchup || null,
          }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
          const s = d.stamped || {};
          const stampLine = s.calibVersion
            ? `stamped <b>${escapeHtml(s.calibVersion)}</b> · model ${s.modelProb != null ? (s.modelProb * 100).toFixed(1) + "%" : "—"}`
            : `no calibration stamp on the matched row (raw-era) — recorded what exists`;
          out.innerHTML = `
            <div style="background:#052E16;border-left:3px solid #34D399;border-radius:6px;padding:8px 10px;color:#BBF7D0;">
              ✓ Recorded <b>$${d.bet.stake}</b> — ${escapeHtml(d.bet.player)} ${escapeHtml(String(d.bet.side))} ${d.bet.line} @ ${escapeHtml(d.bet.sportsbook)} (to win $${d.bet.toWin})<br/>
              ${d.noTupleMatch ? "" : stampLine}
            </div>
            ${d.noTupleMatch ? `<div style="background:#451A03;border-left:3px solid #FBBF24;border-radius:6px;padding:8px 10px;margin-top:6px;color:#FDE68A;">⚠ <b>NO TUPLE MATCH</b> — this bet will NOT auto-settle or auto-CLV. It needs a manual settle after the game (GRADING_RULES §9).</div>` : ""}`;
          btnEl.textContent = "Recorded ✓";
        } else if (d && d.reason === "already_recorded") {
          out.innerHTML = `<div style="background:#451A03;border-left:3px solid #FBBF24;border-radius:6px;padding:8px 10px;color:#FDE68A;">Already recorded today — $${d.bet?.stake} at ${escapeHtml(String(d.bet?.placedAt || ""))} (${escapeHtml(String(d.bet?.result || "pending"))}). Nothing written twice.</div>`;
          btnEl.textContent = "Already recorded";
        } else {
          out.innerHTML = `<div style="background:#450A0A;border-left:3px solid #F87171;border-radius:6px;padding:8px 10px;color:#FECACA;">✗ ${escapeHtml(String(d.error || `HTTP ${r.status}`))}</div>`;
          btnEl.disabled = false; btnEl.textContent = "Confirm — retry";
        }
      } catch (err) {
        out.innerHTML = `<div style="background:#450A0A;border-left:3px solid #F87171;border-radius:6px;padding:8px 10px;color:#FECACA;">✗ ${escapeHtml(String(err?.message || err))}</div>`;
        btnEl.disabled = false; btnEl.textContent = "Confirm — retry";
      }
    };

    // ── 2026-07-07 DEEPLINK-2A/2B — open-in-book links + slip tray ───────────
    // EVERY link renders only through the operator's verified matrix
    // (/api/ws/deeplink-matrix ← backend/config/deeplinkMatrix.json — all books
    // ship DISABLED). Composed multi-leg links additionally require multiStatus
    // confirmed/verified + same book + CROSS-GAME legs only (SGP is a different
    // pricing engine — explicitly out of v1). Recording NEVER depends on links.
    window._dlMatrix = null;
    (async function _dlLoadMatrix() {
      try {
        const r = await fetch(`${API}/api/ws/deeplink-matrix`);
        const d = await r.json();
        window._dlMatrix = (d && d.books) || {};
      } catch (_) { window._dlMatrix = {}; }
    })();
    function _dlBookKey(display) {
      const k = String(display || "").toLowerCase().replace(/[^a-z]/g, "");
      return k === "hardrock" ? "hardrockbet" : k;
    }
    function _dlBookCfg(display) {
      const m = window._dlMatrix || {};
      return m[_dlBookKey(display)] || null;
    }
    // Fill vendor placeholders. Unfilled {state} ⇒ null (never render a broken link).
    function _dlFill(url, cfg, opts = {}) {
      if (!url) return null;
      let u = String(url);
      if (/\{state\}/.test(u)) {
        if (!cfg || !cfg.state) return null;
        u = u.split("{state}").join(cfg.state);
      }
      u = u.split("{pickType}").join(opts.pickType || "single");
      u = u.split("{wagerAmount}").join(""); // NEVER prefill stakes (survival doctrine)
      if (/\{[a-zA-Z]+\}/.test(u)) return null; // any other unfilled placeholder ⇒ hide
      return u;
    }
    function _renderOpenInBook(p) {
      const cfg = _dlBookCfg(p.sportsbook || p.book);
      if (!cfg || !cfg.enabled || !p.betLink) return "";
      const url = _dlFill(p.betLink, cfg);
      if (!url) return "";
      return `
        <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"
           style="display:block;text-align:center;margin-bottom:8px;padding:9px 0;border-radius:8px;border:1px solid #4C1D95;background:rgba(167,139,250,0.10);color:#A78BFA;font-size:13px;font-weight:700;text-decoration:none;">
          ↗ Open in ${escapeHtml(p.sportsbook || p.book)} (adds this pick to the betslip)
        </a>`;
    }

    // ── slip tray (cross-game multi-leg; 2B) ─────────────────────────────────
    window._slipTray = [];
    window._slipAdd = function () {
      const p = window._pbCurrentPick;
      if (!p) return;
      const key = `${p.player}|${p.statFamily}|${p.side}|${p.line}|${p.sportsbook || p.book}`;
      if (window._slipTray.some((x) => x._key === key)) { _slipRenderBar(); return; }
      if (window._slipTray.length >= 6) { alert("Slip tray is full (6 legs max)"); return; }
      window._slipTray.push({ ...p, _key: key });
      _slipRenderBar();
      document.getElementById("v2-modal")?.classList.remove("open");
    };
    window._slipRemove = function (i) {
      window._slipTray.splice(i, 1);
      _slipRenderBar();
      window._slipShowPanel && document.getElementById("slip-panel") && window._slipOpenPanel();
    };
    function _slipEnsureBar() {
      let bar = document.getElementById("slip-bar");
      if (!bar) {
        bar = document.createElement("div");
        bar.id = "slip-bar";
        bar.style.cssText = "position:fixed;left:10px;right:10px;bottom:64px;z-index:60;display:none;";
        document.body.appendChild(bar);
      }
      return bar;
    }
    function _slipRenderBar() {
      const bar = _slipEnsureBar();
      const n = window._slipTray.length;
      if (!n) { bar.style.display = "none"; bar.innerHTML = ""; return; }
      bar.style.display = "block";
      bar.innerHTML = `
        <div onclick="window._slipOpenPanel()" style="background:#1E293B;border:1px solid #334155;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.5);">
          <span style="color:#F9FAFB;font-size:13px;font-weight:700;">🧾 Slip: ${n} leg${n === 1 ? "" : "s"}</span>
          <span style="color:#60A5FA;font-size:12px;">view ▾</span>
        </div>
        <div id="slip-panel"></div>`;
    }
    function _slipAmerFromDec(dec) {
      if (!Number.isFinite(dec) || dec <= 1) return null;
      return dec >= 2 ? `+${Math.round((dec - 1) * 100)}` : `${Math.round(-100 / (dec - 1))}`;
    }
    window._slipOpenPanel = function () {
      const panel = document.getElementById("slip-panel");
      if (!panel) return;
      const legs = window._slipTray;
      const books = [...new Set(legs.map((l) => _dlBookKey(l.sportsbook || l.book)))];
      const sameBook = books.length === 1;
      const events = [...new Set(legs.map((l) => String(l.eventId || "")))];
      const crossGame = events.length === legs.length && !events.includes("");
      let dec = 1;
      for (const l of legs) { const o = Number(l.oddsAmerican ?? l.odds); dec *= o > 0 ? 1 + o / 100 : 1 + 100 / Math.abs(o); }
      const amer = _slipAmerFromDec(dec);
      const legRows = legs.map((l, i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1B2030;">
          <span style="font-size:12px;color:#F9FAFB;">${escapeHtml(l.player)} <span style="color:#9CA3AF;">${escapeHtml(String(l.side))} ${l.line} ${escapeHtml(String(l.statFamily || ""))} @ ${escapeHtml(l.sportsbook || l.book || "?")}</span></span>
          <button onclick="window._slipRemove(${i})" style="background:none;border:0;color:#F87171;font-size:15px;cursor:pointer;">×</button>
        </div>`).join("");
      const composeHtml = sameBook && legs.length >= 2 ? _slipComposeAnchor(legs, crossGame) : "";
      const mixNote = !sameBook && legs.length >= 2 ? `<div style="font-size:10px;color:#FBBF24;margin-top:6px;">Legs span multiple books — a parlay lives at one book. Remove mismatched legs to record/open as one slip.</div>` : "";
      panel.innerHTML = `
        <div style="background:#141828;border:1px solid #334155;border-radius:10px;margin-top:6px;padding:12px;">
          ${legRows}
          <div style="font-size:11px;color:#9CA3AF;margin-top:8px;">combined ≈ ${amer || "—"} (display only — the book's slip price is authoritative)</div>
          ${composeHtml}
          ${mixNote}
          ${sameBook && legs.length >= 2 ? `
          <div style="display:flex;gap:6px;align-items:center;margin-top:8px;">
            <span style="font-size:11px;color:#9CA3AF;">Stake $</span>
            ${[1, 2, 5].map((v) => `<button onclick="document.getElementById('slip-stake').value=${v}" style="padding:5px 10px;border-radius:6px;border:1px solid #374151;background:#1F2937;color:#F9FAFB;font-size:11px;font-weight:700;cursor:pointer;">${v}</button>`).join("")}
            <input id="slip-stake" type="number" inputmode="numeric" min="1" step="1" value="1" style="width:52px;padding:5px;border-radius:6px;border:1px solid #374151;background:#0A0E1A;color:#F9FAFB;font-size:11px;text-align:center;" />
            <input id="slip-odds" type="number" inputmode="numeric" placeholder="book odds" title="the combined odds YOUR book shows on the slip" style="width:84px;padding:5px;border-radius:6px;border:1px solid #374151;background:#0A0E1A;color:#F9FAFB;font-size:11px;text-align:center;" />
          </div>
          <button onclick="window._slipRecord(this)" style="width:100%;margin-top:8px;padding:9px 0;border-radius:8px;border:0;background:#34D399;color:#0A0E1A;font-size:13px;font-weight:800;cursor:pointer;">I bet this parlay — record it</button>` : ""}
          <div id="slip-result" style="margin-top:8px;font-size:11px;line-height:1.45;"></div>
          <button onclick="window._slipTray=[];_slipRenderBar();" style="width:100%;margin-top:8px;padding:6px 0;border-radius:6px;border:1px solid #374151;background:none;color:#9CA3AF;font-size:11px;cursor:pointer;">clear slip</button>
        </div>`;
    };
    // Per-book multi-leg composition — CC's verified templates ONLY
    // (docs/research/2026-07-07-multileg-betslip-links.md §2), gated by the matrix.
    function _slipComposeAnchor(legs, crossGame) {
      const bookDisplay = legs[0].sportsbook || legs[0].book;
      const key = _dlBookKey(bookDisplay);
      const cfg = _dlBookCfg(bookDisplay);
      if (!cfg || !cfg.enabled || !["confirmed", "verified"].includes(String(cfg.multiStatus))) return "";
      if (!crossGame) return `<div style="font-size:10px;color:#FBBF24;margin-top:6px;">Same-game legs in the tray — SGP is a different pricing engine (out of v1). Open legs individually.</div>`;
      let url = null;
      try {
        if (key === "fanduel") {
          const parts = legs.map((l) => (String(l.betLink || "").match(/marketId=([\d.]+)&selectionId=(\d+)/) || []));
          if (parts.every((m) => m[1] && m[2])) url = "https://sportsbook.fanduel.com/addToBetslip?" + parts.map((m, i) => `marketId%5B${i}%5D=${m[1]}&selectionId%5B${i}%5D=${m[2]}`).join("&");
        } else if (key === "draftkings") {
          const toks = legs.map((l) => l.betSid ? encodeURIComponent(String(l.betSid)) : null);
          if (toks.every(Boolean)) url = `https://sportsbook.draftkings.com/?outcomes=${toks.join(",")}`;
        } else if (key === "betmgm") {
          const trips = legs.map((l) => (String(l.betLink || "").match(/options=(\d+-\d+-\d+)/) || [])[1]);
          if (trips.every(Boolean) && cfg.state) url = `https://sports.${cfg.state}.betmgm.com/en/sports?options=${trips.join(",")}&type=combo`;
        } else if (key === "betrivers") {
          const sids = legs.map((l) => l.betSid).filter(Boolean);
          const ev = (String(legs[0].betLink || "").match(/#event\/(\d+)/) || [])[1];
          if (sids.length === legs.length && ev && cfg.state) url = `https://${cfg.state}.betrivers.com/?page=sportsbook#event/${ev}?coupon=combination|${sids.join(",")}|`;
        } else if (key === "hardrockbet") {
          const sids = legs.map((l) => l.betSid).filter(Boolean);
          if (sids.length === legs.length) url = `https://app.hardrock.bet/?deep_link_value=betslip/${sids.join(",")}`;
        }
      } catch (_) { url = null; }
      if (!url) return "";
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;margin-top:8px;padding:9px 0;border-radius:8px;border:1px solid #4C1D95;background:rgba(167,139,250,0.10);color:#A78BFA;font-size:12px;font-weight:700;text-decoration:none;">↗ Open slip in ${escapeHtml(bookDisplay)} (${legs.length} legs)</a>`;
    }
    window._slipRecord = async function (btnEl) {
      const legs = window._slipTray;
      const out = document.getElementById("slip-result");
      if (!legs.length || !out) return;
      const stake = Math.max(1, Math.round(Number(document.getElementById("slip-stake")?.value) || 1));
      const oddsIn = Number(document.getElementById("slip-odds")?.value);
      if (!Number.isFinite(oddsIn) || oddsIn === 0) {
        out.innerHTML = `<div style="background:#450A0A;border-left:3px solid #F87171;border-radius:6px;padding:8px 10px;color:#FECACA;">Enter the combined odds YOUR book shows on the slip (e.g. +450) — the record must match the real ticket, never our estimate.</div>`;
        return;
      }
      btnEl.disabled = true; btnEl.textContent = "Recording…";
      try {
        const r = await fetch(`${API}/api/ws/place-bet`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: "parlay",
            sport: legs[0].sport || "mlb",
            book: legs[0].sportsbook || legs[0].book,
            stake,
            odds: oddsIn,
            legs: legs.map((l) => ({ player: l.player, stat: l.statFamily, propType: l.propType || null, marketKey: l.marketKey || null, side: l.side, line: l.line })),
          }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
          out.innerHTML = `<div style="background:#052E16;border-left:3px solid #34D399;border-radius:6px;padding:8px 10px;color:#BBF7D0;">✓ Parlay recorded — $${d.bet.stake} to win $${d.bet.toWin}<br/>${escapeHtml(String(d.warning || ""))}</div>`;
          btnEl.textContent = "Recorded ✓";
        } else if (d && d.reason === "already_recorded") {
          out.innerHTML = `<div style="background:#451A03;border-left:3px solid #FBBF24;border-radius:6px;padding:8px 10px;color:#FDE68A;">Already recorded today — nothing written twice.</div>`;
          btnEl.textContent = "Already recorded";
        } else {
          out.innerHTML = `<div style="background:#450A0A;border-left:3px solid #F87171;border-radius:6px;padding:8px 10px;color:#FECACA;">✗ ${escapeHtml(String(d.error || `HTTP ${r.status}`))}</div>`;
          btnEl.disabled = false; btnEl.textContent = "I bet this parlay — retry";
        }
      } catch (err) {
        out.innerHTML = `<div style="background:#450A0A;border-left:3px solid #F87171;border-radius:6px;padding:8px 10px;color:#FECACA;">✗ ${escapeHtml(String(err?.message || err))}</div>`;
        btnEl.disabled = false; btnEl.textContent = "I bet this parlay — retry";
      }
    };

    // ── 2026-07-07 TEST-LINKS panel (dev flag: /m?dev=1) ─────────────────────
    // Field-test doctrine: links compose FRESH at open time from the live
    // snapshot (stale SIDs dump to homepages) and the phone is the only honest
    // test surface. Each link gets 3 verdict buttons that POST straight to
    // /api/ws/deeplink-verdict — taps become recorded data, no transcription.
    if (/[?&]dev=1/.test(location.search)) {

      devBtn.innerHTML = `<button onclick="window._tlOpen()" style="position:fixed;left:10px;bottom:64px;z-index:70;padding:8px 12px;border-radius:8px;border:1px solid #4C1D95;background:#1E1B4B;color:#A78BFA;font-size:12px;font-weight:700;cursor:pointer;">🧪 TEST LINKS</button><div id="tl-panel" style="position:fixed;left:10px;right:10px;bottom:110px;z-index:70;display:none;max-height:60vh;overflow-y:auto;background:#141828;border:1px solid #334155;border-radius:10px;padding:12px;"></div>`;

    window._tlOpen = async function () {
