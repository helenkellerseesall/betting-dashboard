      main.innerHTML = summaryHtml + legsHtml + cashoutCardHtml + `<div class="diag-footer">parlay v0.2.0 · persisted in browser · single-book discipline enforced</div>`;
    }

    // Phase Cashout-Surface-1A — POST the built parlay to /api/ws/cashout (reuses
    // backend cashoutHedge + vigStripping + correlation). Pure display; no auto-bet.
    window.cashoutCalc = async function () {
      const out = document.getElementById("coResult");
      const stake = Number(document.getElementById("coStake").value) || 0;
      if (stake <= 0) { out.innerHTML = `<div class="co-err">Enter a stake greater than 0.</div>`; return; }
      const hedgeRaw = (document.getElementById("coHedge").value || "").trim();
      const jointRaw = (document.getElementById("coJoint").value || "").trim();
      const legs = state.parlay.map((l, i) => ({
        oddsAmerican: l.oddsAmerican ?? l.odds, matchup: l.matchup || null,
        side: l.side || null, statFamily: l.statFamily || null, team: l.team || null, player: l.player || null,
        status: (document.querySelector(`[data-coleg="${i}"]`) || {}).checked ? "won" : "pending",
      }));
      const body = { stake, legs };
      if (hedgeRaw) body.hedgeOdds = Number(hedgeRaw);
      if (jointRaw) { const jn = Number(jointRaw); if (Number.isFinite(jn)) body.jointPendingProb = jn > 1 ? jn / 100 : jn; }
      out.innerHTML = "Calculating…";
      try {
        const r = await fetch(`${API}/api/ws/cashout`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const j = await r.json();
        if (!j.ok) { out.innerHTML = `<div class="co-err">${escapeHtml(j.error || "error")}</div>`; return; }
        out.innerHTML = renderCashoutResult(j);
      } catch (e) { out.innerHTML = `<div class="co-err">${escapeHtml(String((e && e.message) || e))}</div>`; }
    };

    function renderCashoutResult(j) {
      const $ = (x) => x == null ? "—" : "$" + (Math.round(x * 100) / 100).toFixed(2);
      const pct = (x) => x == null ? "—" : (x * 100).toFixed(1) + "%";
      const c = j.cashout || {};
      let html = "";
      if (c.fairCashout != null) {
        html += `<div class="co-big">${$(c.fairCashout)}</div>`;
        html += `<div class="co-src">fair cash-out value · potential return ${$(c.potentialReturn)} × ${pct(j.jointPending)} (${escapeHtml(j.jointMethod || "")})</div>`;
        if (c.offerBand) html += `<div class="co-line"><span class="lbl">book will likely offer (70–90%)</span><span>${$(c.offerBand.low)} – ${$(c.offerBand.high)}</span></div>`;
      } else {
        html += `<div class="co-src">${escapeHtml(c.note || "fair value unavailable — enter pending hit% or per-leg odds")}</div>`;
        if (c.potentialReturn != null) html += `<div class="co-line"><span class="lbl">potential return if all hit</span><span>${$(c.potentialReturn)}</span></div>`;
      }
      const pend = (j.perLeg || []).filter(l => l.status === "pending");
      if (pend.length) html += `<div class="co-src">pending: ` + pend.map(l => `${escapeHtml(l.player || "?")} ${pct(l.prob)} (${escapeHtml(l.source || "?")})`).join(" · ") + `</div>`;
      if (j.hedge && !j.hedge.error) {
        html += `<div class="co-line" style="margin-top:8px"><span class="lbl">hedge stake (opposite side)</span><span>${$(j.hedge.hedgeStake)}</span></div>`;
        html += `<div class="co-line"><span class="lbl co-lock">locks either way</span><span class="co-lock">${$(j.hedge.lockedProfit)}</span></div>`;
        html += `<div class="co-src">if parlay hits: ${$(j.hedge.ifParlayWins)} · if it misses: ${$(j.hedge.ifParlayLoses)}${j.hedge.lockedProfit < 0 ? " — caps a loss, not a profit" : ""}</div>`;
      } else if (j.hedge && j.hedge.error) {
        html += `<div class="co-err">${escapeHtml(j.hedge.error)}</div>`;
      }
      (j.notes || []).forEach(n => html += `<div class="co-note">⚠ ${escapeHtml(n)}</div>`);
      html += `<div class="co-src" style="margin-top:6px">read-only calculator · never auto-bets</div>`;
      return html;
    }

    // ─────────────────────────────────────────────────────────────
    // v0.2.1: Analyze tab — Flow A "should I tail this slip?"
    // Backend route: POST /api/ws/screenshots/ingest (JSON only — no OCR yet)
    // Returns: verdict with archetype, compositeScore, sharp/bait signals
    // ─────────────────────────────────────────────────────────────
    function renderAnalyze(main) {
      const a = state.analyze;
      // v0.2.2: prop options include milestone bets (yes/no) for SGP-style slips
      const propOptions = [
        // MLB threshold props
        "Hits", "Home Runs", "Total Bases", "RBIs", "Runs Scored",
        "Stolen Bases", "Strikeouts", "Walks", "Hit a HR",
        // NBA threshold props
        "Points", "Rebounds", "Assists", "Threes", "PRA",
        "Steals", "Blocks", "Pts+Reb", "Pts+Ast", "Reb+Ast",
        // NBA milestone (yes/no)
        "Double-Double", "Triple-Double", "First Basket",
        // NFL milestone (yes/no, future)
        "Anytime TD",
        // Soccer milestone
        "Anytime Goal",
        "Other"
      ];
      const bookOptions = ["DraftKings", "FanDuel", "Fanatics", "BetMGM", "Hard Rock", "BetRivers", "bet365"];
      const sourceOptions = [
        ["twitter", "X / Twitter"], ["discord", "Discord"],
        ["screenshot", "Screenshot"], ["sportsbook", "Sportsbook screenshot"],
        ["viral", "Viral big-win"], ["guru", "Tout / capper"],
        ["personal", "Mine"]
      ];

      const introHtml = `
        <div class="analyze-intro">
          Drop the legs from a slip you saw on X / Discord / a friend's screenshot. I'll score the slip's
          <strong>sharpness</strong>, detect bait patterns, and tell you whether it's tail-worthy or fade-worthy.
          <span class="ocr-note">Image OCR coming next session — for now, type the legs manually as you see them on screen.</span>
        </div>
      `;

      const metaHtml = `
        <div class="meta-row">
          <select id="anaSourceType" onchange="updateAnalyzeMeta('sourceType', this.value)">
            ${sourceOptions.map(([v, l]) => `<option value="${v}" ${a.meta.sourceType === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
          <select id="anaSport" onchange="updateAnalyzeMeta('sport', this.value)">
            <option value="" ${!a.meta.sport ? "selected" : ""}>auto-detect sport</option>
            <option value="mlb" ${a.meta.sport === "mlb" ? "selected" : ""}>MLB</option>
            <option value="nba" ${a.meta.sport === "nba" ? "selected" : ""}>NBA</option>
          </select>
        </div>
        <div class="meta-row">
          <input id="anaAttribution" placeholder="Poster name (optional) — e.g. @SomeCapper"
                 value="${escapeHtml(a.meta.attribution || "")}"
                 oninput="updateAnalyzeMeta('attribution', this.value)" />
        </div>
      `;

      const legsHtml = a.legs.map((leg, i) => {
        const isMilestone = isMilestoneProp(leg.propType);
        // Side dropdown adapts to prop type — milestone = Yes/No, threshold = Over/Under
        const sideOptions = isMilestone
          ? [["yes", "Yes (Hits)"], ["no", "No (Misses)"]]
          : [["over", "Over"], ["under", "Under"]];
        // Line input hidden for milestone props (no line needed)
        const lineInput = isMilestone
          ? `<input placeholder="—" type="text" disabled value="" style="opacity: 0.4;" />`
          : `<input placeholder="Line (e.g. 1.5 or 19.5)" type="number" step="0.5" inputmode="decimal"
                    value="${leg.line}" oninput="updateAnalyzeLeg(${i}, 'line', this.value)" />`;
        return `
          <div class="leg-form" data-leg-idx="${i}">
            <div class="leg-form-header">
              <div class="leg-form-title">Leg ${i + 1}</div>
              ${a.legs.length > 1 ? `<button class="leg-form-remove" onclick="removeAnalyzeLeg(${i})">×</button>` : ""}
            </div>
            <input class="full" placeholder="Player name (e.g. Jalen Williams)"
                   value="${escapeHtml(leg.player || "")}"
                   oninput="updateAnalyzeLeg(${i}, 'player', this.value)" />
            <div class="leg-form-grid">
              <select onchange="onPropTypeChange(${i}, this.value)">
                ${propOptions.map(p => `<option value="${p}" ${leg.propType === p ? "selected" : ""}>${p}</option>`).join("")}
              </select>
              <select onchange="updateAnalyzeLeg(${i}, 'side', this.value)">
                ${sideOptions.map(([v, l]) => `<option value="${v}" ${leg.side === v ? "selected" : ""}>${l}</option>`).join("")}
              </select>
              ${lineInput}
              <input placeholder="Odds (+150 or -110)" type="text" inputmode="numeric"
                     value="${leg.odds}"
                     oninput="updateAnalyzeLeg(${i}, 'odds', this.value)" />
              <select class="full" onchange="updateAnalyzeLeg(${i}, 'sportsbook', this.value)">
                ${bookOptions.map(b => `<option value="${b}" ${leg.sportsbook === b ? "selected" : ""}>${b}</option>`).join("")}
              </select>
            </div>
          </div>
        `;
      }).join("");

      // v0.2.3: image OCR via Anthropic Vision — drop a screenshot, get legs.
      // Phase A.5: removed the redundant Quick-Paste textarea — operator said
      // OCR makes it unnecessary. If OCR breaks, paste-parse is still
      // available via parseAndPopulate() as a fallback handler (no UI).
      const ocrStatus = state.analyze.ocrStatus || "";
      const ocrHtml = `
        <div class="leg-form" style="border-color: rgba(56, 189, 248, 0.5); background: linear-gradient(180deg, #11202E 0%, #141828 100%);">
          <div class="leg-form-title" style="margin-bottom: 6px;">📸 Drop a screenshot (Claude Vision OCR)</div>
          <!-- Phase Screenshot-FE-Ingest-Fix-1A: multi-file. Drop as many as you want;
               each one is OCR'd + auto-submitted sequentially. -->
          <input type="file" id="anaImageInput" accept="image/*" multiple style="display: none;"
                 onchange="handleImageFiles(this.files)" />
          <button onclick="document.getElementById('anaImageInput').click()" class="add-leg-form-btn" style="margin-top: 0; margin-bottom: 6px;">
            📷 Choose images (multiple OK)
          </button>
          <div id="anaOcrStatus" style="font-size: 11px; color: ${ocrStatus.includes("error") ? "#F87171" : ocrStatus.includes("Parsed") ? "#34D399" : "#9CA3AF"}; min-height: 14px; text-align: center; padding: 2px 0;">
            ${escapeHtml(ocrStatus) || "Or paste an image (Cmd-V) anywhere on this page."}
          </div>
        </div>
      `;

      const validLegs = a.legs.filter(legHasMinFields).length;
      const canSubmit = validLegs >= 1 && !a.submitting;

      const submitHtml = `
        <button class="add-leg-form-btn" onclick="addAnalyzeLeg()">+ Add another leg</button>
        <button class="analyze-submit-btn" onclick="submitAnalyze()" ${canSubmit ? "" : "disabled"}>
          ${a.submitting ? "Analyzing…" : `Analyze Slip (${validLegs} leg${validLegs === 1 ? "" : "s"})`}
        </button>
      `;

      const resultHtml = a.result ? renderVerdict(a.result) : "";

      // Phase Screenshot-Operator-Visible-1A — "Your Taste Profile" card.
      // Anti-fabrication: empty state when no profile yet, honest about what's
      // wired vs pending (active biasing still Phase 2C-2).
      const tasteHtml = renderTasteProfile(a.tasteProfile);

      main.innerHTML = introHtml + tasteHtml + metaHtml + ocrHtml + legsHtml + submitHtml + resultHtml +
        `<div class="diag-footer">analyze v0.2.4 · Claude Vision OCR + multi-file ingest + loop closure (Phases #5/#2/#3/#4 active)</div>`;

      // Lazy-load taste profile on first render OR when stale.
      if (!a.tasteProfile || (a.tasteProfileFetchedAt && Date.now() - a.tasteProfileFetchedAt > 30000)) {
        fetchTasteProfile();
      }
    }

    // Phase Screenshot-Operator-Visible-1A — fetch operator's aggregated
    // taste profile from backend. Refreshes after each ingest (since the
    // profile mutated). Anti-fabrication: failures surface as null, never
    // synthesized data.
    async function fetchTasteProfile() {
      try {
        const r = await fetch(`${API}/api/ws/screenshots/taste-profile`, { cache: "no-store" });
        const j = await r.json();
        if (j.ok) {
          state.analyze.tasteProfile = j;
          state.analyze.tasteProfileFetchedAt = Date.now();
          // Re-render the card without disrupting the form
          const el = document.getElementById("tasteProfileCard");
          if (el) el.outerHTML = renderTasteProfile(j);
        }
      } catch (_) { /* anti-fabrication: silent on failure, no UI noise */ }
    }
    window.fetchTasteProfile = fetchTasteProfile;

    function renderTasteProfile(p) {
      // Empty state — honest about the absence of data
      if (!p || !p.ok || !p.taste?.hasSignal) {
        return `<div class="card" id="tasteProfileCard" style="margin-bottom: 12px; border: 1px solid rgba(168, 162, 158, 0.2);">
          <div style="font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;">Your taste profile</div>
          <div style="color: var(--text-faint); font-size: 13px;">
            Drop a few slips and we'll learn your pattern. ${p?.taste?.reason ? `(${p.taste.reason})` : ""}
          </div>
        </div>`;
      }

      const t = p.taste;
      const archetypeChips = (t.preferred_archetypes || []).slice(0, 5).map(a => {
        const hit = Number.isFinite(a.hit_rate) ? ` · ${(a.hit_rate * 100).toFixed(0)}% hit (n=${a.count})` : ` · n=${a.count}`;
        return `<span style="display: inline-block; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 4px; padding: 2px 8px; margin: 2px; font-size: 11px; color: #38BDF8;">${escapeHtml(a.archetype)}${escapeHtml(hit)}</span>`;
      }).join("");

      const avgLegs = Number.isFinite(t.preferred_leg_count_avg) ? t.preferred_leg_count_avg.toFixed(1) : "—";
      const avgDec = Number.isFinite(t.preferred_combined_dec_avg) ? t.preferred_combined_dec_avg.toFixed(1) : "—";
      const americanFromDec = Number.isFinite(t.preferred_combined_dec_avg) && t.preferred_combined_dec_avg > 1
        ? "+" + Math.round((t.preferred_combined_dec_avg - 1) * 100)
        : "—";

      const sports = Object.entries(t.preferred_sports || {})
        .sort(([, a], [, b]) => b - a)
        .map(([s, n]) => `${s.toUpperCase()}: ${n}`)
        .join(" · ");

      const biasNote = p.engineBehavior?.activeBias
        ? `<div style="color: #34D399; font-size: 11px; margin-top: 8px;">✓ Engine actively biases picks toward your taste pattern.</div>`
        : `<div style="color: #FBBF24; font-size: 11px; margin-top: 8px;">⚠ Engine LOGS your taste signal but does not yet shape picks toward it. Active biasing ships in Phase 2C-2 (queued).</div>`;

      const outcomeNote = (p.outcomeCounts?.graded_legs || 0) > 0
        ? `<div style="color: #34D399; font-size: 11px;">${p.outcomeCounts.hit_legs}/${p.outcomeCounts.graded_legs} legs hit (${p.outcomeCounts.total_legs} total tracked)</div>`
        : `<div style="color: var(--text-faint); font-size: 11px;">No legs graded yet — outcomes populate when your slip dates overlap with the engine's tracked picks.</div>`;

      return `<div class="card" id="tasteProfileCard" style="margin-bottom: 12px; border: 1px solid rgba(56, 189, 248, 0.4); background: linear-gradient(180deg, rgba(56, 189, 248, 0.08) 0%, rgba(20, 24, 40, 0.6) 100%);">
        <div style="font-size: 11px; color: #38BDF8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; font-weight: 600;">Your taste profile · ${t.sample_count} slip${t.sample_count === 1 ? "" : "s"} seen</div>

        <div style="font-size: 13px; line-height: 1.6; color: var(--text); margin-bottom: 8px;">
          You share <strong>${avgLegs}-leg parlays</strong> averaging <strong>${avgDec}x</strong> payout (~<strong>${americanFromDec}</strong> American).
          Sports: <strong>${escapeHtml(sports || "—")}</strong>.
        </div>

        <div style="margin-bottom: 6px;">
          <div style="font-size: 10px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 4px;">Archetype mix${t.graded_count > 0 ? "" : " (frequency-based · 0 graded yet)"}</div>
          ${archetypeChips || '<span style="color: var(--text-faint); font-size: 11px;">no signal</span>'}
        </div>

        ${outcomeNote}
        ${biasNote}

        <div style="border-top: 1px solid rgba(168, 162, 158, 0.15); margin-top: 10px; padding-top: 8px; font-size: 10px; color: var(--text-faint);">
          Stored in SQLite (betting.db) · persistent · rolling means weight all history equally · ${p.taste.profile_count} distinct source profile${p.taste.profile_count === 1 ? "" : "s"}
        </div>
      </div>`;
    }
    window.renderTasteProfile = renderTasteProfile;

    // Phase Screenshot-FE-Ingest-Fix-1A — multi-file handler. Operator can
    // drop N screenshots at once; we OCR + auto-submit each one sequentially
    // (don't parallelize — Claude Vision rate limits). Each ingest writes a
    // bettor_profiles update via Phase 2A hook + slip_classifications row.
    // After all done, show a per-slip summary.
    async function handleImageFiles(filesList) {
      const files = Array.from(filesList || []);
      if (!files.length) return;
      const total = files.length;
      const statusEl = document.getElementById("anaOcrStatus");
      const setStatus = (msg, color) => {
        if (statusEl) {
          statusEl.textContent = msg;
          if (color) statusEl.style.color = color;
        }
        state.analyze.ocrStatus = msg;
      };
      const results = [];
      for (let i = 0; i < total; i++) {
        const f = files[i];
        setStatus(`Processing image ${i + 1}/${total}: ${f.name || "screenshot"}…`, "#38BDF8");
        const result = await handleImageFile(f, { autoSubmit: true, suppressStatusReset: true });
        results.push({ file: f.name || `image_${i + 1}`, ...result });
      }
      const okCount = results.filter(r => r.ok).length;
      const archetypes = results.filter(r => r.archetype).map(r => r.archetype);
      const summary = `✓ ${okCount}/${total} ingested` +
        (archetypes.length ? ` · archetypes: ${archetypes.join(", ")}` : "");
      setStatus(summary, okCount === total ? "#34D399" : "#FBBF24");
      // Phase Screenshot-Operator-Visible-1A — refresh taste profile card
      // so operator IMMEDIATELY sees what was learned from the new slips.
      try { await fetchTasteProfile(); } catch (_) {}
    }
    window.handleImageFiles = handleImageFiles;

    // v0.2.3: Image upload + OCR via /api/ws/screenshots/ocr.
    // Phase Screenshot-FE-Ingest-Fix-1A — returns { ok, archetype, error }
    // so the multi-file caller can aggregate results. autoSubmit: when true,
    // automatically calls submitAnalyze() after OCR populates the form.
    async function handleImageFile(file, { autoSubmit = false, suppressStatusReset = false } = {}) {
      if (!file) return { ok: false, error: "no file" };
      const statusEl = document.getElementById("anaOcrStatus");
      const setStatus = (msg, color) => {
        if (suppressStatusReset) return;  // multi-file caller manages its own status
        if (statusEl) {
          statusEl.textContent = msg;
          if (color) statusEl.style.color = color;
        }
        state.analyze.ocrStatus = msg;
      };
      if (file.size > 9 * 1024 * 1024) {
        setStatus("Image too large (>9MB). Try a screenshot crop.", "#F87171");
        return { ok: false, error: "too_large" };
      }
      setStatus("Reading image…", "#9CA3AF");
      try {
        // v0.2.4: convert ANY input image to JPEG via canvas. Handles HEIC,
        // HEIF, and any other format iPhone Safari might hand us. Anthropic
        // Vision only accepts jpeg/png/gif/webp, so we normalize to jpeg.
        // Also caps max dimension at 1600px to keep request size reasonable.
        const dataUrl = await convertImageToJpeg(file, 1600, 0.9);
        setStatus("Sending to Claude Vision…", "#38BDF8");
        const r = await fetch(`${API}/api/ws/screenshots/ocr`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64: dataUrl, mediaType: "image/jpeg" }),
        });
        const json = await r.json();
        if (!r.ok || !json.ok) {
          if (json?.code === "ANTHROPIC_KEY_MISSING") {
            setStatus("Need ANTHROPIC_API_KEY in backend .env.", "#F87171");
          } else {
            setStatus(`OCR error: ${json?.error || `HTTP ${r.status}`}`, "#F87171");
          }
          return { ok: false, error: json?.error || `HTTP ${r.status}` };
        }
        if (!Array.isArray(json.legs) || json.legs.length === 0) {
          setStatus("Couldn't read any legs from this image. Try a clearer crop.", "#FBBF24");
          return { ok: false, error: "no_legs_parsed" };
        }
        // Populate legs from OCR result
        // Phase Screenshot-FE-Ingest-Fix-1A — auto-fill line=0.5 for milestone
        // markets (HR, "Anytime TD", etc.) when OCR returns no explicit line.
        // Otherwise legHasMinFields rejects → button greyed → no submit.
        state.analyze.legs = json.legs.map(l => {
          const isMilestone = isMilestoneProp(l.propType);
          return {
            player: l.player || "",
            propType: l.propType || "Points",
            line: l.line == null ? (isMilestone ? "0.5" : "") : String(l.line),
            side: l.side || (isMilestone ? "yes" : "over"),
            odds: l.odds == null ? "" : String(l.odds),
            sportsbook: l.sportsbook || json.sportsbook || "DraftKings",
          };
        });
        const noteParts = [`Parsed ${json.legs.length} legs from image`];
        if (json.sportsbook) noteParts.push(`book: ${json.sportsbook}`);
        if (json.combinedOdds) noteParts.push(`combined: +${json.combinedOdds}`);
        setStatus(`✓ ${noteParts.join(" · ")}`, "#34D399");
        render();

        // Phase Screenshot-FE-Ingest-Fix-1A — auto-submit when caller asked
        // (multi-file path). Operator's flow: drop image → done, no clicks.
        if (autoSubmit) {
          try {
            // Phase Screenshot-FE-Ingest-Fix-1B — multi-file path skips verdict.
            const submitResult = await submitAnalyze({ silent: true, skipVerdict: true });
            return { ok: true, archetype: submitResult?.archetype, legs: state.analyze.legs.length };
          } catch (e) {
            return { ok: false, error: "submit_failed: " + (e?.message || e) };
          }
        }
        return { ok: true, legs: state.analyze.legs.length };
      } catch (e) {
        setStatus(`OCR error: ${e.message || String(e)}`, "#F87171");
        return { ok: false, error: e?.message || String(e) };
      }
    }
    window.handleImageFile = handleImageFile;

    // v0.2.4: Convert any browser-readable image (HEIC/HEIF/JPEG/PNG/WebP) to
    // a clean JPEG data URL via canvas. Bulletproof against iPhone HEIC.
    // Also resizes to maxDim so we don't send 4000x3000 screenshots.
    async function convertImageToJpeg(file, maxDim, quality) {
      const objectUrl = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error("Image could not be decoded (unsupported format?)"));
          i.src = objectUrl;
        });
        // Compute resize dimensions preserving aspect ratio
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        // White background — JPEG doesn't support alpha, prevents black bg on PNGs
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        return canvas.toDataURL("image/jpeg", quality);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    // Page-level paste handler — operator copies an image (Cmd-V on Mac, share-paste
    // on iPhone), we route it into the OCR flow. Only fires when ANALYZE tab is active.
    document.addEventListener("paste", (e) => {
      if (state.activeSport !== "analyze") return;
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            handleImageFile(file);
            return;
          }
        }
      }
    });

    // v0.2.2: prop type change handler — also auto-flips side to "yes" when
    // switching to a milestone prop, and clears the line (not applicable).
    function onPropTypeChange(idx, newPropType) {
      const leg = state.analyze.legs[idx];
      if (!leg) return;
      leg.propType = newPropType;
      if (isMilestoneProp(newPropType)) {
        leg.side = "yes";
        leg.line = "";
      } else if (leg.side === "yes" || leg.side === "no") {
        leg.side = "over";
      }
      render();
    }

    // v0.2.2: pasted-text → structured legs parser.
    // Handles common formats: "X To Score Y+ Points", "X Y+ Points", "X Over Y.5",
    // "X To Record A Double-Double", "X Anytime Touchdown", "X HR", etc.
    function parseSlipText(text) {
      if (!text || typeof text !== "string") return [];
      const legs = [];
      // Split on commas and "and" — common slip delimiters
      const chunks = text
        .replace(/\bAND\b/gi, ",")
        .replace(/[\r\n]+/g, ",")
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);

      const PROP_KEYWORDS = [
        // [regex, propType, sport]
        [/\bpoints?\b/i, "Points"],
        [/\brebounds?\b/i, "Rebounds"],
        [/\bassists?\b/i, "Assists"],
        [/\bthrees?\b|\b3\s*-?\s*pointers?\b|\b3pt\b/i, "Threes"],
        [/\bsteals?\b/i, "Steals"],
        [/\bblocks?\b/i, "Blocks"],
        [/\bpra\b|\bpts\s*\+\s*reb\s*\+\s*ast\b/i, "PRA"],
        [/\bpts\s*\+\s*reb\b|\bpoints\s*\+\s*rebounds\b/i, "Pts+Reb"],
        [/\bpts\s*\+\s*ast\b|\bpoints\s*\+\s*assists\b/i, "Pts+Ast"],
        [/\breb\s*\+\s*ast\b|\brebounds\s*\+\s*assists\b/i, "Reb+Ast"],
        [/\bhome\s*runs?\b|\bhr\b/i, "Home Runs"],
        [/\btotal\s*bases?\b|\btb\b/i, "Total Bases"],
        [/\bhits?\b/i, "Hits"],
        [/\brbis?\b/i, "RBIs"],
        [/\bruns?\s*scored\b|\bruns?\b/i, "Runs Scored"],
        [/\bstolen\s*bases?\b|\bsb\b/i, "Stolen Bases"],
        [/\bstrikeouts?\b|\bks?\b/i, "Strikeouts"],
        [/\bwalks?\b|\bbb\b/i, "Walks"],
      ];
      const MILESTONE_KEYWORDS = [
        [/\bdouble[- ]?double\b/i, "Double-Double"],
        [/\btriple[- ]?double\b/i, "Triple-Double"],
        [/\bfirst\s*basket\b/i, "First Basket"],
        [/\banytime\s*touchdown\b|\banytime\s*td\b/i, "Anytime TD"],
        [/\banytime\s*goal\s*(scorer)?\b/i, "Anytime Goal"],
        [/\bto\s*hit\s*a?\s*hr\b|\bto\s*hit\s*a?\s*home\s*run\b|\bhr\b|\bhome\s*run\b/i, "Hit a HR"],
      ];

      for (const chunk of chunks) {
        let propType = null;
        let isMilestone = false;
        // Try milestones first (more specific)
        for (const [re, p] of MILESTONE_KEYWORDS) {
          if (re.test(chunk)) { propType = p; isMilestone = true; break; }
        }
        // Fall back to threshold props
        if (!propType) {
          for (const [re, p] of PROP_KEYWORDS) {
            if (re.test(chunk)) { propType = p; break; }
          }
        }
        if (!propType) continue;  // chunk doesn't look like a prop

        // Extract threshold/line: patterns like "20+", "Over 19.5", "Under 22.5", "1+"
        let line = "";
        let side = isMilestone ? "yes" : "over";
        const plusMatch = chunk.match(/(\d+(?:\.\d+)?)\s*\+/);
        const overMatch = chunk.match(/\bover\s*(\d+(?:\.\d+)?)/i);
        const underMatch = chunk.match(/\bunder\s*(\d+(?:\.\d+)?)/i);
        if (underMatch) {
          line = String(Number(underMatch[1]));
          side = "under";
        } else if (overMatch) {
          line = String(Number(overMatch[1]));
          side = "over";
        } else if (plusMatch && !isMilestone) {
          // "20+" → over 19.5 (the threshold convention sportsbooks use)
          const n = Number(plusMatch[1]);
          line = String(n - 0.5);
          side = "over";
        }

        // Extract player name: take everything before the prop keyword,
        // strip common slip-language like "To Score", "To Record", "A".
        let beforeProp = chunk;
        if (propType) {
          const re = new RegExp(`^(.*?)\\s+(to\\s+(score|record|hit|get|reach|have)\\s+(a\\s+)?)?\\d*\\+?\\s*${propType.replace(/[-+]/g, "\\$&")}`, "i");
          // Simpler: just take text before the first keyword match
          const firstKeywordMatch = chunk.search(/\b(points?|rebounds?|assists?|threes?|3pt|pra|pts|home\s*runs?|hr|hits?|rbis?|runs?|stolen|strikeouts?|ks?|walks?|bb|double[- ]?double|triple[- ]?double|first\s*basket|anytime|to\s+(score|record|hit))\b/i);
          if (firstKeywordMatch > 0) {
            beforeProp = chunk.slice(0, firstKeywordMatch).trim();
          }
        }
        // Clean: strip "To", trailing punctuation, etc.
        const player = beforeProp
          .replace(/\s+to$/i, "")
          .replace(/\s+(over|under)$/i, "")
          .replace(/[,;.]+$/, "")
          .trim();
        if (!player || player.length < 2) continue;

        legs.push({
          player,
          propType,
          side,
          line,
          odds: "",          // operator fills in
          sportsbook: state.analyze.legs[0]?.sportsbook || "DraftKings",
        });
      }
      return legs;
    }

    function parseAndPopulate() {
      const textarea = document.getElementById("anaPasteText");
      if (!textarea) return;
      const text = textarea.value;
      if (!text || !text.trim()) return;
      const parsed = parseSlipText(text);
      if (parsed.length === 0) {
        alert("Couldn't parse any legs from that text. Try a format like:\n\nJalen Williams 20+ Points, Wembanyama 30+ Points, SGA 8+ Assists, Stephon Castle Double-Double");
        return;
      }
      state.analyze.legs = parsed;
      textarea.value = "";
      render();
    }

    window.onPropTypeChange = onPropTypeChange;
    window.parseAndPopulate = parseAndPopulate;

    function legHasMinFields(leg) {
      // v0.2.3: operator feedback — sportsbook screenshots usually only show
      // the COMBINED parlay odds, not per-leg odds. So per-leg odds are now
      // OPTIONAL. Milestone props (Double-Double etc.) don't need line either.
      if (!String(leg.player || "").trim()) return false;
      if (!isMilestoneProp(leg.propType) && !String(leg.line ?? "").length) return false;
      return true;
    }

    function updateAnalyzeMeta(key, val) {
      state.analyze.meta[key] = val;
      // No re-render needed — just store. Re-render only on add/remove legs.
    }

    function updateAnalyzeLeg(idx, key, val) {
      if (!state.analyze.legs[idx]) return;
      state.analyze.legs[idx][key] = val;
      // Don't re-render on every keystroke — only update the submit button enabled state.
      const validLegs = state.analyze.legs.filter(legHasMinFields).length;
      const btn = document.querySelector(".analyze-submit-btn");
      if (btn) {
        btn.disabled = !(validLegs >= 1 && !state.analyze.submitting);
        btn.textContent = state.analyze.submitting ? "Analyzing…" : `Analyze Slip (${validLegs} leg${validLegs === 1 ? "" : "s"})`;
      }
    }

    function addAnalyzeLeg() {
      // Default new leg to same book as previous leg for single-book discipline
      const lastBook = state.analyze.legs.length > 0
        ? state.analyze.legs[state.analyze.legs.length - 1].sportsbook
        : "DraftKings";
      const newLeg = emptyLeg();
      newLeg.sportsbook = lastBook;
      state.analyze.legs.push(newLeg);
      render();
    }

    function removeAnalyzeLeg(idx) {
      if (state.analyze.legs.length <= 1) return;
      state.analyze.legs.splice(idx, 1);
      render();
    }

    // Phase Screenshot-FE-Ingest-Fix-1A — accept { silent } param so multi-file
    // caller can submit without triggering full re-render between iterations.
    // Returns { ok, archetype, error } for caller-side result aggregation.
    // Phase Screenshot-FE-Ingest-Fix-1B — accept { skipVerdict } to bypass
    // the slow VBI verdict step in multi-file mode (loop closure needs only
    // classification + bettor profile, not the projection lookup).
    async function submitAnalyze({ silent = false, skipVerdict = false } = {}) {
      const a = state.analyze;
      const legs = a.legs.filter(legHasMinFields).map(leg => {
        const rawOdds = String(leg.odds || "").replace(/[+\s]/g, "");
        const oddsNum = rawOdds ? Number(rawOdds) : null;
        const milestone = isMilestoneProp(leg.propType);
        // v0.2.7: milestone props (Double-Double, Anytime HR, etc.) don't have
        // a line. Backend resolveSlipLegToPrediction.js requires line non-null
        // (fails MISSING_LINE → "could not map this leg" error). Pass synthetic
        // line=0.5 so resolution succeeds; downstream cognition can detect
        // milestone via propType.
        const lineValue = milestone
          ? 0.5
          : (leg.line === "" ? null : Number(leg.line));
        return {
          player: String(leg.player).trim(),
          statFamily: String(leg.propType).toLowerCase().replace(/\s+/g, "_"),
          propType: leg.propType,
          side: leg.side,
          line: lineValue,
          odds: Number.isFinite(oddsNum) ? oddsNum : null,
          sportsbook: leg.sportsbook,
        };
      });
      if (legs.length === 0) return { ok: false, error: "no_valid_legs" };

      // v0.2.5: auto-detect sport from prop types when operator left "auto-detect"
      // selected. Backend resolveSlipLegToPrediction bails MISSING_SPORT if sport
      // is null — every leg becomes "unresolved" which is why earlier slips
      // scored 1/100 UNKNOWN. Same for slateDate — default to today.
      const detectedSport = a.meta.sport || autoDetectSportFromLegs(legs);
      const todayDate = currentSlateDateEt();  // Phase Date-Doctrine-1B — ET slate date

      const payload = {
        sourceType:  a.meta.sourceType || "screenshot",
        sourceLabel: a.meta.attribution || null,
        attribution: a.meta.attribution || null,
        sport:       detectedSport,
        slateDate:   todayDate,
        slip:        { legs },
        // Phase Screenshot-FE-Ingest-Fix-1B — multi-file path opts out of the
        // slow VBI verdict computation. Loop closure only needs the persist +
        // classify + bettor_profile update steps.
        skipVerdict: !!skipVerdict,
      };

      a.submitting = true;
      a.result = null;
      render();

      try {
        // Phase Screenshot-FE-Ingest-Fix-1B — 30s timeout. Without this, a
        // hung backend (slow projection lookup, missing snapshot, etc.) leaves
        // the FE stuck in "Analyzing…" forever.
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 30000);
        const r = await fetch(`${API}/api/ws/screenshots/ingest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: ctrl.signal,
        });
        clearTimeout(tid);
        const json = await r.json();
        if (!r.ok || !json.ok) {
          a.result = { _error: json?.error || `HTTP ${r.status}` };
          return { ok: false, error: json?.error || `HTTP ${r.status}` };
        }
        a.result = json.results && json.results[0] ? json.results[0] : json;
        // Phase Screenshot-FE-Ingest-Fix-1A — extract archetype from response
        // so multi-file caller can show per-slip summary.
        const archetype = a.result?.archetype || a.result?.classification?.archetype || null;
        return { ok: true, archetype, result: a.result };
      } catch (e) {
        a.result = { _error: e.message || String(e) };
        return { ok: false, error: e.message || String(e) };
      } finally {
        a.submitting = false;
        if (!silent) render();
      }
    }

    function renderVerdict(r) {
      if (r._error) {
        return `<div class="verdict-card" style="border-color: rgba(248, 113, 113, 0.4);">
          <div style="color: #F87171; font-weight: 700; margin-bottom: 6px;">Analysis failed</div>
          <div style="font-family: ui-monospace, monospace; font-size: 11px; color: #9CA3AF;">${escapeHtml(r._error)}</div>
        </div>`;
      }
      const cs = Number(r.compositeScore);
      const csTxt = Number.isFinite(cs) ? Math.round(cs) : "—";
      const csCls = !Number.isFinite(cs) ? "" : cs >= 70 ? "high" : cs >= 50 ? "mid" : "low";
      const archetype = r.archetype || "unclassified";
      const signalsHtml = [];
      if (r.sharpSignal) signalsHtml.push(`<span class="verdict-signal vs-sharp">SHARP</span>`);
      if (r.baitSignal)  signalsHtml.push(`<span class="verdict-signal vs-bait">BAIT</span>`);
      if (r.verdict?.viral_signal) signalsHtml.push(`<span class="verdict-signal vs-viral">VIRAL</span>`);

      // v0.2.7: Build SLIP-LEVEL structural intelligence from the submitted
      // legs themselves. Even when deep cognition can't grade individual legs,
      // parlay math + structural read gives the operator real value.
      const legs = state.analyze.legs.filter(legHasMinFields);
      const structureHtml = renderSlipStructureAnalysis(legs);

      const verdict = r.verdict || null;
      let detailHtml = "";
      if (verdict?.verdictSummary && !/could not map|no live/i.test(verdict.verdictSummary)) {
        detailHtml += `<div class="verdict-section">
          <div class="label">Cognition verdict</div>
          <div>${escapeHtml(verdict.verdictSummary)}</div>
        </div>`;
      }
      if (verdict?.bettorLanguageSummary && !/could not map|no live/i.test(verdict.bettorLanguageSummary)) {
        detailHtml += `<div class="verdict-section">
          <div class="label">Bettor-language read</div>
          <div>${escapeHtml(verdict.bettorLanguageSummary)}</div>
        </div>`;
      }
      if (verdict?.strongestLeg) {
        const sl = verdict.strongestLeg;
        detailHtml += `<div class="verdict-section">
          <div class="label">Strongest leg</div>
          <div>Leg ${sl.legIndex + 1}${sl.reason ? ` — ${escapeHtml(sl.reason)}` : ""}</div>
        </div>`;
      }
      if (verdict?.weakestLeg) {
        const wl = verdict.weakestLeg;
        detailHtml += `<div class="verdict-section">
          <div class="label">Weakest leg</div>
          <div>Leg ${wl.legIndex + 1}${wl.reason ? ` — ${escapeHtml(wl.reason)}` : ""}</div>
        </div>`;
      }
      if (Array.isArray(verdict?.contradictionFlags) && verdict.contradictionFlags.length > 0) {
        detailHtml += `<div class="verdict-section">
          <div class="label">Contradictions flagged</div>
          <div>${verdict.contradictionFlags.map(f => escapeHtml(String(f))).join(" · ")}</div>
        </div>`;
      }

      return `
        <div class="verdict-card">
          <div class="verdict-score-row">
            <div class="verdict-score ${csCls}">${csTxt}<span style="font-size: 14px; color: #6B7280;">/100</span></div>
            <div class="verdict-archetype">${escapeHtml(String(archetype).replace(/_/g, " "))}</div>
          </div>
          ${signalsHtml.length ? `<div class="verdict-signals">${signalsHtml.join("")}</div>` : ""}
          ${structureHtml}
          ${detailHtml}
          <div style="margin-top: 12px; text-align: center;">
            <button class="ps-clear" onclick="resetAnalyze()">Analyze another slip</button>
          </div>
        </div>
      `;
    }

    // v0.2.7: Slip-level structural intelligence rendered directly from the
    // submitted legs. Independent of the backend cognition's grade — gives
    // useful read EVEN when individual legs can't be deep-analyzed.
    function renderSlipStructureAnalysis(legs) {
      if (!legs || legs.length === 0) return "";

      // Combined odds math
      const oddsToDecimal = (am) => {
        const n = Number(String(am).replace(/[+\s]/g, ""));
        if (!Number.isFinite(n) || n === 0) return null;
        return n > 0 ? (n / 100 + 1) : (100 / Math.abs(n) + 1);
      };
      const legDecimals = legs.map(l => oddsToDecimal(l.odds)).filter(Number.isFinite);
      const hasFullOdds = legDecimals.length === legs.length;
      let combinedDecimal = null, combinedAmerican = null, impliedHitRate = null;
      if (hasFullOdds && legDecimals.length > 0) {
        combinedDecimal = legDecimals.reduce((a, b) => a * b, 1);
        combinedAmerican = combinedDecimal >= 2
          ? Math.round((combinedDecimal - 1) * 100)
          : -Math.round(100 / (combinedDecimal - 1));
        impliedHitRate = 1 / combinedDecimal;
      }

      // Structural reads
      const milestone = legs.filter(l => isMilestoneProp(l.propType)).length;
      const altLines  = legs.filter(l => {
        const pt = String(l.propType || "").toLowerCase();
        const ln = Number(l.line);
        // Heuristic: stretched alt lines (Points 25+, Rebounds 12+, etc.) — high payout per leg
        if (!Number.isFinite(ln)) return false;
        if (pt.includes("points") && ln >= 24.5) return true;
        if (pt.includes("rebounds") && ln >= 9.5) return true;
        if (pt.includes("assists") && ln >= 7.5) return true;
        if (pt.includes("hits") && ln >= 1.5) return true;
        return false;
      }).length;

      // Single-book check
      const books = new Set(legs.map(l => String(l.sportsbook || "").trim()).filter(Boolean));
      const singleBook = books.size === 1 ? [...books][0] : null;

      // Structural verdict heuristics
      const verdicts = [];
      if (impliedHitRate != null) {
        if (impliedHitRate < 0.01) verdicts.push("Extreme variance play (<1% implied hit rate)");
        else if (impliedHitRate < 0.05) verdicts.push("Lottery-tier longshot (1-5% implied hit rate)");
        else if (impliedHitRate < 0.15) verdicts.push("High-variance parlay (5-15% hit rate)");
        else if (impliedHitRate < 0.35) verdicts.push("Medium-variance parlay (15-35% hit rate)");
        else verdicts.push("Reasonable hit rate (>35% implied)");
      }
      if (legs.length >= 5) verdicts.push(`${legs.length}-leg same-game style — exponential variance compounding`);
      if (altLines >= 2) verdicts.push(`${altLines} stretched alt lines — depends on tail-event performance`);
      if (milestone > 0) verdicts.push(`${milestone} milestone bet${milestone > 1 ? "s" : ""} (yes/no, low base rate)`);
      if (!singleBook && books.size > 1) verdicts.push(`Mixed books (${books.size}) — not constructable as single-book parlay`);
      else if (singleBook) verdicts.push(`Buildable on ${singleBook} (single-book)`);

      // Display
      const fmtOdds = (am) => am == null ? "—" : (am > 0 ? `+${am}` : `${am}`);
      const fmtPct = (p) => p == null ? "—" : (p * 100).toFixed(p < 0.01 ? 3 : p < 0.1 ? 2 : 1) + "%";

      return `
        <div class="verdict-section" style="border-color: rgba(56, 189, 248, 0.3);">
          <div class="label">Parlay math</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12px; margin-top: 4px;">
            <span style="color: #9CA3AF;">Legs</span><span style="font-family: ui-monospace, monospace;">${legs.length}</span>
            <span style="color: #9CA3AF;">Combined odds</span><span style="font-family: ui-monospace, monospace; color: ${combinedAmerican != null && combinedAmerican > 0 ? "#34D399" : "#F9FAFB"};">${hasFullOdds ? fmtOdds(combinedAmerican) : "(needs per-leg odds)"}</span>
            <span style="color: #9CA3AF;">Implied hit rate</span><span style="font-family: ui-monospace, monospace; color: ${impliedHitRate != null && impliedHitRate < 0.05 ? "#F87171" : "#FBBF24"};">${fmtPct(impliedHitRate)}</span>
          </div>
        </div>
        ${verdicts.length ? `
          <div class="verdict-section">
            <div class="label">Structural read</div>
            <div style="font-size: 12px; line-height: 1.6;">
              ${verdicts.map(v => `<div>• ${escapeHtml(v)}</div>`).join("")}
            </div>
          </div>` : ""}
      `;
    }

    function resetAnalyze() {
      state.analyze.result = null;
      state.analyze.legs = [emptyLeg()];
      render();
    }

    // Expose handlers
    window.updateAnalyzeMeta = updateAnalyzeMeta;
    window.updateAnalyzeLeg = updateAnalyzeLeg;
    window.addAnalyzeLeg = addAnalyzeLeg;
    window.removeAnalyzeLeg = removeAnalyzeLeg;
    window.submitAnalyze = submitAnalyze;
    window.resetAnalyze = resetAnalyze;

    // ─────────────────────────────────────────────────────────────
    // Fetch + refresh
    // ─────────────────────────────────────────────────────────────
    async function fetchSport(sport) {
      try {
        const r = await fetch(`${API}/api/ws/state?sport=${sport}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        state.data[sport] = j;
      } catch (e) {
        state.data[sport] = { _error: e.message || String(e) };
      }
    }

    async function refresh(forceRefresh = false) {
      if (state.fetching) return;
      if (!forceRefresh && state.lastFetchAt && (Date.now() - state.lastFetchAt) < REFRESH_MIN_INTERVAL_MS) return;
      state.fetching = true;
      const btn = document.getElementById("refreshBtn");
      btn.classList.add("spinning");

      // If forceRefresh: hit /refresh-snapshot endpoints first
      if (forceRefresh) {
        try {
          await Promise.allSettled([
            fetch(`${API}/refresh-snapshot?sport=baseball_mlb`).catch(() => {}),
            fetch(`${API}/refresh-snapshot/hard-reset`).catch(() => {}),
          ]);
        } catch (_) {}
      }

      await Promise.all([fetchSport("mlb"), fetchSport("nba")]);
      state.lastFetchAt = Date.now();
      state.fetching = false;
      btn.classList.remove("spinning");
      render();
    }

    document.getElementById("refreshBtn").addEventListener("click", () => refresh(true));

    // Tab switching
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        state.activeSport = tab.dataset.sport;
        render();
      });
    });

    // v0.1.5: cheap fetch only on initial load — operator 2026-05-21 caught
    // that force-refreshing on every PWA open would burn ~80 odds-API calls
    // per launch. Initial load now just reads whatever the backend has cached
    // (cheap), and the refresh button stays a manual one-tap when operator
    // wants fresh data. The header "X ago" makes staleness visible so the
    // operator knows when to tap.
    //
    // 2026-06-09 cold-start fix — paint the landing IMMEDIATELY. The default
    // landing (Top Picks) self-fetches the FAST /api/ws/top-picks inside
    // renderTopPicks, so a first render() paints in ~1s. The heavy
    // /api/ws/state fetch (both sports ~835KB + the snapshot auto-refresh
    // re-pull) then runs in the BACKGROUND via refresh() — it no longer gates
    // the first paint. Tabs that need /state (SLIPS) already guard null state
    // and fill in once the background fetch lands.
    render();
    refresh(false);

    // Periodic "X seconds ago" tick for the header
    setInterval(() => {
      // 2026-06-10 Card v2 — "refreshing prices" tick: while the background fetch
      // runs (cold-start or manual), say so, so a just-painted stale odds is obvious.
      if (state.fetching) {
        document.getElementById("lastUpdate").textContent = "⟳ refreshing prices…";
      } else if (state.lastFetchAt) {
        const secs = Math.round((Date.now() - state.lastFetchAt) / 1000);
        document.getElementById("lastUpdate").textContent =
          secs < 60 ? `${secs}s ago` : `${Math.round(secs / 60)}m ago`;
      }
    }, 5000);
  </script>
</body>
</html>
