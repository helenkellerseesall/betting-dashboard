<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Edge — Tonight's Slate</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Edge">
  <meta name="theme-color" content="#0A0E1A">
  <style>
    /* ───────────────────────────────────────────────────────────────
       Edge — bettor-native mobile PWA v0.1
       Dark sportsbook feel, no framework, single-file portable.
       ─────────────────────────────────────────────────────────────── */

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: #0A0E1A;
      color: #E5E7EB;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(180deg, #0F1424 0%, #0A0E1A 100%);
      border-bottom: 1px solid #1F2937;
      padding: max(env(safe-area-inset-top), 8px) 16px 0;
    }
    .header-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0 4px;
    }
    .brand {
      font-size: 22px; font-weight: 800; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #FBBF24 0%, #F59E0B 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .refresh-btn {
      background: #1F2937; border: 1px solid #374151; color: #E5E7EB;
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 18px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.4s ease;
    }
    .refresh-btn:active { background: #374151; }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .header-meta {
      display: flex; justify-content: space-between;
      font-size: 11px; color: #6B7280; padding: 0 0 8px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .header-meta .live-dot {
      display: inline-block; width: 6px; height: 6px;
      background: #10B981; border-radius: 50%;
      margin-right: 4px; vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .sport-tabs {
      display: flex; gap: 4px; padding-bottom: 8px;
    }
    .tab {
      flex: 1; padding: 10px 12px;
      background: #141828; border: 1px solid transparent; color: #9CA3AF;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tab .tab-count {
      background: #1F2937; color: #9CA3AF;
      font-size: 11px; padding: 2px 6px; border-radius: 6px;
      font-weight: 700;
    }
    .tab.active {
      background: linear-gradient(135deg, #1E293B 0%, #141828 100%);
      border-color: #FBBF24; color: #FBBF24;
    }
    .tab.active .tab-count {
      background: #FBBF24; color: #0A0E1A;
    }
    .tab[data-sport="mlb"].active { border-color: #34D399; color: #34D399; }
    .tab[data-sport="mlb"].active .tab-count { background: #34D399; color: #0A0E1A; }
    .tab[data-sport="nba"].active { border-color: #F97316; color: #F97316; }
    .tab[data-sport="nba"].active .tab-count { background: #F97316; color: #0A0E1A; }
    .tab[data-sport="parlay"].active { border-color: #A78BFA; color: #A78BFA; }
    .tab[data-sport="parlay"].active .tab-count { background: #A78BFA; color: #0A0E1A; }
    .tab[data-sport="parlay"] .tab-count.has-legs { background: #A78BFA; color: #0A0E1A; }
    .tab[data-sport="analyze"].active { border-color: #38BDF8; color: #38BDF8; }
    .tab[data-sport="grades"].active { border-color: #FBBF24; color: #FBBF24; }
    .tab[data-sport="grades"].active .tab-count { background: #FBBF24; color: #0A0E1A; }

    /* ── Analyze tab ────────────────────────────────────────── */
    .analyze-intro {
      background: rgba(56, 189, 248, 0.06);
      border-left: 2px solid #38BDF8;
      color: #BAE6FD;
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .analyze-intro strong { color: #38BDF8; }
    .analyze-intro .ocr-note {
      display: block;
      margin-top: 6px;
      color: #6B7280;
      font-style: italic;
      font-size: 11px;
    }
    .meta-row {
      display: flex; gap: 8px; margin-bottom: 10px;
    }
    .meta-row select, .meta-row input {
      flex: 1; padding: 8px 10px;
      background: #141828; border: 1px solid #1F2937; color: #E5E7EB;
      border-radius: 8px; font-size: 13px; font-family: inherit;
    }
    .leg-form {
      background: #141828; border: 1px solid #1F2937; border-radius: 10px;
      padding: 10px; margin-bottom: 8px;
      position: relative;
    }
    .leg-form-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .leg-form-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
      color: #38BDF8; text-transform: uppercase;
    }
    .leg-form-remove {
      background: transparent; border: none; color: #6B7280;
      font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px;
    }
    .leg-form-remove:hover { color: #F87171; }
    .leg-form input, .leg-form select {
      width: 100%; padding: 6px 8px; margin-bottom: 6px;
      background: #0A0E1A; border: 1px solid #1F2937; color: #E5E7EB;
      border-radius: 6px; font-size: 12px; font-family: inherit;
    }
    .leg-form input::placeholder { color: #4B5563; }
    .leg-form-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .leg-form-grid .full { grid-column: 1 / -1; }
    .add-leg-form-btn, .analyze-submit-btn {
      width: 100%; padding: 12px; margin-top: 6px;
      border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
      border: 1px solid;
      transition: all 0.15s ease;
    }
    .add-leg-form-btn {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.3);
      color: #38BDF8;
      margin-bottom: 12px;
    }
    .add-leg-form-btn:hover { background: rgba(56, 189, 248, 0.15); }
    .analyze-submit-btn {
      background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%);
      border-color: #0284C7; color: #0A0E1A;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .analyze-submit-btn:disabled {
      background: #1F2937; color: #6B7280; border-color: #374151;
      cursor: not-allowed;
    }

    /* Verdict card */
    .verdict-card {
      background: linear-gradient(180deg, #11202E 0%, #141828 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px; padding: 14px;
      margin-bottom: 12px;
    }
    .verdict-score-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .verdict-score {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 36px; font-weight: 700;
      letter-spacing: -1px;
    }
    .verdict-score.high { color: #34D399; }
    .verdict-score.mid  { color: #FBBF24; }
    .verdict-score.low  { color: #F87171; }
    .verdict-archetype {
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px;
      background: rgba(56, 189, 248, 0.15); color: #38BDF8;
    }
    .verdict-signals { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .verdict-signal {
      font-size: 10px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .vs-sharp { background: rgba(52, 211, 153, 0.15); color: #34D399; }
    .vs-bait { background: rgba(248, 113, 113, 0.15); color: #F87171; }
    .vs-viral { background: rgba(251, 191, 36, 0.15); color: #FBBF24; }
    .verdict-section {
      font-size: 12px; padding-top: 10px; border-top: 1px solid #1F2937;
      color: #D1D5DB;
    }
    .verdict-section .label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; color: #9CA3AF; margin-bottom: 4px;
    }

    /* ── Parlay add button on cards ──────────────────────────── */
    .add-leg-btn {
      position: absolute; top: 10px; right: 10px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(167, 139, 250, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: #A78BFA; font-size: 16px; font-weight: 700; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
      z-index: 2;
    }
    .add-leg-btn:hover, .add-leg-btn:active { background: rgba(167, 139, 250, 0.25); }
    .add-leg-btn.added {
      background: #A78BFA; border-color: #A78BFA; color: #0A0E1A;
    }
    /* card needs relative positioning for the absolute button */
    .card { position: relative; }

    /* ── Parlay tab view ─────────────────────────────────────── */
    .parlay-empty {
      text-align: center; padding: 60px 24px;
      color: #6B7280; font-size: 14px;
    }
    .parlay-empty .big {
      font-size: 36px; margin-bottom: 12px;
      background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; font-weight: 800;
    }
    .parlay-summary {
      background: linear-gradient(180deg, #1A1424 0%, #141828 100%);
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 14px; padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 0 0 1px rgba(167, 139, 250, 0.1);
    }
    .parlay-summary .ps-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .parlay-summary .ps-title {
      font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
      text-transform: uppercase; color: #A78BFA;
    }
    .parlay-summary .ps-clear {
      background: transparent; border: 1px solid #374151; color: #9CA3AF;
      font-size: 10px; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;
    }
    .parlay-summary .ps-row {
      display: flex; justify-content: space-between; padding: 4px 0;
      font-size: 13px;
    }
    .parlay-summary .ps-row .lbl { color: #9CA3AF; }
    .parlay-summary .ps-row .val {
      font-family: ui-monospace, "SF Mono", monospace; color: #F9FAFB; font-weight: 700;
    }
    .parlay-summary .ps-odds {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 28px; font-weight: 700; color: #34D399;
      text-align: center; padding: 8px 0;
      letter-spacing: -1px;
    }
    .parlay-summary .ps-buildable {
      font-size: 11px; padding: 6px 10px; border-radius: 6px;
      text-align: center; margin-top: 8px;
      font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .ps-buildable.ok { background: rgba(52, 211, 153, 0.12); color: #34D399; }
    .ps-buildable.warn { background: rgba(251, 191, 36, 0.12); color: #FBBF24; }
    .ps-buildable.bad { background: rgba(248, 113, 113, 0.12); color: #F87171; }

    .parlay-leg {
      background: #141828; border: 1px solid #1F2937;
      border-radius: 10px; padding: 10px 12px;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .parlay-leg .leg-main { flex: 1; min-width: 0; }
    .parlay-leg .leg-player {
      font-size: 14px; font-weight: 700; color: #F9FAFB;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .parlay-leg .leg-prop {
      font-size: 12px; color: #9CA3AF; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .parlay-leg .leg-odds {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 14px; font-weight: 700; color: #34D399;
      min-width: 50px; text-align: right;
    }
    .parlay-leg .leg-book {
      font-size: 10px; color: #6B7280;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .parlay-leg .leg-remove {
      background: transparent; border: none; color: #6B7280;
      font-size: 18px; line-height: 1; cursor: pointer; padding: 4px 8px;
    }
    .parlay-leg .leg-remove:hover { color: #F87171; }

    /* ── Main scroll area ──────────────────────────────────────── */
    main {
      padding: 12px 12px max(env(safe-area-inset-bottom), 24px);
    }
    .empty, .loading, .error {
      text-align: center; padding: 48px 16px;
      color: #6B7280; font-size: 14px;
    }
    .error { color: #F87171; }
    .error code {
      display: block; margin-top: 8px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 11px; color: #9CA3AF;
      word-break: break-all;
    }

    /* ── Freshness banner ──────────────────────────────────────── */
    /* Bettor-native: informational tone, never alarming.
       Even "stale" reads as soft grey, not blood-red — staleness is a
       data-pipeline reality, not a bettor-blame surface. */
    .freshness {
      font-size: 11px; padding: 6px 10px; border-radius: 8px;
      margin-bottom: 10px; display: flex; justify-content: space-between;
      background: #141828; border: 1px solid #1F2937;
      color: #9CA3AF;
    }
    .freshness.fresh { color: #6EE7B7; }
    .freshness.warning { color: #FCD34D; }
    .freshness.stale { color: #9CA3AF; }

    /* ── Conviction section (operator 2026-05-21: "holy shit THESE 2-3") ── */
    .conviction-section {
      margin-bottom: 18px;
    }
    .section-header {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #FBBF24;
      padding: 2px 4px 8px;
    }
    .section-header .section-icon {
      font-size: 14px; line-height: 1;
    }
    .section-header .section-sub {
      color: #6B7280; font-weight: 600; letter-spacing: 0.4px; flex: 1;
    }
    .section-header.all-opps { color: #9CA3AF; }
    .conviction-card {
      border: 1px solid #B45309 !important;
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.15);
      background: linear-gradient(180deg, #1A1424 0%, #141828 100%) !important;
    }
    .conviction-card .tier-pill {
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
    }

    /* ── Likely To Hit section (parlay-leg pool) ──────────────── */
    .section-header.likely-section {
      color: #6EE7B7;
    }

    /* ── Lotto Room (collapsible, honestly quarantined) ───────── */
    .lotto-section {
      margin-top: 16px;
      border-top: 1px dashed #1F2937;
      padding-top: 12px;
    }
    .lotto-section summary {
      cursor: pointer;
      list-style: none;
      color: #9CA3AF;
    }
    .lotto-section summary::-webkit-details-marker { display: none; }
    .lotto-toggle::before {
      content: "▸ ";
      color: #6B7280;
      font-weight: 700;
    }
    .lotto-section[open] .lotto-toggle::before { content: "▾ "; }
    .lotto-cards {
      margin-top: 8px;
      opacity: 0.85;
    }

    /* ── Diagnostic footer (operator transparency) ────────────── */
    .diag-footer {
      text-align: center;
      color: #4B5563;
      font-size: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      padding: 16px 0 8px;
      letter-spacing: 0.3px;
    }

    /* ── Card grid: responsive 2/3-column ──────────────────────
       v0.1.3: operator 2026-05-21 — "can we 2 per row instead of 1?".
       2026-05-24: restored 3-column on large viewports; previous edit
       regressed to 1-column on phone landscape. New tiers:
       - <520px:  1 column (small phone portrait)
       - >=520px: 2 columns (phone landscape / iPad / Safari)
       - >=960px: 3 columns (desktop browser)
       Section headers + freshness + lotto summary stay full-width. */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 480px) {
      .card-grid {
        grid-template-columns: 1fr 1fr;
      }
      /* v0.1.4: min-width:0 lets grid children shrink below their intrinsic
         content width, which lets the ellipsis on .player-meta + .prop-line
         actually kick in. Without this, long MLB team strings push cards
         past the column boundary (operator saw this 2026-05-21). */
      .card-grid .card { margin-bottom: 0; min-width: 0; }
    }
    /* 2026-05-24 — operator requested 3-4 cols at moderate widths so more cards
       are visible at once. Tightened breakpoints: 3 cols at 720px+, 4 cols at 1100px+. */
    @media (min-width: 720px) {
      .card-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
    @media (min-width: 1100px) {
      .card-grid {
        grid-template-columns: 1fr 1fr 1fr 1fr;
      }
    }

    /* ── Empty-explainer (when a sport has nothing but lotto) ──── */
    .empty-explainer {
      background: rgba(251, 191, 36, 0.06);
      border-left: 2px solid #FBBF24;
      color: #FDE68A;
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin: 8px 0 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Play card ─────────────────────────────────────────────── */
    .card {
      background: linear-gradient(180deg, #141828 0%, #11151F 100%);
      border: 1px solid #1F2937;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      transition: border-color 0.15s ease;
    }
    .card.expanded { border-color: #374151; }

    .card-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .player-block {
      display: flex; flex-direction: column; min-width: 0; flex: 1;
    }
    .player-name {
      font-size: 17px; font-weight: 700; color: #F9FAFB;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-meta {
      font-size: 11px; color: #6B7280;
      text-transform: uppercase; letter-spacing: 0.4px;
      margin-top: 1px;
      /* v0.1.3: single-line with ellipsis. Long matchups were wrapping
         to a second line, breaking card compactness. */
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-meta .pending { color: #FCD34D; font-style: italic; }
    .player-meta .gap { color: #9CA3AF; } /* legacy alias */

    .tier-pill {
      font-size: 10px; font-weight: 800; letter-spacing: 0.6px;
      padding: 4px 8px; border-radius: 6px;
      text-transform: uppercase;
      flex-shrink: 0; margin-left: 8px;
    }
    .tier-elite    { background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%); color: #0A0E1A; }
    .tier-best     { background: linear-gradient(135deg, #34D399 0%, #10B981 100%); color: #0A0E1A; }
    .tier-strong   { background: linear-gradient(135deg, #60A5FA 0%, #3B82F6 100%); color: #0A0E1A; }
    .tier-good     { background: #374151; color: #D1D5DB; }
    .tier-unknown  { background: #1F2937; color: #6B7280; border: 1px dashed #374151; }

    .prop-line {
      font-size: 14px; color: #D1D5DB; margin-bottom: 8px;
      /* v0.1.3: single-line with ellipsis. Long prop names were wrapping. */
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .prop-line .side {
      text-transform: uppercase; font-weight: 700;
      padding: 1px 6px; border-radius: 4px;
      font-size: 11px; margin-right: 5px;
      vertical-align: middle;
    }
    .side-over   { background: rgba(52, 211, 153, 0.15); color: #34D399; }
    .side-under  { background: rgba(248, 113, 113, 0.15); color: #F87171; }

    .odds-book-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .odds {
      font-family: ui-monospace, "SF Mono", "Menlo", monospace;
      font-size: 22px; font-weight: 700; color: #F9FAFB;
      letter-spacing: -0.5px;
    }
    .odds.positive { color: #34D399; }
    .book-pill {
      font-size: 11px; font-weight: 700; padding: 4px 8px;
      border-radius: 6px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .book-DraftKings { background: rgba(83, 211, 55, 0.15); color: #53D337; }
    .book-FanDuel    { background: rgba(20, 147, 255, 0.15); color: #1493FF; }
    .book-Fanatics   { background: rgba(211, 30, 38, 0.15); color: #EF4444; }
    .book-BetRivers  { background: rgba(0, 122, 204, 0.15); color: #38BDF8; }
    .book-BetMGM     { background: rgba(200, 170, 118, 0.15); color: #C8AA76; }
    .book-HardRock   { background: rgba(215, 30, 44, 0.15); color: #EF4444; }
    .book-bet365     { background: rgba(0, 123, 91, 0.15); color: #10B981; }
    .book-unknown    { background: #1F2937; color: #9CA3AF; }

    /* ── Edge bar ──────────────────────────────────────────────── */
    .edge-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .edge-bar {
      flex: 1; height: 6px; background: #1F2937;
      border-radius: 3px; overflow: hidden;
    }
    .edge-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #34D399 0%, #FBBF24 100%);
      transition: width 0.4s ease;
    }
    .edge-fill.huge { background: linear-gradient(90deg, #FBBF24 0%, #F97316 100%); }
    .edge-pct {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 12px; font-weight: 700; color: #FBBF24;
      min-width: 44px; text-align: right;
    }

    /* ── Why this play exists (core surface) ───────────────────── */
    .why {
      background: rgba(251, 191, 36, 0.06);
      border-left: 2px solid #FBBF24;
      padding: 8px 10px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      color: #FDE68A;
      margin-top: 4px;
    }
    .why-chips {
      display: flex; flex-wrap: wrap; gap: 4px 6px;
    }
    .why-chip {
      font-size: 12px;
      color: #FDE68A;
    }
    .why-chip + .why-chip::before {
      content: "·";
      color: #6B7280;
      margin-right: 6px;
      font-weight: 700;
    }
    .why-empty {
      color: #6B7280; font-style: italic; font-size: 12px;
    }

    /* ── Honesty / gap notes ───────────────────────────────────── */
    .notes {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 8px;
    }
    .note {
      font-size: 10px; padding: 2px 6px;
      border-radius: 4px; text-transform: uppercase;
      letter-spacing: 0.4px; font-weight: 700;
    }
    /* Bettor-native: informational tones, not blood-red alarms.
       Missing data is a normal slate-stage condition, not a defect. */
    /* "Pending" notes are slate-stage normal; reduce visual weight so they
       don't dominate the card when they're the only note (operator feedback:
       "LINEUPS PENDING on every card felt broken instead of informational"). */
    .note-pending { background: transparent; color: #9CA3AF; font-weight: 500; font-size: 9px; opacity: 0.85; padding: 1px 4px; border: 1px solid rgba(251, 191, 36, 0.15); border-radius: 3px; }
    .note-good    { background: rgba(52, 211, 153, 0.12); color: #34D399; }
    .note-warn    { background: rgba(251, 191, 36, 0.12); color: #FBBF24; }
    .note-gap     { background: rgba(156, 163, 175, 0.12); color: #9CA3AF; } /* legacy alias */

    /* ── Expand panel ──────────────────────────────────────────── */
    .expand-toggle {
      display: block; width: 100%; text-align: center;
      padding: 8px 0 0; margin-top: 8px;
      border-top: 1px solid #1F2937;
      background: transparent; color: #6B7280;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
      font-weight: 700; cursor: pointer; border-left: 0; border-right: 0; border-bottom: 0;
    }
    .expand-panel {
      display: none;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid #1F2937;
      font-size: 12px;
    }
    .card.expanded .expand-panel { display: block; }
    .expand-panel dl {
      margin: 0; display: grid;
      grid-template-columns: 130px 1fr; gap: 4px 12px;
    }
    .expand-panel dt {
      color: #6B7280; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.3px; font-size: 11px;
    }
    .expand-panel dd {
      margin: 0; color: #D1D5DB;
      font-family: ui-monospace, "SF Mono", monospace; font-size: 11px;
      word-break: break-word;
    }
    .expand-panel dd.null { color: #6B7280; font-style: italic; }

    /* ── Footer / scroll spacer ────────────────────────────────── */
    .footer-note {
      text-align: center; color: #4B5563; font-size: 10px;
      padding: 16px 0; text-transform: uppercase; letter-spacing: 0.6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-bar">
      <div class="brand">EDGE</div>
      <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">↻</button>
    </div>
    <div class="header-meta">
      <span><span class="live-dot"></span><span id="dateLabel">—</span></span>
      <span id="lastUpdate">—</span>
    </div>
    <div class="sport-tabs">
      <button class="tab active" data-sport="mlb">MLB <span class="tab-count" id="mlbCount">—</span></button>
      <button class="tab" data-sport="nba">NBA <span class="tab-count" id="nbaCount">—</span></button>
      <button class="tab" data-sport="parlay">PARLAY <span class="tab-count" id="parlayCount">0</span></button>
      <button class="tab" data-sport="analyze">ANALYZE</button>
      <button class="tab" data-sport="grades">GRADES <span class="tab-count" id="gradesCount">—</span></button>
    </div>
  </header>

  <main id="main">
    <div class="loading">Loading tonight's edges…</div>
  </main>

  <div class="footer-note">edge v0.1 · honest gaps surfaced · never fabricated</div>

  <script>
    // ─────────────────────────────────────────────────────────────
    // State + config
    // ─────────────────────────────────────────────────────────────
    const API = ""; // same-origin; backend serves both /m and /api/ws/*
    const MAX_PLAYS = 15;
    const REFRESH_MIN_INTERVAL_MS = 5000;

    let state = {
      activeSport: "mlb",
      data: { mlb: null, nba: null },
      lastFetchAt: null,
      fetching: false,
      parlay: loadParlay(),  // v0.2.0: persistent across sessions via localStorage
      // v0.2.8: player search — type "wemby" / "sga" / any name, see ALL their
      // props for tonight from the 7-book allowlist. Bypasses edge-filter.
      search: { mlb: { q: "", results: null, loading: false },
                nba: { q: "", results: null, loading: false } },
      // Phase A2 (2026-05-22): game-first surface as default. Tab mode toggle
      // lets operator switch to "sharp" view (the old edge-filtered candidates).
      tabMode: { mlb: "games", nba: "games" },
      games:   { mlb: null, nba: null, loading: false },
      // Phase A.5: per-game / per-player expansion state. Games collapsed by
      // default; operator taps to expand. Inside an expanded game, players
      // are also collapsed by default — tap a player to see their props.
      expandedGames:   {},  // { [eventId]: true } when expanded
      expandedPlayers: {},  // { [eventId+player]: true } when expanded
      // v0.2.1: external slip analyzer (Flow A)
      analyze: {
        meta: { sourceType: "twitter", attribution: "", sport: "" },
        legs: [emptyLeg()],
        result: null,
        submitting: false,
      },
      // Feedback loop (2026-05-23): yesterday's logged picks + grading status
      grades: {
        date: null,
        picks: [],
        totals: null,
        loading: false,
        error: null,
        grading: false,    // true while a manual /grade trigger is in flight
        gradeNote: null,   // last grade-button outcome line
      },
    };

    function emptyLeg() {
      return { player: "", propType: "Points", line: "", side: "over", odds: "", sportsbook: "DraftKings" };
    }

    // v0.2.2: which prop types are milestone (Yes/No) vs threshold (Over/Under)
    const MILESTONE_PROPS = new Set([
      "Double-Double", "Triple-Double", "First Basket",
      "Anytime TD", "Anytime Goal", "Anytime HR", "Hit a HR"
    ]);
    function isMilestoneProp(propType) {
      return MILESTONE_PROPS.has(propType);
    }

    // v0.2.5: Auto-detect sport from the leg prop types so the slip-analysis
    // cognition (resolveSlipLegToPrediction) gets a sport string instead of
    // null. Without sport, every leg is rejected as MISSING_SPORT → verdict
    // defaults to 1/100 UNKNOWN. NBA props win in ties since most viral parlay
    // screenshots are NBA player-prop SGPs.
    const NBA_PROP_SET = new Set([
      "Points", "Rebounds", "Assists", "Threes", "PRA",
      "Steals", "Blocks", "Pts+Reb", "Pts+Ast", "Reb+Ast",
      "Double-Double", "Triple-Double", "First Basket"
    ]);
    const MLB_PROP_SET = new Set([
      "Hits", "Home Runs", "Total Bases", "RBIs", "Runs Scored",
      "Stolen Bases", "Strikeouts", "Walks", "Hit a HR"
    ]);
    function autoDetectSportFromLegs(legs) {
      let nba = 0, mlb = 0;
      for (const l of legs || []) {
        if (NBA_PROP_SET.has(l.propType)) nba++;
        if (MLB_PROP_SET.has(l.propType)) mlb++;
      }
      if (nba >= mlb && nba > 0) return "nba";
      if (mlb > 0) return "mlb";
      return null;  // unknown — let backend decide
    }

    // v0.2.0: Parlay storage. Keep it small + portable. localStorage key
    // namespaced so future versions can migrate without colliding.
    const PARLAY_STORAGE_KEY = "edge:parlay:v1";
    function loadParlay() {
      try {
        const raw = localStorage.getItem(PARLAY_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) { return []; }
    }
    function saveParlay() {
      try { localStorage.setItem(PARLAY_STORAGE_KEY, JSON.stringify(state.parlay || [])); } catch (_) {}
    }

    // Stable per-candidate signature so add/remove and "is this leg already in?"
    // work even after a refresh changes the surrounding ordering.
    function legSig(c) {
      return [
        c.player || "",
        c.propType || c.statFamily || "",
        c.side || "",
        c.line == null ? "" : c.line,
        c.sportsbook || c.book || ""
      ].join("|");
    }
    function isLegInParlay(c) {
      const sig = legSig(c);
      return state.parlay.some(l => legSig(l) === sig);
    }
    function addLeg(c, sport) {
      if (isLegInParlay(c)) return;
      // Capture only the fields we need; full row is too big for localStorage at scale
      state.parlay.push({
        player: c.player, team: c.team || null,
        matchup: c.matchup || null, sport,
        propType: c.propType || c.statFamily, statFamily: c.statFamily,
        side: c.side, line: c.line,
        odds: c.oddsAmerican ?? c.odds,
        oddsAmerican: c.oddsAmerican ?? c.odds,
        sportsbook: c.sportsbook || c.book,
        book: c.sportsbook || c.book,
        addedAt: Date.now(),
      });
      saveParlay();
      render();
    }
    function removeLeg(idx) {
      state.parlay.splice(idx, 1);
      saveParlay();
      render();
    }
    function clearParlay() {
      if (state.parlay.length === 0) return;
      if (!confirm(`Clear all ${state.parlay.length} legs from your parlay?`)) return;
      state.parlay = [];
      saveParlay();
      render();
    }
    window.addLegFromCard = function (idx, sport) {
      const payload = state.data[sport];
      if (!payload) return;
      // idx is the visible index; find the candidate by walking the same
      // bucket-classification we use in render(). Simpler: pull from a cached
      // index map we attach during render. See render() → state._renderedIndex.
      const c = (state._renderedIndex || {})[sport + ":" + idx];
      if (c) addLeg(c, sport);
    };
    window.removeLegFromParlay = removeLeg;
    window.clearParlayConfirm = clearParlay;

    // Odds math — American → decimal multiplier → combined American
    function americanToDecimal(am) {
      const n = Number(am);
      if (!Number.isFinite(n)) return null;
      return n > 0 ? (n / 100 + 1) : (100 / Math.abs(n) + 1);
    }
    function decimalToAmerican(dec) {
      if (!Number.isFinite(dec) || dec <= 1) return null;
      return dec >= 2 ? Math.round((dec - 1) * 100) : -Math.round(100 / (dec - 1));
    }
    function computeCombinedOdds(legs) {
      if (!legs.length) return { combinedAmerican: null, combinedDecimal: null, combinedProb: null };
      let prod = 1;
      for (const l of legs) {
        const d = americanToDecimal(l.oddsAmerican ?? l.odds);
        if (d == null) return { combinedAmerican: null, combinedDecimal: null, combinedProb: null };
        prod *= d;
      }
      return {
        combinedDecimal: prod,
        combinedAmerican: decimalToAmerican(prod),
        combinedProb: 1 / prod,
      };
    }

    // Single-book constructability: if all legs share the same canonical book,
    // surface that book as the buildable target. Otherwise warn — mixed-book
    // parlays can't be constructed at a single sportsbook.
    function computeBuildability(legs) {
      if (!legs.length) return { status: "empty", book: null };
      const books = new Set();
      for (const l of legs) {
        const b = String(l.sportsbook || l.book || "").trim();
        if (!b) return { status: "missing", book: null };
        books.add(b);
      }
      if (books.size === 1) {
        return { status: "single", book: [...books][0] };
      }
      return { status: "mixed", book: null, books: [...books] };
    }

    // ─────────────────────────────────────────────────────────────
    // Reasoning compiler — translates canonical signals to WHY chips
    // Pure function. No fabrication. Returns array of strings.
    // ─────────────────────────────────────────────────────────────
    function buildWhy(c, sport) {
      const why = [];
      if (sport === "mlb") {
        // Team environment
        if (typeof c.impliedTeamTotal === "number") {
          if (c.impliedTeamTotal >= 5.5) why.push(`high team total (${c.impliedTeamTotal.toFixed(1)})`);
          else if (c.impliedTeamTotal <= 3.5) why.push(`low team total (${c.impliedTeamTotal.toFixed(1)})`);
        }
        // Park
        if (typeof c.hrFactor === "number") {
          if (c.hrFactor >= 1.10) why.push("hitter park");
          else if (c.hrFactor <= 0.90) why.push("pitcher park");
        }
        // HR env tag (overrides park if explicitly tagged)
        if (c.hrEnvironmentTag === "HR_FAVORING") why.push("HR-favoring env");
        else if (c.hrEnvironmentTag === "HR_SUPPRESSING") why.push("HR-suppressing env");
        // Weather
        if (c.windDirectionTag === "out") why.push("wind out");
        else if (c.windDirectionTag === "in") why.push("wind in");
        else if (c.windDirectionTag === "indoor") why.push("indoor");
        if (typeof c.temperatureF === "number" && c.temperatureF >= 85) {
          why.push(`hot night (${Math.round(c.temperatureF)}°F)`);
        }
        if (typeof c.carryShift === "number" && Math.abs(c.carryShift) >= 0.01) {
          why.push(c.carryShift > 0 ? "+carry" : "-carry");
        }
        // Lineup
        if (typeof c.lineupSpot === "number") {
          if (c.lineupSpot <= 4) why.push(`top-of-order (${c.lineupSpot})`);
          else if (c.lineupSpot >= 8) why.push(`back of order (${c.lineupSpot})`);
        }
        // Contextual tags from backend (already canonical phrases)
        if (Array.isArray(c.contextualTags)) {
          for (const tag of c.contextualTags) {
            // Lowercase + underscore→space; backend tags are CAPS_LIKE_THIS
            const phrase = String(tag).toLowerCase().replace(/_/g, " ");
            // Skip duplicates already in why
            if (!why.some(w => w.toLowerCase().includes(phrase))) why.push(phrase);
          }
        }
        // Conviction signal (PCE-1A) if present
        if (c.convictionNote) why.push(String(c.convictionNote).toLowerCase());
      } else if (sport === "nba") {
        // 2026-05-24 — Canonical displayBundle is authoritative for NBA cards.
        // Backend stamps prop-aware, pre-rounded tags in buildPlayDisplayBundle.
        // FE consumes as-is — no recomputation, no shadow tag logic.
        // Falls through to legacy logic below only if displayBundle absent.
        if (Array.isArray(c?.displayBundle?.tags) && c.displayBundle.tags.length) {
          for (const t of c.displayBundle.tags) {
            if (t == null) continue;
            const s = String(t).trim();
            if (s) why.push(s);
          }
          return why;
        }

        // ── Legacy fallback (only when displayBundle missing) ──
        // Starter / role
        if (c.starterFlag === 1) {
          const rate = c?.roleContext?.starter_rate_recent;
          if (rate === 1) why.push("every-game starter");
          else why.push("starter");
        } else if (c.starterFlag === 0) {
          why.push("bench role");
        }
        if (c?.roleContext?.role_change === "promoted") why.push("promoted to starter");
        else if (c?.roleContext?.role_change === "demoted") why.push("demoted from starter");
        if (typeof c.projectedMinutes === "number") {
          if (c.projectedMinutes >= 32) why.push(`${Math.round(c.projectedMinutes)}+ min projected`);
          else if (c.projectedMinutes < 22) why.push(`limited mins (${c.projectedMinutes.toFixed(0)})`);
        }
        const last5 = c?.recentForm?.last5_avg;
        const formSrc = String(c?.recentForm?.source || "").toLowerCase();
        if (typeof last5 === "number" && formSrc && formSrc !== "projection-fallback") {
          why.push(`last 5 avg: ${last5.toFixed(1)}`);
        }
        const oppDef = c?.oppDef;
        if (typeof oppDef === "number") {
          const oppLabel = (() => {
            const raw = String(c?.opponent || "").trim();
            if (!raw) return "opp";
            const tokens = raw.split(/\s+/);
            return tokens[tokens.length - 1] || raw;
          })();
          if (oppDef <= 108) why.push(`vs strong D (${oppLabel} ${oppDef.toFixed(0)} ppg)`);
          else if (oppDef >= 117) why.push(`vs weak D (${oppLabel} ${oppDef.toFixed(0)} ppg)`);
          else why.push(`vs avg D (${oppLabel} ${oppDef.toFixed(0)} ppg)`);
        }
      }
      return why;
    }

    // ─────────────────────────────────────────────────────────────
    // Honest gap notes — flags missing canonical inputs
    // ─────────────────────────────────────────────────────────────
    // Bettor-facing honesty notes. Tone is INFORMATIONAL ("pending" /
    // "awaiting") not BROKEN ("no data" / "missing"). Missing canonical
    // inputs at slate-build time are a normal pipeline stage, not a
    // defect — the language reflects that.
    function buildNotes(c, sport) {
      const notes = [];
      if (sport === "mlb") {
        if (c.lineupSpot == null && c.plateAppearancesProxy == null && /hitter|over/i.test(c.side || "")) {
          notes.push({ type: "pending", text: "lineups pending" });
        }
        if (c.convictionNote) {
          notes.push({ type: "good", text: "conviction" });
        }
      } else if (sport === "nba") {
        if (c?.roleContext?.sample_count != null && c.roleContext.sample_count < 5) {
          notes.push({ type: "warn", text: `small sample (${c.roleContext.sample_count}g)` });
        }
        if (c.starterFlag === 0 && /over/i.test(c.side || "")) {
          notes.push({ type: "warn", text: "bench over" });
        }
        if (typeof c?.roleContext?.minutes_volatility === "number" && c.roleContext.minutes_volatility >= 8) {
          notes.push({ type: "warn", text: "minutes volatile" });
        }
      }
      return notes;
    }

    // v0.1.2: parlay-confidence reframe. Operator 2026-05-21:
    // "I want to feel confident multi-leg parlays will hit."
    //
    // The cognition: a 4-leg parlay of 65% legs has 17.8% combined hit rate.
    // A 4-leg parlay of 33% legs has 1.2% combined hit rate. Hit rate IS the
    // primary signal for parlay-builders. Raw edge% structurally favors
    // longshots and is misleading as a top-line metric for this product.
    //
    // Tier rules:
    //   - CONVICTION  : modelProb ≥ 0.65, edge ≥ 0.05, tier ELITE/BEST
    //   - LIKELY      : modelProb ≥ 0.55, positive edge (parlay-leg pool)
    //   - BIGGER EDGE : modelProb 0.30-0.55, positive edge
    //   - LOTTO       : modelProb < 0.30 (honestly quarantined; collapsed default)
    function playClass(c, sport) {
      const mp = c.predictedProbability ?? c.modelProb;
      const ep = c.edgeProbability ?? c.edge;
      const odds = c.oddsAmerican ?? c.odds;
      if (typeof mp !== "number" || typeof ep !== "number") return "unknown";
      if (ep < 0) return "neg-edge";
      // v0.1.4: prop-type-aware lotto gating instead of flat payout threshold.
      // Operator 2026-05-21: HR 0.5 at +500 is fine to surface, Hits 2.5+ at
      // +700-+900 is lotto. Hits 2.5+ specifically = "3+ hits in a game" —
      // real MLB rate is 10-15% even for stars; model over-predicts these.
      // Threshold raised from +400 to +600 for other props so RBI 1.5 plays
      // at +500-+550 surface in Bigger Edges, not Lotto.
      const propType = String(c.propType || "").toLowerCase();
      const isHitsTailOutcome = /^hits?$/.test(propType) && typeof c.line === "number" && c.line >= 2.5;
      if (isHitsTailOutcome) return "lotto";
      if (typeof odds === "number" && odds >= 600) return "lotto";
      const tier = String(c.confidenceTier || c.tier || "").toUpperCase();
      // 2026-05-25 — Backend stamps tier=FADE on wrong-direction picks via
      // form-contradiction and projection-contradiction gates. The FE was
      // ignoring tier and using modelProb-only bucketing, so FADE picks still
      // showed under "Likely to hit" / "Bigger edges". Operator caught Mitchell
      // OVER threes 3.5 (L5=2.6) and Shamet UNDER threes 0.5 (L5=2.6) surfacing
      // with FADE badges. Hide FADE entirely so the FE respects backend gates.
      if (tier === "FADE") return "hidden";
      if (mp >= 0.65 && ep >= 0.05 && (tier === "ELITE" || tier === "BEST")) {
        if (sport === "nba") {
          const days = c?.recentForm?.days_since_last_game ?? c?.roleContext?.days_since_last_game;
          if (typeof days === "number" && days >= 6) return "likely";
        }
        return "conviction";
      }
      if (mp >= 0.55) return "likely";
      if (mp >= 0.30) return "bigger-edge";
      return "lotto";
    }

    // v0.1.3: defense-in-depth book allowlist filter. Canonical authority is
    // backend/pipeline/shared/sportsbookAllowlist.js (currently 4 books;
    // needs operator-mandated 7-book update — see task #22). Until that lands,
    // the mobile surface NEVER displays a non-allowed book. Operator
    // 2026-05-21: "Spencer Jones is showing betonline.ag (not one of the
    // books i want)".
    const ALLOWED_BOOKS = new Set([
      "draftkings", "fanduel", "fanatics",
      "betrivers", "betmgm", "hardrock", "bet365"
    ]);
    function isAllowedBook(name) {
      const n = String(name || "").toLowerCase().replace(/\s+/g, "");
      return ALLOWED_BOOKS.has(n);
    }

    // ─────────────────────────────────────────────────────────────
    // Tier resolution
    // ─────────────────────────────────────────────────────────────
    function tierClass(tier) {
      const t = String(tier || "").toUpperCase();
      if (t === "ELITE") return "tier-elite";
      if (t === "BEST")  return "tier-best";
      if (t === "STRONG") return "tier-strong";
      if (t === "GOOD") return "tier-good";
      return "tier-unknown";
    }
    function tierLabel(tier) {
      const t = String(tier || "").toUpperCase();
      return t || "—";
    }

    // ─────────────────────────────────────────────────────────────
    // Book brand pill
    // ─────────────────────────────────────────────────────────────
    function bookClass(book) {
      const b = String(book || "").replace(/\s+/g, "");
      const known = ["DraftKings","FanDuel","Fanatics","BetRivers","BetMGM","HardRock","bet365"];
      const match = known.find(k => k.toLowerCase() === b.toLowerCase());
      return match ? `book-${match}` : "book-unknown";
    }

    // ─────────────────────────────────────────────────────────────
    // Odds formatter
    // ─────────────────────────────────────────────────────────────
    function fmtOdds(o) {
      if (o == null) return "—";
      const n = Number(o);
      if (!Number.isFinite(n)) return "—";
      return n > 0 ? `+${n}` : `${n}`;
    }

    // ─────────────────────────────────────────────────────────────
    // Edge percentage formatter
    // ─────────────────────────────────────────────────────────────
    function edgePct(e) {
      if (typeof e !== "number" || !Number.isFinite(e)) return null;
      return Math.round(e * 100);
    }

    // ─────────────────────────────────────────────────────────────
    // Render a single play card
    // ─────────────────────────────────────────────────────────────
    function renderCard(c, sport, idx, isConv) {
      // v0.2.0: cache candidate by (sport, idx) so addLegFromCard can locate
      // the candidate when the operator taps the + button. State is rebuilt
      // on every render() so stale indexes don't carry across switches.
      if (state._renderedIndex) state._renderedIndex[sport + ":" + idx] = c;

      const tier = tierClass(c.confidenceTier || c.tier);
      const tierTxt = tierLabel(c.confidenceTier || c.tier);
      const convClass = isConv ? "conviction-card" : "";
      const book = c.sportsbook || c.book || "—";
      const bookCls = bookClass(book);
      const odds = c.oddsAmerican ?? c.odds;
      const oddsTxt = fmtOdds(odds);
      const oddsCls = (typeof odds === "number" && odds > 0) ? "positive" : "";
      const ep = edgePct(c.edgeProbability ?? c.edge);
      const edgeWidth = ep == null ? 0 : Math.min(100, Math.max(0, ep * 2)); // 50% edge = bar full
      const edgeHuge = ep != null && ep >= 25;

      const why = buildWhy(c, sport);
      const notes = buildNotes(c, sport);

      // Bettor-native: "team pending" reads as slate-stage normal,
      // not as broken/missing data. Same yellow informational tone as
      // "lineups pending" on MLB.
      const teamTxt = c.team || (sport === "nba" ? "team pending" : "—");
      const teamCls = c.team ? "" : "pending";
      const matchupTxt = c.matchup || "—";

      const side = String(c.side || "").toLowerCase();
      const sideCls = side === "over" ? "side-over" : side === "under" ? "side-under" : "";
      const sideTxt = side ? side.toUpperCase() : "—";

      const propType = c.propType || "—";
      const line = c.line != null ? c.line : "—";

      // Expand panel: all canonical signals, raw
      const sigs = [];
      // 2026-05-24 — Round numeric leaks. Backend was emitting raw floats like
      // 2.5714285714285716; the FE displayed them verbatim. Now: any numeric
      // value gets rounded to 2 decimals max for display (preserves precision
      // for percentages while killing the float-leak ugliness). Strings, nulls,
      // and booleans pass through untouched.
      const fmtNum = (v) => {
        if (typeof v !== "number" || !Number.isFinite(v)) return v;
        if (Number.isInteger(v)) return v;
        return Number(v.toFixed(2));
      };
      const push = (k, v, isNull) => sigs.push({ k, v: fmtNum(v), isNull: isNull || v == null || v === "" });
      // 2026-05-25 — Skip legacy matchup/modelProb/edgeProb when NBA displayBundle
      // is present — those fields are already in displayBundle.signalsTable.
      // Pushing them here AND in displayBundle caused the operator-visible 2x
      // duplication for MATCHUP / MODEL PROB / EDGE PROB.
      const _hasNbaBundle = sport === "nba" && Array.isArray(c?.displayBundle?.signalsTable) && c.displayBundle.signalsTable.length;
      if (!_hasNbaBundle) {
        push("matchup", matchupTxt, !c.matchup);
        push("model prob", typeof c.predictedProbability === "number" ? c.predictedProbability.toFixed(4) : c.predictedProbability);
        push("edge prob", typeof c.edgeProbability === "number" ? c.edgeProbability.toFixed(4) : c.edgeProbability);
      }
      if (sport === "mlb") {
        push("implied team total", c.impliedTeamTotal);
        push("game total", c.gameTotal);
        push("HR environment", c.hrEnvironmentTag);
        push("wind", c.windDirectionTag);
        push("temperature °F", c.temperatureF);
        push("carry shift", c.carryShift);
        push("park HR factor", c.hrFactor);
        push("lineup spot", c.lineupSpot, c.lineupSpot == null);
        push("lineup depth", c.depth, c.depth == null);
        push("plate appearances", c.plateAppearancesProxy, c.plateAppearancesProxy == null);
        push("run environment", c.runEnvironment, c.runEnvironment == null);
        push("RBI environment", c.rbiEnvironment, c.rbiEnvironment == null);
        push("contextual tags", Array.isArray(c.contextualTags) ? c.contextualTags.join(", ") : null,
          !Array.isArray(c.contextualTags) || c.contextualTags.length === 0);
      } else if (sport === "nba") {
        // 2026-05-24 — Prefer canonical displayBundle.signalsTable when present.
        // Backend pre-rounds, pre-orders, and pre-filters prop-aware fields.
        // If absent, fall through to legacy push() calls below.
        if (Array.isArray(c?.displayBundle?.signalsTable) && c.displayBundle.signalsTable.length) {
          for (const row of c.displayBundle.signalsTable) {
            if (!row || row.label == null) continue;
            const v = row.value;
            sigs.push({ k: String(row.label), v: v == null ? null : String(v), isNull: v == null || v === "" });
          }
        } else {
        push("starter status", c.starterFlag === 1 ? "starter" : c.starterFlag === 0 ? "bench" : null,
             c.starterFlag == null);
        push("projected minutes", c.projectedMinutes);
        push("last 5 avg", c?.recentForm?.last5_avg);
        push("last 10 avg", c?.recentForm?.last10_avg);
        push("season baseline", c?.recentForm?.baseline);
        push("recent games sampled", c?.recentForm?.sample_count);
        // v0.1.3: NBA "days since last game" is currently broken — ESPN feed
        // not ingesting playoff games or date math wrong. Operator confirmed
        // Mobley played yesterday but feed says 11d. Hide the broken value
        // until task #12 fix lands. Shows honest pending state instead.
        {
          const dslg = c?.recentForm?.days_since_last_game;
          const looksBroken = typeof dslg === "number" && dslg >= 6;
          push("days since last game",
               looksBroken ? "playoff data refreshing" : dslg,
               dslg == null || looksBroken);
        }
        push("starter rate (recent)", c?.roleContext?.starter_rate_recent);
        push("minutes avg (recent)", c?.roleContext?.minutes_avg_recent);
        push("minutes trend", c?.roleContext?.minutes_trend);
        push("minutes volatility", c?.roleContext?.minutes_volatility);
        push("recent DNPs", c?.roleContext?.dnp_count_recent);
        push("data source", c?.roleContext?.source || c?.recentForm?.source);
        } // close: legacy fallback when displayBundle absent
      }
      // 2026-05-25 — Hide event ID (debug-only, bettor doesn't care) + compact
      // timestamp + drop bucket (tier badge in card corner already shows ELITE/
      // STRONG/PLAYABLE — duplicate info that was eating 3 wrapped lines).
      if (c.timestamp) {
        const t = new Date(c.timestamp);
        if (!isNaN(t.getTime())) {
          const hh = String(t.getHours()).padStart(2, "0");
          const mm = String(t.getMinutes()).padStart(2, "0");
          push("generated", `${hh}:${mm}`);
        }
      }

      // Bettor-native null rendering: em-dash, not the word "null". The
      // operator-facing key labels are already bettor-language (see push()
      // call sites above); raw "null" exposure read as engine-incomplete.
      const sigsHtml = sigs.map(s =>
        `<dt>${s.k}</dt><dd class="${s.isNull ? "null" : ""}">${s.isNull ? "—" : escapeHtml(String(s.v))}</dd>`
      ).join("");

      const inParlay = isLegInParlay(c);
      return `
        <div class="card ${convClass}" data-idx="${idx}">
          <button class="add-leg-btn ${inParlay ? "added" : ""}"
                  onclick="addLegFromCard(${idx}, '${sport}'); event.stopPropagation();"
                  aria-label="${inParlay ? "Added to parlay" : "Add to parlay"}"
                  title="${inParlay ? "Already in parlay" : "Add to parlay"}">${inParlay ? "✓" : "+"}</button>
          <div class="card-top">
            <div class="player-block">
              <div class="player-name">${escapeHtml(c.player || "Unknown player")}</div>
              <div class="player-meta">
                <span class="${teamCls}">${escapeHtml(teamTxt)}</span>
                ${c.matchup ? `· ${escapeHtml(c.matchup)}` : ""}
              </div>
            </div>
            <div class="tier-pill ${tier}">${tierTxt}</div>
          </div>

          <div class="prop-line">
            <span class="side ${sideCls}">${sideTxt}</span>
            <strong>${escapeHtml(String(propType))}</strong> ${line}
          </div>

          <div class="odds-book-row">
            <div class="odds ${oddsCls}">${oddsTxt}</div>
            <div class="book-pill ${bookCls}">${escapeHtml(book)}</div>
          </div>

          ${ep != null ? `
          <div class="edge-row">
            <div class="edge-bar"><div class="edge-fill ${edgeHuge ? "huge" : ""}" style="width:${edgeWidth}%"></div></div>
            <div class="edge-pct">+${ep}%</div>
          </div>` : ""}

          <div class="why">
            ${why.length ? `<div class="why-chips">${why.map(w => `<span class="why-chip">${escapeHtml(w)}</span>`).join("")}</div>`
                         : `<span class="why-empty">context loading</span>`}
          </div>

          ${notes.length ? `
          <div class="notes">
            ${notes.map(n => `<span class="note note-${n.type}">${escapeHtml(n.text)}</span>`).join("")}
          </div>` : ""}

          <button class="expand-toggle" onclick="toggleCard(${idx})">▾ show signals</button>
          <div class="expand-panel"><dl>${sigsHtml}</dl></div>
        </div>
      `;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    }

    // ─────────────────────────────────────────────────────────────
    // Render current state
    // ─────────────────────────────────────────────────────────────
    function render() {
      const main = document.getElementById("main");
      const sport = state.activeSport;
      const payload = state.data[sport];

      // Tab counts: reflect what's SURFACED after allowlist + classification,
      // not the raw candidate count. Operator 2026-05-21: "mlb shows 20 but
      // theres only 8 on the screen". Compute by counting allowed plays.
      const allowedCount = (payload) => {
        if (!payload || payload._error) return "—";
        const source = (Array.isArray(payload.featured) && payload.featured.length > 0)
          ? payload.featured : (payload.candidates || []);
        return source.filter(c => isAllowedBook(c.sportsbook || c.book)).length;
      };
      document.getElementById("mlbCount").textContent = allowedCount(state.data.mlb);
      document.getElementById("nbaCount").textContent = allowedCount(state.data.nba);
      // Parlay tab count
      const pCountEl = document.getElementById("parlayCount");
      pCountEl.textContent = state.parlay.length;
      pCountEl.classList.toggle("has-legs", state.parlay.length > 0);

      // Reset the rendered-index map; will be rebuilt as cards render.
      state._renderedIndex = {};

      // Parlay tab early-out — its own renderer, doesn't share the
      // freshness/buckets pipeline.
      if (sport === "parlay") {
        renderParlay(main);
        return;
      }
      // Analyze tab — Flow A: paste/type a slip from X/Discord, get verdict.
      if (sport === "analyze") {
        renderAnalyze(main);
        return;
      }
      // Grades tab — feedback loop: yesterday's logged picks + W/L + CLV.
      if (sport === "grades") {
        renderGradesView(main);
        return;
      }

      // Phase A2 — game-first view is the DEFAULT for MLB/NBA sport tabs.
      // Operator can toggle to "sharp" mode for the old edge-filtered view.
      // The MODE TOGGLE is always rendered (Phase A.5 fix — operator hit a
      // dead-end being stuck in Sharp mode with no way back to Games).
      const mode = state.tabMode[sport] || "games";
      if (mode === "games") {
        renderGamesView(main, sport);
        return;
      }
      // Sharp mode falls through to legacy — toggle already prepended above.

      // Date label
      const todayLabel = payload?.date || new Date().toISOString().slice(0, 10);
      document.getElementById("dateLabel").textContent = todayLabel;
      if (state.lastFetchAt) {
        const secs = Math.round((Date.now() - state.lastFetchAt) / 1000);
        document.getElementById("lastUpdate").textContent =
          secs < 60 ? `${secs}s ago` : `${Math.round(secs / 60)}m ago`;
      }

      if (!payload) {
        main.innerHTML = `<div class="loading">Loading ${sport.toUpperCase()} slate…</div>`;
        return;
      }

      if (payload._error) {
        main.innerHTML = `<div class="error">
          Failed to load ${sport.toUpperCase()}.
          <code>${escapeHtml(payload._error)}</code>
          <br><br>Backend may not be running. Try:<br>
          <code>cd backend &amp;&amp; npm run engine:start</code>
        </div>`;
        return;
      }

      let source = Array.isArray(payload.featured) && payload.featured.length > 0
        ? payload.featured
        : Array.isArray(payload.candidates) ? payload.candidates : [];
      const sourceUsed = (Array.isArray(payload.featured) && payload.featured.length > 0)
        ? "featured"
        : "candidates";
      // v0.1.3 defense-in-depth: drop any play from a book not in the operator
      // 7-book allowlist BEFORE classification. Logged so we can see how
      // many leaked through (until the canonical sportsbookAllowlist.js fix lands).
      const preFilter = source.length;
      let cands = source.filter(c => isAllowedBook(c.sportsbook || c.book));
      const droppedNonAllowed = preFilter - cands.length;

      // 2026-05-24 — multi-book dedupe on Sharp Plays (same fix shape as
      // Games view, where Vassell-style "same player same line different
      // book" cards were collapsed). Operator caught Vassell OVER 19.5
      // showing as 2 ELITE cards (BetMGM + Fanatics). Collapse by
      // (player|stat|side|line); keep the highest-edge entry, track the
      // other books for surface display.
      const dedupeMap = new Map();
      for (const c of cands) {
        const key = `${String(c.player||"").toLowerCase()}|${String(c.statFamily||c.propType||"").toLowerCase()}|${String(c.side||"").toLowerCase()}|${c.line ?? ""}`;
        const existing = dedupeMap.get(key);
        const cEdge = Number(c.edge ?? 0);
        if (!existing) {
          dedupeMap.set(key, { ...c, _alsoAt: [] });
        } else {
          const eEdge = Number(existing.edge ?? 0);
          if (cEdge > eEdge) {
            const carry = [...(existing._alsoAt || []), { book: existing.sportsbook || existing.book, odds: existing.oddsAmerican || existing.odds }];
            dedupeMap.set(key, { ...c, _alsoAt: carry });
          } else {
            existing._alsoAt = existing._alsoAt || [];
            existing._alsoAt.push({ book: c.sportsbook || c.book, odds: c.oddsAmerican || c.odds });
          }
        }
      }
      const beforeDedupe = cands.length;
      cands = Array.from(dedupeMap.values());
      const dedupedCount = beforeDedupe - cands.length;

      // Bettor-native freshness banner: "updated Xh Xm ago" reads as
      // normal operational status, never "STALE 114min" red alarm.
      const fresh = payload.snapshotFreshness;
      let freshHtml = "";
      if (fresh) {
        const ageMin = fresh.snapshotAgeMinutes;
        const label = fresh.label || fresh.status || fresh.freshness || "";
        const cls = String(label).toLowerCase().includes("stale") ? "stale"
                  : String(label).toLowerCase().includes("warning") ? "warning"
                  : "fresh";
        let ageTxt = "live";
        if (typeof ageMin === "number") {
          if (ageMin < 1) ageTxt = "updated just now";
          else if (ageMin < 60) ageTxt = `updated ${Math.round(ageMin)}m ago`;
          else {
            const h = Math.floor(ageMin / 60);
            const m = Math.round(ageMin % 60);
            ageTxt = m > 0 ? `updated ${h}h ${m}m ago` : `updated ${h}h ago`;
          }
        }
        freshHtml = `<div class="freshness ${cls}">
          <span>${ageTxt}</span>
          <span>${payload.counts?.propsWithMultiBook ?? 0} multi-book props</span>
        </div>`;
      }
      // Phase A.5: persistent mode toggle for MLB/NBA — operator can always
      // switch back to Games view even from inside Sharp Plays. Prepended
      // to freshHtml so it sits above the freshness banner.
      if (sport === "mlb" || sport === "nba") {
        freshHtml = renderModeToggle(sport) + freshHtml;
      }

      // v0.2.8b: search input is ALWAYS rendered above candidates. The
      // results live in #search-results-region — a stable container that
      // onSearchInput updates without touching the search input element.
      // This is what keeps the iPhone keyboard alive while typing
      // (operator-reported bug: keyboard disappearing on each keystroke).
      const searchState = state.search[sport] || { q: "", results: null, loading: false };
      const searchHtml = renderSearchBar(sport, searchState);
      const searchActive = searchState.q && searchState.q.length >= 2;

      if (searchActive) {
        // When search is active, the results-region holds the search results
        // and the normal candidate grid is hidden.
        main.innerHTML = freshHtml + searchHtml +
          `<div id="search-results-region">${renderSearchResults(sport, searchState)}</div>`;
        return;
      }

      if (cands.length === 0) {
        main.innerHTML = freshHtml + searchHtml +
          `<div id="search-results-region"></div>` +
          `<div class="empty">
            No candidates surfaced for ${sport.toUpperCase()} on ${todayLabel}.<br>
            Slate may still be building — pull to refresh in a few seconds.
          </div>`;
        return;
      }

      // v0.1.2: classify each play by parlay-confidence tier, then group.
      // Inside each section, sort by modelProb desc (hit-rate first) — NOT
      // by raw edge. Operator wants parlay-buildable confidence, not lotto.
      const buckets = { conviction: [], likely: [], biggerEdge: [], lotto: [] };
      for (const c of cands) {
        const cls = playClass(c, sport);
        if (cls === "conviction") buckets.conviction.push(c);
        else if (cls === "likely") buckets.likely.push(c);
        else if (cls === "bigger-edge") buckets.biggerEdge.push(c);
        else if (cls === "lotto") buckets.lotto.push(c);
        // neg-edge and unknown are silently dropped — not bettor-actionable
      }
      const byProb = (a, b) => (b.predictedProbability ?? b.modelProb ?? 0) - (a.predictedProbability ?? a.modelProb ?? 0);
      const byEdge = (a, b) => (b.edgeProbability ?? b.edge ?? 0) - (a.edgeProbability ?? a.edge ?? 0);
      buckets.conviction.sort(byProb);
      buckets.likely.sort(byProb);
      buckets.biggerEdge.sort(byEdge);  // bigger-edge section ranked by edge (its purpose)
      buckets.lotto.sort(byEdge);

      // Caps to keep the surface scannable
      buckets.conviction = buckets.conviction.slice(0, 3);
      buckets.likely = buckets.likely.slice(0, 10);
      buckets.biggerEdge = buckets.biggerEdge.slice(0, 8);
      buckets.lotto = buckets.lotto.slice(0, 12);

      let html = freshHtml + searchHtml + `<div id="search-results-region"></div>`;
      let idx = 0;

      if (buckets.conviction.length > 0) {
        html += `<div class="conviction-section">
          <div class="section-header">
            <span class="section-icon">★</span>
            <span>Tonight's Convictions</span>
            <span class="section-sub">model ≥ 65% · edge ≥ 5%</span>
          </div>
          <div class="card-grid">
            ${buckets.conviction.map(c => renderCard(c, sport, idx++, true)).join("")}
          </div>
        </div>`;
      }

      if (buckets.likely.length > 0) {
        html += `<div class="section-header likely-section">
          <span>Likely To Hit</span>
          <span class="section-sub">parlay-leg pool · ${buckets.likely.length} plays</span>
        </div>
        <div class="card-grid">
          ${buckets.likely.map(c => renderCard(c, sport, idx++, false)).join("")}
        </div>`;
      }

      if (buckets.biggerEdge.length > 0) {
        html += `<div class="section-header all-opps">
          <span>Bigger Edges</span>
          <span class="section-sub">larger payouts · less reliable · ${buckets.biggerEdge.length} plays</span>
        </div>
        <div class="card-grid">
          ${buckets.biggerEdge.map(c => renderCard(c, sport, idx++, false)).join("")}
        </div>`;
      }

      if (buckets.lotto.length > 0) {
        // v0.1.4: auto-open Lotto when it's the only populated bucket — otherwise
        // the screen looks dead (operator saw this 2026-05-21 on a variance-heavy
        // MLB slate). Show a friendly explainer above so the operator knows why
        // there are no parlay-leg plays tonight.
        const noOtherBuckets = buckets.conviction.length === 0 &&
                               buckets.likely.length === 0 &&
                               buckets.biggerEdge.length === 0;
        const openAttr = noOtherBuckets ? "open" : "";
        if (noOtherBuckets) {
          html += `<div class="empty-explainer">
            Tonight's ${sport.toUpperCase()} slate is variance-heavy — no plays in the high-hit-rate buckets, only longshots. The lotto plays are below; use small stakes.
          </div>`;
        }
        html += `<details class="lotto-section" ${openAttr}>
          <summary class="section-header lotto-toggle">
            <span>Lotto Room</span>
            <span class="section-sub">${buckets.lotto.length} variance plays · big payouts · low hit rate</span>
          </summary>
          <div class="card-grid lotto-cards">
            ${buckets.lotto.map(c => renderCard(c, sport, idx++, false)).join("")}
          </div>
        </details>`;
      }

      // Diagnostic footer — small grey line at bottom for operator transparency
      const totalShown = buckets.conviction.length + buckets.likely.length + buckets.biggerEdge.length + buckets.lotto.length;
      const dropMsg = droppedNonAllowed > 0 ? ` · ${droppedNonAllowed} non-allowed books filtered` : "";
      html += `<div class="diag-footer">source: ${sourceUsed} · ${totalShown}/${cands.length} shown${dropMsg}</div>`;

      main.innerHTML = html;
    }

    // ─────────────────────────────────────────────────────────────
    // Card expansion
    // ─────────────────────────────────────────────────────────────
    function toggleCard(idx) {
      const card = document.querySelector(`.card[data-idx="${idx}"]`);
      if (!card) return;
      card.classList.toggle("expanded");
      const btn = card.querySelector(".expand-toggle");
      if (btn) btn.textContent = card.classList.contains("expanded") ? "▴ hide signals" : "▾ show signals";
    }
    window.toggleCard = toggleCard;

    // ─────────────────────────────────────────────────────────────
    // Phase A2 (2026-05-22): Game-first view
    // Default surface for MLB/NBA tabs — tonight's games → starters → primary
    // props. Replaces the 6-no-name edge-filtered display the operator hated.
    // Stars come back as the default. Edge plays move to a secondary toggle.
    // ─────────────────────────────────────────────────────────────
    function renderModeToggle(sport) {
      const mode = state.tabMode[sport] || "games";
      const isGames = mode === "games";
      const isSharp = mode === "sharp";
      return `
        <div style="display: flex; gap: 4px; margin-bottom: 12px; padding: 0;">
          <button onclick="setTabMode('${sport}', 'games')" style="
            flex: 1; padding: 8px 12px; font-size: 12px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
            background: ${isGames ? "linear-gradient(135deg, #1E293B 0%, #141828 100%)" : "transparent"};
            border: 1px solid ${isGames ? "#FBBF24" : "#1F2937"};
            color: ${isGames ? "#FBBF24" : "#6B7280"};
            border-radius: 8px;">Tonight's Games</button>
          <button onclick="setTabMode('${sport}', 'sharp')" style="
            flex: 1; padding: 8px 12px; font-size: 12px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
            background: ${isSharp ? "linear-gradient(135deg, #1E293B 0%, #141828 100%)" : "transparent"};
            border: 1px solid ${isSharp ? "#FBBF24" : "#1F2937"};
            color: ${isSharp ? "#FBBF24" : "#6B7280"};
            border-radius: 8px;">Sharp Plays</button>
        </div>
      `;
    }
    function setTabMode(sport, mode) {
      state.tabMode[sport] = mode;
      if (mode === "games" && !state.games[sport]) {
        // Fetch games data lazily
        fetchGames(sport);
      }
      render();
    }
    window.setTabMode = setTabMode;

    async function fetchGames(sport) {
      state.games.loading = true;
      try {
        const r = await fetch(`${API}/api/ws/games?sport=${sport}`);
        const json = await r.json();
        state.games[sport] = (r.ok && json.ok) ? json : { ok: false, _error: json?.error || `HTTP ${r.status}` };
      } catch (e) {
        state.games[sport] = { ok: false, _error: e.message || String(e) };
      }
      state.games.loading = false;
      render();
    }

    function renderGamesView(main, sport) {
      const toggleHtml = renderModeToggle(sport);
      const data = state.games[sport];
      if (!data) {
        // Trigger lazy fetch on first visit
        fetchGames(sport);
        main.innerHTML = toggleHtml + `<div class="empty">Loading tonight's games…</div>`;
        return;
      }
      if (data._error) {
        main.innerHTML = toggleHtml + `<div class="error">
          Couldn't load games. <code>${escapeHtml(data._error)}</code>
        </div>`;
        return;
      }
      if (!Array.isArray(data.games) || data.games.length === 0) {
        main.innerHTML = toggleHtml + `<div class="empty">
          No ${sport.toUpperCase()} games on the slate tonight.<br>
          <span style="font-size: 11px; color: #6B7280;">If you expected games, try refreshing the slate (↻)</span>
        </div>`;
        return;
      }

      const gamesHtml = data.games.map(g => renderGameCard(g, sport)).join("");
      main.innerHTML = toggleHtml + gamesHtml +
        `<div class="diag-footer">
          games-view v0.3.0 · ${data.games.length} game${data.games.length === 1 ? "" : "s"} ·
          ${data.totalRows} snapshot rows · ${data.totalKept} kept after policy filter
        </div>`;
    }

    function renderGameCard(g, sport) {
      const players = Array.isArray(g.players) ? g.players : [];
      const matchupTxt = g.matchup || `${g.awayTeam || ""} @ ${g.homeTeam || ""}` || "Game";
      const gameTimeTxt = g.gameTime ? new Date(g.gameTime).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "";

      const primaryFamilies = sport === "nba"
        ? ["Points", "Rebounds", "Assists", "Threes", "PRA"]
        : ["Hits", "Home Runs", "Total Bases", "RBIs", "Strikeouts"];

      // Phase A.5: collapsed by default. Show game header only; tap to expand.
      const isExpanded = !!state.expandedGames[g.eventId];
      const playersHtml = isExpanded
        ? (players.map(p => renderPlayerCard(p, sport, primaryFamilies, g.eventId)).join("")
           || `<div style="padding: 16px; color: #6B7280; text-align: center; font-size: 12px;">No players with primary props in this game tonight.</div>`)
        : "";
      const caret = isExpanded ? "▾" : "▸";

      return `
        <div style="margin-bottom: 10px;">
          <div onclick="toggleGameExpand('${escapeHtml(g.eventId)}')"
               style="background: linear-gradient(180deg, #1A1424 0%, #11151F 100%);
                      border: 1px solid #1F2937;
                      border-radius: ${isExpanded ? "12px 12px 0 0" : "12px"};
                      ${isExpanded ? "border-bottom: none;" : ""}
                      padding: 12px 14px; cursor: pointer;
                      display: flex; align-items: center; gap: 10px;">
            <span style="color: #6B7280; font-size: 14px; min-width: 14px;">${caret}</span>
            <div style="flex: 1;">
              <div style="font-size: 13px; font-weight: 700; color: #F9FAFB; text-transform: uppercase; letter-spacing: 0.4px;">
                ${escapeHtml(matchupTxt)}
              </div>
              <div style="font-size: 11px; color: #6B7280; margin-top: 2px;">
                ${escapeHtml(gameTimeTxt)} · ${players.length} player${players.length === 1 ? "" : "s"} with props
              </div>
            </div>
          </div>
          ${isExpanded ? `<div style="background: #11151F; border: 1px solid #1F2937; border-top: 0; border-radius: 0 0 12px 12px; padding: 8px;">${playersHtml}</div>` : ""}
        </div>
      `;
    }

    function toggleGameExpand(eventId) {
      state.expandedGames[eventId] = !state.expandedGames[eventId];
      render();
    }
    window.toggleGameExpand = toggleGameExpand;

    function togglePlayerExpand(key) {
      state.expandedPlayers[key] = !state.expandedPlayers[key];
      render();
    }
    window.togglePlayerExpand = togglePlayerExpand;

    function renderPlayerCard(p, sport, primaryFamilies, eventId) {
      const teamTxt = p.team ? p.team : "team pending";
      const teamCls = p.team ? "#9CA3AF" : "#FCD34D";
      const starterTag = p.starterFlag === 1
        ? `<span style="font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: rgba(52, 211, 153, 0.15); color: #34D399; letter-spacing: 0.3px;">STARTER</span>`
        : "";
      const ceilingTag = (typeof p.ceilingScore === "number" && p.ceilingScore >= 0.55)
        ? `<span style="font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
                       background: ${p.ceilingScore >= 0.72 ? "rgba(251, 191, 36, 0.18)" : "rgba(251, 191, 36, 0.10)"};
                       color: #FBBF24; letter-spacing: 0.3px;">CEILING ${(p.ceilingScore * 100).toFixed(0)}</span>`
        : "";
      const minutesTxt = (typeof p.projectedMinutes === "number")
        ? `<span style="color: #6B7280;">${p.projectedMinutes.toFixed(1)}min</span>`
        : "";
      const recent = p.recentForm;
      const formTxt = (recent && typeof recent.last5_avg === "number")
        ? `<span style="color: #6B7280;">L5: <span style="color: #D1D5DB; font-family: ui-monospace, monospace;">${recent.last5_avg.toFixed(1)}</span></span>`
        : "";

      // Count available prop families for the summary line
      const availableFamilies = primaryFamilies
        .filter(fam => Array.isArray(p.propGroups?.[fam]) && p.propGroups[fam].length > 0);
      if (availableFamilies.length === 0) return "";

      // Calibration overlay (2026-05-23) — sort families so the model's
      // trusted props appear first inside a player card, broken props last.
      // Order: calibrated > underconfident > insufficient > overconfident > broken
      const STATUS_RANK = {
        calibrated_positive: 0,
        calibrated_neutral: 1,
        miscalibrated_underconfident: 2,
        insufficient_sample: 3,
        no_data: 4,
        miscalibrated_overconfident: 5,
        broken: 6,
      };
      availableFamilies.sort((a, b) => {
        const sa = STATUS_RANK[p.familyCalibration?.[a]?.status ?? "no_data"];
        const sb = STATUS_RANK[p.familyCalibration?.[b]?.status ?? "no_data"];
        return sa - sb;
      });

      // Phase A.5: player row collapsed by default. Tap to expand props.
      const playerKey = `${eventId}|${p.player}`;
      const isExpanded = !!state.expandedPlayers[playerKey];
      const propBlocks = isExpanded
        ? availableFamilies.map(fam => renderPlayerPropFamily(fam, p.propGroups[fam], p, sport)).join("")
        : "";
      const caret = isExpanded ? "▾" : "▸";

      return `
        <div style="background: #141828; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;">
          <div onclick="togglePlayerExpand('${escapeHtml(playerKey).replace(/'/g, "\\'")}')"
               style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <span style="color: #6B7280; font-size: 12px; min-width: 12px;">${caret}</span>
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                <span style="font-size: 14px; font-weight: 700; color: #F9FAFB;">${escapeHtml(p.player)}</span>
                ${starterTag}
                ${ceilingTag}
              </div>
              <div style="font-size: 11px; color: ${teamCls}; margin-top: 2px;">
                ${escapeHtml(teamTxt)}${minutesTxt ? " · " + minutesTxt : ""}${formTxt ? " · " + formTxt : ""}
                · <span style="color: #4B5563;">${availableFamilies.length} prop type${availableFamilies.length === 1 ? "" : "s"}</span>
              </div>
            </div>
          </div>
          ${isExpanded ? `<div style="margin-top: 10px;">${propBlocks}</div>` : ""}
        </div>
      `;
    }

    function renderPlayerPropFamily(fam, props, player, sport) {
      // Find best over and best under
      const overs  = props.filter(p => p.side === "over").sort((a, b) => Number(a.line ?? 0) - Number(b.line ?? 0));
      const unders = props.filter(p => p.side === "under").sort((a, b) => Number(b.line ?? 0) - Number(a.line ?? 0));

      // (2026-05-23 fix) Ensure the model's actual pick line is always
      // included in the visible ladder. Without this, the family header can
      // say "model → UNDER 11.5" while the displayed unders are 32.5/33.5/34.5
      // and the operator never sees the line the model is actually recommending.
      const fp = player.familyProjection && player.familyProjection[fam];
      function ensureModelLineVisible(arr, side, sliceN) {
        if (!fp || fp.bestSide !== side || !Number.isFinite(fp.bestLine)) return arr.slice(0, sliceN);
        const inWindow = arr.slice(0, sliceN);
        const alreadyShown = inWindow.some(p => Number(p.line) === Number(fp.bestLine));
        if (alreadyShown) return inWindow;
