      try {
        const r = await fetch(`${API}/api/ws/deeplink-testlinks?_t=${Date.now()}`, { cache: "no-store" });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || "failed");
        if (!d.pregame) {
          panel.innerHTML = `<div style="color:#FBBF24;font-size:12px;line-height:1.5;">${escapeHtml(d.note || "no pre-game markets live right now")}</div>`;
          return;
        }
        const vBtns = (book, kind, url) => ["opened_loaded|✓ loaded|#34D399", "opened_empty|◐ empty|#FBBF24", "failed|✗ failed|#F87171"].map((s) => {
          const [v, lbl, c] = s.split("|");
          return `<button onclick="window._tlVerdict(this,'${escapeHtml(book)}','${kind}','${v}')" data-url="${escapeHtml(url)}" style="padding:4px 8px;border-radius:5px;border:1px solid #374151;background:none;color:${c};font-size:10px;cursor:pointer;">${lbl}</button>`;
        }).join(" ");
        panel.innerHTML = `<div style="font-size:11px;color:#6B7280;margin-bottom:8px;">fresh @ ${escapeHtml(d.generatedAt)} — tap a link, place NOTHING, come back and record the verdict</div>` +
          d.books.map((bk) => `
            <div style="border-top:1px solid #1B2030;padding:8px 0;">
              <div style="font-size:12px;font-weight:700;color:#F9FAFB;">${escapeHtml(bk.book)}</div>
              ${bk.single ? `<div style="margin-top:4px;"><a href="${escapeHtml(bk.single.url)}" target="_blank" rel="noopener noreferrer" style="color:#A78BFA;font-size:11px;">↗ single: ${escapeHtml(bk.single.label)}</a><div style="margin-top:3px;">${vBtns(bk.book, "single", bk.single.url)}</div></div>` : ""}
              ${bk.multi ? `<div style="margin-top:6px;"><a href="${escapeHtml(bk.multi.url)}" target="_blank" rel="noopener noreferrer" style="color:#A78BFA;font-size:11px;">↗ 2-leg (${escapeHtml(bk.multi.syntax)}): ${escapeHtml(bk.multi.label)}</a><div style="margin-top:3px;">${vBtns(bk.book, "multi", bk.multi.url)}</div></div>` : ""}
              ${bk.note ? `<div style="margin-top:4px;font-size:10px;color:#6B7280;">${escapeHtml(bk.note)}</div>` : ""}
            </div>`).join("");
      } catch (e) {
        panel.innerHTML = `<div style="color:#F87171;font-size:12px;">✗ ${escapeHtml(String(e?.message || e))}</div>`;
      }
    };
    window._tlVerdict = async function (btnEl, book, kind, verdict) {
      try {
        btnEl.disabled = true;
        const r = await fetch(`${API}/api/ws/deeplink-verdict`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ book, kind, verdict, url: btnEl.getAttribute("data-url") || "" }),
        });
        const d = await r.json().catch(() => ({}));
        btnEl.textContent = d.ok ? "✓ recorded" : "✗";

    // POSTs to /api/ws/ledger/log which wraps buildPersonalLedger.addOrUpdateBet.
    // Idempotent on stableId — re-tapping same play won't duplicate.

    // ─────────────────────────────────────────────────────────────
    // v0.2.8: Player Search (Wemby / SGA / any star, regardless of edge)
    // ─────────────────────────────────────────────────────────────
    function renderSearchBar(sport, searchState) {
      const placeholderHints = sport === "nba"
        ? "Search player — try 'wemby', 'sga', 'castle', 'mobley'…"
        : "Search player — try 'judge', 'soto', 'ohtani'…";
      return `
        <div style="margin-bottom: 12px;">
          <input id="search-${sport}" type="text"
                 placeholder="${placeholderHints}"
                 value="${escapeHtml(searchState.q || "")}"
                 oninput="onSearchInput('${sport}', this.value)"
                 style="width: 100%; padding: 10px 12px;
                        background: #141828; border: 1px solid ${searchState.q ? "#38BDF8" : "#1F2937"};
                        color: #E5E7EB; border-radius: 10px; font-size: 14px;
                        font-family: inherit; box-sizing: border-box;
                        transition: border-color 0.15s ease;" />
        </div>
      `;
    }

    function renderSearchResults(sport, searchState) {
      if (searchState.loading) {
        return `<div class="empty" style="padding: 24px;">Searching…</div>`;
      }
      const results = searchState.results;
      if (!results || results.length === 0) {
        return `<div class="empty" style="padding: 24px;">
          No props found for "${escapeHtml(searchState.q)}" in tonight's ${sport.toUpperCase()} slate.<br>
          <span style="font-size: 11px; color: #6B7280;">Try a different spelling, nickname, or check NBA tab if MLB</span>
        </div>`;
      }
      // Group by player + propType so all of "Wemby Points" props are together
      const groups = new Map();
      for (const r of results) {
        const key = `${r.player}|${r.propType}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      let html = `<div style="font-size: 11px; color: #9CA3AF; padding: 0 4px 8px; text-transform: uppercase; letter-spacing: 0.5px;">
        ${results.length} prop${results.length === 1 ? "" : "s"} across ${groups.size} player-prop combos
      </div>`;
      let idx = 0;
      for (const [key, group] of groups) {
        const [player, propType] = key.split("|");
        const teamTxt = group[0].team || "team pending";
        html += `<div style="margin-bottom: 14px;">
          <div style="padding: 4px 4px 6px; font-size: 13px;">
            <span style="font-weight: 700; color: #F9FAFB;">${escapeHtml(player)}</span>
            <span style="color: #6B7280; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px;"> · ${escapeHtml(teamTxt)} · ${escapeHtml(propType)}</span>
          </div>
          <div class="card-grid">
            ${group.map(r => renderSearchResultCard(r, sport, idx++)).join("")}
          </div>
        </div>`;
      }
      return html;
    }

    function renderSearchResultCard(c, sport, idx) {
      // Cache in renderedIndex so + add-to-parlay button works
      if (state._renderedIndex) state._renderedIndex[sport + ":" + idx] = c;
      const inParlay = isLegInParlay(c);
      const side = String(c.side || "").toLowerCase();
      const sideCls = side === "over" ? "side-over" : side === "under" ? "side-under" : "";
      const sideTxt = side ? side.toUpperCase() : "—";
      const odds = c.oddsAmerican ?? c.odds;
      const oddsTxt = fmtOdds(odds);
      const oddsCls = (typeof odds === "number" && odds > 0) ? "positive" : "";
      const book = c.sportsbook || c.book || "—";
      const bookCls = bookClass(book);
      const propLabel = c.propType ? String(c.propType) : "";
      return `
        <div class="card" data-idx="${idx}">
          <button class="add-leg-btn ${inParlay ? "added" : ""}"
                  onclick="addLegFromCard(${idx}, '${sport}'); event.stopPropagation();"
                  title="${inParlay ? "Already in parlay" : "Add to parlay"}">${inParlay ? "✓" : "+"}</button>
          <div class="prop-line">
            <span class="side ${sideCls}">${sideTxt}</span>
            <strong>${escapeHtml(propLabel)}</strong> ${c.line ?? "—"}
          </div>
          <div class="odds-book-row">
            <div class="odds ${oddsCls}">${oddsTxt}</div>
            <div class="book-pill ${bookCls}">${escapeHtml(book)}</div>
          </div>
        </div>
      `;
    }

    // v0.2.8b: search updates ONLY #search-results-region — never re-renders
    // the input element, never calls render(). This is what keeps the iPhone
    // keyboard alive while typing (each render() destroys + recreates DOM,
    // Safari dismisses the keyboard when the focused input disappears).
    let _searchDebounce = null;
    function onSearchInput(sport, value) {
      if (!state.search[sport]) state.search[sport] = { q: "", results: null, loading: false };
      state.search[sport].q = value;
      clearTimeout(_searchDebounce);

      const region = document.getElementById("search-results-region");

      if (!value || value.length < 2) {
        state.search[sport].results = null;
        state.search[sport].loading = false;
        // Clear the search results region but DON'T re-render — that would
        // destroy the input + close the keyboard. The user can manually clear
        // and the normal display reappears on next tab switch / refresh.
        if (region) region.innerHTML = "";
        return;
      }

      state.search[sport].loading = true;
      // Show a quick "Searching…" placeholder in the region while we fetch
      if (region) region.innerHTML = `<div class="empty" style="padding: 24px;">Searching…</div>`;

      _searchDebounce = setTimeout(async () => {
        try {
          const r = await fetch(`${API}/api/ws/player-search?sport=${sport}&q=${encodeURIComponent(value)}`);
          const json = await r.json();
          state.search[sport].results = (r.ok && json.ok && Array.isArray(json.results)) ? json.results : [];
        } catch (_) {
          state.search[sport].results = [];
        }
        state.search[sport].loading = false;
        // Only update if user is still on this tab and still typing this query
        if (state.activeSport === sport && state.search[sport].q === value) {
          const liveRegion = document.getElementById("search-results-region");
          if (liveRegion) {
            liveRegion.innerHTML = renderSearchResults(sport, state.search[sport]);
          }
        }
      }, 300);
    }
    window.onSearchInput = onSearchInput;

    // ═════════════════════════════════════════════════════════════════
    // 2026-05-30 FE v2 — TOP PICKS / MY BETS / GAMES renderers
    // ═════════════════════════════════════════════════════════════════

    // ── Shared helpers for v2 cards ──────────────────────────────────
    function _tierColor(t) {
      const tier = String(t || "").toUpperCase();
      if (tier === "ELITE") return "#FBBF24";
      if (tier === "STRONG") return "#34D399";
      if (tier === "PLAYABLE") return "#38BDF8";
      return "#9CA3AF";
    }
    function _confPct(p) { return p == null ? "—" : `${(p * 100).toFixed(0)}%`; }
    function _edgePct(e) { return e == null ? "—" : `${(e >= 0 ? "+" : "")}${(e * 100).toFixed(1)}%`; }
    function _famNice(f) {
      const s = String(f || "").replace(/_/g, " ");
      const M = { "points rebounds assists": "PRA", "points rebounds": "P+R", "points assists": "P+A", "rebounds assists": "R+A",
                  "ks": "Ks", "rbis": "RBI", "totalbases": "Total Bases", "hr": "HR" };
      return M[s] || s.replace(/\b\w/g, (c) => c.toUpperCase());
    }
    // 2026-06-01 Phase Truth-Fix-1E (audit RED #4) — bettor-readable tier
    // labels. Internal tier names (ELITE/STRONG/PLAYABLE/BEST) get exposed to
    // operator on TOP PICKS section headers + summary line. Operator
    // doesn't intuitively know what "PLAYABLE" means — translate to
    // bettor-facing language. Falls through to original for unknown labels
    // so we never lose information.
    function _tierNice(t) {
      const k = String(t || "").toUpperCase();
      if (k === "ELITE")    return "Top tier";
      if (k === "BEST")     return "Best";
      if (k === "STRONG")   return "Strong";
      if (k === "PLAYABLE") return "Worth a look";
      if (k === "FADE")     return "Fade";
      if (k === "LONGSHOT") return "Longshot";
      return t;
    }
    function _sideNice(s) { return String(s || "").toUpperCase(); }
    function _oddsNice(o) {
      const n = Number(o); if (!Number.isFinite(n)) return "—";
      return n > 0 ? `+${n}` : `${n}`;
    }

    // Format ISO gameTime → "8:00 PM ET"
    function _gameTimeNice(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      try {
        return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
      } catch (e) { return ""; }
    }

    // Render reasoning blob → 3 always-on rows + driver bullets.
    // 2026-05-31 R2.2: contrast bump. Labels #9CA3AF → #D1D5DB, values keep their
    // semantic color (green/blue/yellow) at #F9FAFB-bright shade, drivers #D1D5DB.
    function _renderReasoning(reasoning) {
      if (!reasoning) return "";
      const row = (item, color) => {
        if (!item) return "";
        return `<div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:13px;border-top:1px solid #1F2937;">
          <span style="color:#D1D5DB;">${escapeHtml(item.label || "")}</span>
          <span style="color:${color || "#F9FAFB"};text-align:right;font-family:ui-monospace,monospace;font-weight:600;">${escapeHtml(String(item.value ?? "—"))}</span>
        </div>`;
      };
      let html = `<div>`;
      html += row(reasoning.l5, "#34D399");
      html += row(reasoning.opp, "#60A5FA");
      html += row(reasoning.propSpec, "#FBBF24");
      const drivers = (reasoning.drivers || []).filter(Boolean);
      if (drivers.length) {
        html += `<div style="margin-top:10px;padding-top:8px;border-top:1px solid #1F2937;font-size:12px;color:#D1D5DB;line-height:1.7;">`;
        for (const dr of drivers) html += `· ${escapeHtml(String(dr))}<br>`;
        html += `</div>`;
      }
      html += `</div>`;
      return html;
    }

    // T1 #1 — condense the SAME reasoning blob the modal uses (pick.reasoning) into ONE inline
    // card line, so the TOP PICKS card and the GAMES/modal stay consistent (same source).
    // Excludes propSpec + any "Model: … conf … edge" driver (those restate the card's own
    // conf/edge, not a reason). De-dups repeated L5 mentions. Trap-1: null / '' / undefined /
    // empty-blob → "" so the caller renders NOTHING (never "no reason available").
    function _reasoningOneLine(reasoning) {
      if (!reasoning) return "";
      const parts = []; let seenL5 = false;
      const push = (s) => {
        if (!s) return; s = String(s).trim(); if (!s) return;
        if (/^model:/i.test(s)) return;                       // restates the card's own conf/edge — not a reason
        if (/\bl5\b/i.test(s)) { if (seenL5) return; seenL5 = true; }
        if (!parts.includes(s)) parts.push(s);
      };
      for (const dr of (reasoning.drivers || [])) push(dr);
      if (reasoning.opp && reasoning.opp.value && !/pending sync/i.test(reasoning.opp.value)) push(`${reasoning.opp.label} ${reasoning.opp.value}`);
      if (reasoning.l5 && reasoning.l5.value != null) push(`${reasoning.l5.label} ${reasoning.l5.value}`);
      if (!parts.length) return "";
      let line = parts.join(" · ");
      if (line.length > 80) line = line.slice(0, 79).trimEnd() + "…";
      return line;
    }

    // Render book options list (when a prop has multiple book/odds pairs).
    // Dedup by book, keep best odds per book.
    function _renderBookOptions(opts) {
      if (!opts || opts.length <= 1) return "";
      // Dedup by book — keep best odds for each book
      const byBook = new Map();
      for (const o of opts) {
        if (!isPreferredBook(o.book)) continue;
        const prev = byBook.get(o.book);
        if (!prev || Number(o.odds) > Number(prev.odds)) byBook.set(o.book, o);
      }
      const allowed = Array.from(byBook.values());
      if (allowed.length <= 1) return "";
      let html = `<div style="margin-top:10px;padding-top:8px;border-top:1px solid #1F2937;font-size:12px;color:#D1D5DB;">
        <div style="color:#9CA3AF;margin-bottom:5px;font-size:11px;">Other books:</div>`;
      for (const o of allowed.slice(0, 6)) {
        html += `<span style="display:inline-block;background:#0F1422;padding:4px 8px;border-radius:5px;margin:3px 6px 3px 0;font-family:ui-monospace,monospace;">${escapeHtml(o.book || "?")} <b>${_oddsNice(o.odds)}</b></span>`;
      }
      html += `</div>`;
      return html;
    }

    // Global modal for card expansion. One body-level overlay populated on tap.
    // 2026-05-31 R2.2.1: anchored to the source card, NOT center of screen.
    // Backdrop is full-screen but the .inner card positions itself over (or
    // beside) the tapped element, flipping to stay in viewport.
    if (!document.getElementById("v2-modal-style")) {
      const _ms = document.createElement("style");
      _ms.id = "v2-modal-style";
      _ms.textContent = `
        #v2-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9999; display: none; }
        #v2-modal.open { display: block; }
        #v2-modal .inner { position: absolute; background: #141828; width: 320px; max-width: 92vw; max-height: 70vh; overflow-y: auto; border-radius: 12px; padding: 16px; border: 1px solid #2A3142; box-shadow: 0 14px 40px rgba(0,0,0,0.75); }
        #v2-modal .close { float: right; background: transparent; border: 0; color: #D1D5DB; font-size: 22px; cursor: pointer; padding: 0 8px; line-height: 1; }
        #v2-modal .hdr { font-size: 16px; font-weight: 700; color: #F9FAFB; margin-bottom: 4px; }
        #v2-modal .sub { font-size: 13px; color: #D1D5DB; margin-bottom: 4px; }
        #v2-modal .mu { font-size: 11px; color: #D1D5DB; margin-bottom: 12px; }
      `;
      document.head.appendChild(_ms);
      const overlay = document.createElement("div");
      overlay.id = "v2-modal";
      overlay.innerHTML = `<div class="inner"></div>`;
      overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
      document.body.appendChild(overlay);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") overlay.classList.remove("open"); });
    }
    // Open the modal anchored to the tapped element. `srcEl` is the card DOM
    // element that was tapped — we use its bounding rect to position the
    // modal next to it (above if there's no room below, etc.).
    window._v2OpenModal = function(pickJson, srcEl) {
      try {
        const p = typeof pickJson === "string" ? JSON.parse(pickJson) : pickJson;
        const overlay = document.getElementById("v2-modal");
        const inner = overlay.querySelector(".inner");
        // 2026-06-10 Card v2 — popup reads the DISPLAY tier (cap-consistent with the
        // card). When capped, show the honest transparent line instead of a bare ELITE.
        const dispTier = String(p.displayTier || p.tier || p.modelTier || "").toUpperCase();
        const origTier = String(p.tier || p.modelTier || "").toUpperCase();
        const tierC = _tierColor(dispTier);
        const conf = _confPct(p.modelProb);
        const edge = _edgePct(p.edge);
        const odds = _oddsNice(p.oddsAmerican || p.odds);
        const book = escapeHtml(p.sportsbook || p.book || "?");
        const tierBadge = p.tierCapNote
          ? `<b style="color:${tierC};">${tierLabel(dispTier)}</b> <span style="color:#9CA3AF;font-style:italic;">· model rated ${origTier} — under review (not yet beating the market)</span>`
          : `<b style="color:${tierC};">${tierLabel(dispTier)}</b>`;
        const pphLine = _renderPerPlayerLine(p);
        // Card v2 — the DETAIL stat table lives in the popup (off the face).
        const _sig = (p.displayBundle && Array.isArray(p.displayBundle.signalsTable)) ? p.displayBundle.signalsTable : [];
        const sigHtml = _sig.length
          ? `<div style="border-top:1px solid #1B2030;margin-top:9px;padding-top:8px;display:flex;flex-direction:column;gap:5px;font-size:11px;">${_sig.map(r => `<div style="display:flex;justify-content:space-between;gap:10px;"><span style="color:#6B7280;flex:0 0 auto;">${escapeHtml(String(r.label))}</span><span style="color:#D1D5DB;text-align:right;">${escapeHtml(String(r.value))}</span></div>`).join("")}</div>`
          : "";
        inner.innerHTML = `
          <button class="close" onclick="document.getElementById('v2-modal').classList.remove('open');">×</button>
          <div class="hdr">${escapeHtml(p.player || "?")}${p.team ? ` <span style="font-size:12px;font-weight:500;color:#6B7280;">· ${escapeHtml(p.team)}</span>` : ""}</div>
          <div class="sub">${_famNice(p.statFamily)} <b style="color:#F9FAFB;">${_sideNice(p.side)} ${p.line}</b></div>
          <div class="mu">${escapeHtml(p.matchup || "")} · ${odds} @ ${book} · ${tierBadge}</div>
          <div class="mu" style="margin-top:4px;"><span style="color:#7DD3FC;">${conf} model confidence</span> · <span style="color:#34D399;">${edge} edge vs market</span></div>
          ${pphLine}
          ${sigHtml}
          ${_renderReasoning(p.reasoning)}
          ${_renderBookOptions(p.bookOptions)}
          ${_renderPlaceBetPanel(p)}
        `;
        window._pbCurrentPick = p; // EXEC-CARD — the pick the confirm handler records
        overlay.classList.add("open");
        // Position over/near source. Compute after .open so dims are real.
        const vw = window.innerWidth, vh = window.innerHeight;
        // 2026-06-10 Card v2 — full card-width popup (was a narrow 320px box).
        const innerW = Math.min(520, vw * 0.94);
        let left, top;
        if (srcEl && srcEl.getBoundingClientRect) {
          const r = srcEl.getBoundingClientRect();
          // Prefer overlaying the card (so eyeline doesn't jump); horizontally center on the card, clamp to viewport.
          left = Math.max(8, Math.min(vw - innerW - 8, r.left + (r.width / 2) - (innerW / 2)));
          // Vertical: try to anchor top of modal at top of card. If would overflow, lift up to fit.
          const innerH = Math.min(inner.scrollHeight || 400, vh * 0.7);
          top = r.top;
          if (top + innerH > vh - 8) top = Math.max(8, vh - innerH - 8);
          if (top < 8) top = 8;
        } else {
          // Fallback: center
          left = (vw - innerW) / 2; top = vh * 0.08;
        }
        inner.style.left = left + "px";
        inner.style.top = top + "px";
        inner.style.width = innerW + "px";
      } catch (e) { console.error("modal open failed", e); }
    };

    // 2026-06-10 Card v2 — the "won X%" line, PER-PLAYER first. Ladder:
    //   1. pick.playerPropHistory (THIS player's own rate on THIS line) — "Langeliers:
    //      under 2.5 in 14 of his last 18 (78%)". Wemby ≠ Vassell.
    //   2. labeled TYPE bucket (pick.archetypeHistory) — explicitly "picks like this",
    //      never dressed as the player.
    //   3. "not enough games yet" when neither is real (omit-not-fabricate).
    function _renderPerPlayerLine(pick) {
      const base = `font-size:11px;color:#7DD3FC;margin-top:5px;line-height:1.3;`;
      const pph = pick && pick.playerPropHistory;
      if (pph && pph.n && pph.hits != null && pph.rate != null) {
        const pct = Math.round(pph.rate * 100);
        const verb = String(pph.side).toLowerCase() === "under" ? "under" : "over";
        const last = escapeHtml(String(pick.player || "").trim().split(/\s+/).slice(-1)[0] || pick.player || "");
        return `<div style="${base}">📊 ${last}: ${verb} ${pick.line} in <b>${pph.hits} of his last ${pph.n}</b> games · <b>${pct}%</b></div>`;
      }
      const ah = pick && pick.archetypeHistory;
      if (ah && ah.hitRate != null && ah.n) {
        const pct = Math.round(ah.hitRate * 100);
        const what = (ah.broad === true || ah.bucket === "family") ? "type-wide" : "same side/odds";
        return `<div style="${base}color:#9CA3AF;">📊 picks like this: <b>${pct}%</b> of ${ah.n} <span style="color:#6B7280;">(${what}, not ${escapeHtml(String(pick.player || "this player").trim().split(/\s+/).slice(-1)[0])} alone)</span></div>`;
      }
      return `<div style="${base}color:#6B7280;">📊 not enough games yet</div>`;
    }

    // ── v2 compact card: tiny collapsed face, inline expand with reasoning ──
    // opts.compact = true → 3-col-grid friendly stacked layout (TOP PICKS, GAMES inside player)
    // opts.showStar = true → show ⭐ for top-pick props (used in GAMES tab)
    function renderV2Card(pick, opts = {}) {
      // 2026-06-10 Card v2 — cap-consistent: border + conf color use the DISPLAY tier
      // (the honest earned-or-capped tier), not the raw scoring tier.
      const tier = String(pick.displayTier || pick.tier || pick.modelTier || "").toUpperCase();
      const tierC = _tierColor(tier);
      const conf = _confPct(pick.modelProb);
      const edge = _edgePct(pick.edge);
      const sportBadge = pick.sport ? `<span style="background:#1F2937;color:#9CA3AF;font-size:8px;padding:1px 4px;border-radius:3px;">${pick.sport.toUpperCase()}</span>` : "";
      const starBadge = opts.showStar && pick.isTopPick ? `<span style="color:#FBBF24;font-size:11px;margin-left:4px;">⭐</span>` : "";
      const cardId = `v2card-${Math.random().toString(36).slice(2, 9)}`;
      const odds = _oddsNice(pick.oddsAmerican || pick.odds);
      const book = escapeHtml(pick.sportsbook || pick.book || "?");

      // Phase Archetype-Surfacing-1A — class-level historical hit rate per
      // Law 24 (dimension-explainable) + Law 27 (class-not-identity).
      // Chip only renders when archetypeHistory present (single canonical
      // absence point — backend decides, FE never synthesizes).
      //
      // 2026-06-01 Phase Truth-Fix-1E (audit RED #4) — bettor-readable
      // phrasing. Was: "📊 class hits 50.0% · n=14" (operator: "what the
      // fuck is n=124"). Now: "📊 won 50% of 14 similar picks like this".
      // Tooltip still explains the bucket for the curious.
      // 2026-06-10 Card v2 — PER-PLAYER first (Wemby ≠ Vassell), labeled-type or
      // "not enough games" fallback. Replaces the old shared archetype chip.
      const archetypeChip = _renderPerPlayerLine(pick);

      // T1 #1 — inline "why" line, TOP PICKS only (opts.showWhy). Same source as the tap-modal
      // (_reasoningOneLine reads pick.reasoning). Renders NOTHING when empty (Trap-1).
      const whyLine = opts.showWhy ? _reasoningOneLine(pick.reasoning) : "";
      const whyHtml = whyLine
        ? `<div style="font-size:9px;color:#9CA3AF;margin-top:4px;line-height:1.35;">${escapeHtml(whyLine)}</div>`
        : "";

      // Stash the full pick JSON for modal hydration (avoids long inline strings)
      const _stashId = `v2-pick-${cardId}`;
      if (!window._v2PickStash) window._v2PickStash = {};
      window._v2PickStash[_stashId] = pick;
      const onTap = `window._v2OpenModal(window._v2PickStash['${_stashId}'], this)`;

      if (opts.compact) {
        // 2026-06-10 Card v2 redesign — decluttered face: identity + prop + the
        // per-player number + displayTier badge + LABELED conf/edge. Detail stats
        // (the why one-liner, signalsTable) live in the popup ONLY.
        const sportColor = pick.sport === "nba" ? "#F97316" : "#34D399";
        const edgeColor = Number(pick.edge) >= 0 ? "#34D399" : "#F87171";
        const capChip = pick.tierCapNote ? ` <span style="font-style:italic;color:#9CA3AF;font-weight:400;">· ${escapeHtml(pick.tierCapNote)}</span>` : "";
        return `
          <div class="v2-card" id="${cardId}" style="background:#141828;border-radius:10px;padding:11px 12px;border-left:4px solid ${tierC};display:flex;flex-direction:column;cursor:pointer;" onclick="${onTap}">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:10px;font-weight:600;color:${sportColor};letter-spacing:.5px;">${(pick.sport || "").toUpperCase()}</span>
              <span style="font-size:9px;font-weight:700;color:#9CA3AF;background:#1F2937;padding:2px 7px;border-radius:9px;">${escapeHtml(tierLabel(tier))}${capChip}${starBadge}</span>
            </div>
            <div style="font-size:15px;font-weight:800;color:#F9FAFB;margin-top:6px;line-height:1.15;">${escapeHtml(pick.player || "?")}${pick.team ? ` <span style="font-size:11px;font-weight:500;color:#6B7280;">· ${escapeHtml(pick.team)}</span>` : ""}</div>
            <div style="font-size:15px;font-weight:700;color:#F9FAFB;margin-top:3px;line-height:1.2;">${_sideNice(pick.side)} ${pick.line} <span style="font-size:11px;font-weight:500;color:#9CA3AF;">${_famNice(pick.statFamily)}</span></div>
            ${archetypeChip}
            <div style="display:flex;gap:16px;margin-top:9px;align-items:flex-end;">
              <div><div style="font-size:8px;color:#6B7280;letter-spacing:.3px;">MODEL CONF</div><div style="font-size:15px;color:${tierC};font-weight:800;font-family:ui-monospace,monospace;line-height:1.1;">${conf}</div></div>
              <div><div style="font-size:8px;color:#6B7280;letter-spacing:.3px;">EDGE vs MKT</div><div style="font-size:13px;color:${edgeColor};font-weight:700;font-family:ui-monospace,monospace;line-height:1.1;">${edge}</div></div>
              <div style="margin-left:auto;text-align:right;"><div style="font-size:8px;color:#6B7280;">PRICE</div><div style="font-size:11px;color:#D1D5DB;margin-top:2px;">${odds} ${book}</div></div>
            </div>
          </div>
        `;
      }

      // Standard (single-column) card — also taps into modal now
      return `
        <div class="v2-card" id="${cardId}" style="background:#141828;border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid ${tierC};cursor:pointer;" onclick="${onTap}">
          <div style="display:flex;align-items:center;">
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;">
                ${sportBadge}
                <span style="font-size:15px;font-weight:700;color:#F9FAFB;">${escapeHtml(pick.player || "?")}</span>${starBadge}
              </div>
              <div style="font-size:13px;color:#D1D5DB;margin-top:3px;">${_famNice(pick.statFamily)} <b style="color:#F9FAFB;">${_sideNice(pick.side)} ${pick.line}</b></div>
              ${archetypeChip}
              <div style="font-size:11px;color:#D1D5DB;margin-top:3px;">${odds} @ ${book}</div>
            </div>
            <div style="text-align:right;font-family:ui-monospace,monospace;">

    // ── TOP PICKS renderer ──────────────────────────────────────────────
    async function renderTopPicks(main) {
      main.innerHTML = `<div class="loading" style="padding:20px;color:#9CA3AF;">Loading top picks…</div>`;
      try {
        const r = await fetch(`${API}/api/ws/top-picks?limit=50`);

        // 2026-06-01 Phase Truth-Fix-1C (audit RED #5) — defense-in-depth
        // preferred-books filter. Backend /api/ws/top-picks now filters out
        // off-allowlist books at source, this FE filter is the second-line
        // gate so no future code path can ever leak Hard Rock/BetRivers/
        // bet365 onto the visible TOP PICKS cards. isPreferredBook is
        // defined at line ~1137 (FD/DK/Fanatics/BetMGM).
        const rawPicks = d.picks || [];
        const picks = rawPicks.filter(p => isPreferredBook(p.sportsbook || p.book));

        const byTier = { ELITE: [], STRONG: [], PLAYABLE: [] };

        const dampenedBadge = (d.counts?.dampenedRejected > 0) ? `<div style="font-size:11px;color:#60A5FA;background:#0A1422;padding:6px 10px;border-radius:6px;border-left:3px solid #60A5FA;margin-bottom:8px;">⚖ Calibration dampener removed <b>${d.counts.dampenedRejected}</b> pick${d.counts.dampenedRejected===1?'':'s'} (modelProb dropped below implied odds → negative edge after dampening). See GAMES for unfiltered view.</div>` : "";
        let html = `<div style="padding:8px 10px;">
          ${fellBackBadge}
          ${dampenedBadge}
          <div style="font-size:11px;color:#6B7280;margin-bottom:8px;">

    // ── MY BETS renderer ────────────────────────────────────────────────
    async function renderMyBets(main) {
      main.innerHTML = `<div class="loading" style="padding:20px;color:#9CA3AF;">Loading placed bets…</div>`;
      try {
        // 2026-07-07 FEEDBACK follow-up — cache-busted + no-store: a plain GET
        // here is HTTP-cacheable, and a browser replaying a stale pre-bet
        // response renders "0 bets" while the ledger is fine (the 07-07 desktop

        const r = await fetch(`${API}/api/ws/ledger/yesterday?_t=${Date.now()}`, { cache: "no-store" });

        document.getElementById("myBetsCount").textContent = bets.length;
        if (!bets.length) {
          main.innerHTML = `<div style="padding:24px;color:#9CA3AF;text-align:center;">
            <div style="font-size:28px;margin-bottom:10px;">📝</div>
            No placed bets yet.<br>
            <span style="font-size:12px;color:#6B7280;">Log a bet via <code style="background:#141828;padding:2px 6px;border-radius:4px;">backend/scripts/addPlacedBet.js</code> CLI.</span>
          </div>`;
          return;
        }
        let html = `<div style="padding:8px 12px;">`;
        // Summary card
        html += `
          <div style="background:#141828;border-radius:10px;padding:14px;margin-bottom:14px;border-left:3px solid #34D399;">
            <div style="font-size:11px;color:#6B7280;letter-spacing:1px;margin-bottom:6px;">TOTAL EXPOSURE</div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;">
              <div>
                <span style="font-size:22px;font-weight:700;color:#F9FAFB;">$${pb.staked}</span>
                <span style="font-size:11px;color:#6B7280;margin-left:6px;">staked</span>
              </div>
              <div style="text-align:right;">
                <div style="font-size:11px;color:#6B7280;">POTENTIAL</div>
                <div style="font-size:18px;color:#34D399;font-family:ui-monospace,monospace;">+$${pb.toWin}</div>
              </div>
            </div>
            <div style="font-size:11px;color:#9CA3AF;margin-top:10px;">
              ${pb.count} bet${pb.count === 1 ? "" : "s"} · ${pb.pending} pending · ${pb.wins}W ${pb.losses}L${pb.pushes ? ' ' + pb.pushes + 'P' : ''}
              ${(() => {
                // P2a fix 2 — small-sample guard. A −100% ROI on n=2 reads as "system broken."
                // Below SMALL_SAMPLE_MIN graded bets, suppress hit%/ROI for an honest "not yet meaningful"
                // note. Threshold operator-tunable (start 10). Trap-1: num() guards.
                const SMALL_SAMPLE_MIN = 10;
                const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : null; };
                const settled = num(pb.settled) != null ? num(pb.settled) : ((num(pb.wins) || 0) + (num(pb.losses) || 0));
                if (settled < SMALL_SAMPLE_MIN) return ` · <span style="color:#6B7280;">small sample (n=${settled}) — hit%/ROI not yet meaningful</span>`;
                return `${pb.hitRate != null ? ` · hit ${(pb.hitRate*100).toFixed(0)}%` : ''}${pb.roi != null ? ` · roi ${(pb.roi*100).toFixed(1)}%` : ''}`;
              })()}
            </div>
          </div>
        `;
        for (const b of bets) {
          // 2026-07-07 FEEDBACK-B — HONEST statuses only: the voided e2e row was
          // rendering PENDING because void/push fell through the old ternary.
          const _ST = { win: ["WON", "#34D399"], loss: ["LOST", "#F87171"], push: ["PUSH", "#9CA3AF"], void: ["VOID", "#9CA3AF"], pending: ["PENDING", "#FBBF24"] };
          const st = _ST[String(b.result || "pending").toLowerCase()] || _ST.pending;
          const resultTxt = st[0], resultC = st[1];
          const legsHtml = (b.legs || []).map((l) => `
            <div style="font-size:12px;color:#D1D5DB;padding:4px 0;border-top:1px solid #1F2937;">
              <span style="color:#9CA3AF;">${escapeHtml(l.player || "")}</span> · ${_famNice(l.statFamily)} ${_sideNice(l.side)} ${l.line}
              ${l.result ? `<span style="float:right;font-size:10px;color:${(_ST[String(l.result).toLowerCase()] || _ST.pending)[1]};">${(_ST[String(l.result).toLowerCase()] || _ST.pending)[0]}</span>` : ""}
            </div>
          `).join("");
          // 2026-07-07 FEEDBACK-B — card identity: player/prop/line for singles
          // (parlays show legs below) + slate date; book display canonicalized.
          const identLine = b.betType === "parlay"
            ? `<div style="margin-top:6px;font-size:14px;font-weight:700;color:#F9FAFB;">Parlay · ${(b.legs || []).length} legs</div>`
            : `<div style="margin-top:6px;font-size:14px;font-weight:700;color:#F9FAFB;">${escapeHtml(b.player || "?")} <span style="font-weight:500;color:#D1D5DB;">${_sideNice(b.side)} ${b.line ?? ""} ${_famNice(b.statFamily)}</span></div>`;
          html += `
            <div style="background:#141828;border-radius:10px;padding:12px;margin-bottom:10px;border-left:3px solid ${resultC};">
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <div>
                  <span style="font-size:11px;background:#1F2937;color:#9CA3AF;padding:2px 6px;border-radius:4px;text-transform:uppercase;">${b.betType || "single"} · ${escapeHtml(b.sportsbook || "?")}</span>
                  <span style="font-size:10px;color:#6B7280;margin-left:6px;">${escapeHtml(b.date || "")}</span>
                </div>
                <span style="font-size:11px;font-weight:700;color:${resultC};">${resultTxt}</span>
              </div>
              ${identLine}
              <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;">
                <span style="font-size:13px;color:#F9FAFB;">$${b.stake} @ ${_oddsNice(b.odds)}</span>
                <span style="font-size:13px;color:#34D399;font-family:ui-monospace,monospace;">→ $${b.toWin}</span>
              </div>
              ${b.calibVersion ? `<div style="margin-top:4px;font-size:9px;color:#7DD3FC;">stamped ${escapeHtml(b.calibVersion)}${b.modelProb != null ? ` · model ${(b.modelProb * 100).toFixed(1)}%` : ""}</div>` : ""}
              ${legsHtml ? `<div style="margin-top:8px;">${legsHtml}</div>` : ""}
              ${b.notes ? `<div style="margin-top:6px;font-size:10px;color:#6B7280;font-style:italic;">${escapeHtml(b.notes)}</div>` : ""}
            </div>
          `;
        }
        html += `</div>`;
        main.innerHTML = html;
      } catch (e) {
        main.innerHTML = `<div style="padding:20px;color:#F87171;">Error loading My Bets: ${escapeHtml(String(e?.message || e))}</div>`;
      }
    }

    // ── SLIPS renderer (P1, FE-Trust-Surface-1A) ───────────────────────
    // Surfaces the engine's AI-built parlays (aiSlips) — narrative reasoning,
    // per-leg legReasonings, the Phase 1b live-state protection (liveStateSummary
    // / leg.liveState), line-shopping, and calibrated combined prob/EV. Reads
    // straight from state.data.{mlb,nba}.aiSlips (already fetched on boot — no
    // new endpoint). Display-only: the CTA OPENS the book (never pre-fills /
    // never places the bet) + copies the legs for fast manual entry.
    //
    // Honest book links (open app-if-installed / website — NOT pre-filled betslip;
    // true prefill needs a paid partner per the P1 design feasibility finding).
    const SLIP_BOOK_URLS = {
      fanduel:            "https://sportsbook.fanduel.com/",
      draftkings:         "https://sportsbook.draftkings.com/",
      fanatics:           "https://sportsbook.fanatics.com/",
      fanaticssportsbook: "https://sportsbook.fanatics.com/",
      betmgm:             "https://sports.betmgm.com/",
      caesars:            "https://sportsbook.caesars.com/",
      hardrockbet:        "https://app.hardrock.bet/",
      hardrock:           "https://app.hardrock.bet/",
      betrivers:          "https://www.betrivers.com/",
      bet365:             "https://www.bet365.com/",
    };
    function _slipBookKey(name) { return String(name || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

    let _slipsCache = [];
    // Clipboard copy of a slip's legs (honest manual-entry helper — never auto-places).
    window.copySlipLegs = function (idx) {
      const s = _slipsCache[idx]; if (!s) return;
      const lines = (s.legs || []).map((l) =>
        `${l.player || ""} — ${_famNice(l.statFamily || l.propType)} ${_sideNice(l.side)} ${l.line == null ? "" : l.line} (${_oddsNice(l.odds)})`.trim());
      const header = `${String(s._tier || s.tier || "").toUpperCase()} PARLAY · ${_oddsNice(s.combinedAmericanOdds)} · ${s.book || ""}`.trim();
      const text = [header, ...lines].join("\n");
      const done = () => { const b = document.getElementById("copybtn-" + idx); if (b) { const o = b.textContent; b.textContent = "Copied ✓"; setTimeout(() => { b.textContent = o; }, 1500); } };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => alert("Copy failed — select the legs manually.\n\n" + text));
      } else { alert(text); }
    };

    function renderSlips(main) {
      const tiersOrder = ["safe", "balanced", "aggressive", "lotto"];
      const tierLabel = { safe: "SAFE", balanced: "BALANCED", aggressive: "AGGRESSIVE", lotto: "LOTTO" };
      const tierColor = { safe: "#34D399", balanced: "#60A5FA", aggressive: "#FBBF24", lotto: "#A78BFA" };
      const all = [];
      for (const sp of ["mlb", "nba"]) {
        const d = state.data[sp];
        if (!d || d._error || !d.aiSlips) continue;
        for (const t of tiersOrder) for (const s of (d.aiSlips[t] || [])) all.push(Object.assign({}, s, { _sport: sp, _tier: t }));
      }
      _slipsCache = all;
      const cnt = document.getElementById("slipsCount"); if (cnt) cnt.textContent = all.length;

      // P1.1 — slate-level "removed from tonight's slips" set. The live-state gate
      // excludes dead (scratched/OUT) players pool-wide BEFORE slips assemble, so
      // this is slate-level, not per-card. Dedup by player across both sports.
      const deadRemoved = [];
      const _deadSeen = new Set();
      for (const sp of ["mlb", "nba"]) {
        const d = state.data[sp];
        for (const dr of ((d && d.aiSlipsDeadRemoved) || [])) {
          const k = String(dr && dr.player || "").toLowerCase();
          if (k && !_deadSeen.has(k)) { _deadSeen.add(k); deadRemoved.push(dr); }
        }
      }
      const deadBanner = deadRemoved.length
        ? `<div style="font-size:11px;color:#9CA3AF;background:#1A160C;border-left:3px solid #B45309;padding:8px 10px;border-radius:6px;margin-bottom:8px;">
             <span style="color:#FBBF24;">🛡 Removed from tonight's slips</span> — the live-state gate kept ${deadRemoved.length} player${deadRemoved.length === 1 ? "" : "s"} out:<br>
             ${deadRemoved.map((d) => escapeHtml(d.reason || ((d.player || "A player") + " scratched / OUT"))).join("<br>")}
           </div>`
        : "";

      if (!all.length) {
        main.innerHTML = `<div style="padding:8px 12px;">${deadBanner}<div style="padding:24px;color:#9CA3AF;text-align:center;">
          <div style="font-size:28px;margin-bottom:10px;">🎟️</div>
          No engine slips for tonight's slate yet.<br>
          <span style="font-size:12px;color:#6B7280;">Slips build from tonight's edges once the slate populates.</span>
        </div></div>`;
        return;
      }
      let html = `<div style="padding:8px 12px;">
        ${deadBanner}
        <div style="font-size:11px;color:#6B7280;margin-bottom:8px;">${all.length} engine-built slip${all.length === 1 ? "" : "s"} · live-state protected · display-only</div>`;
      for (const t of tiersOrder) {
        const slips = all.filter((s) => s._tier === t);
        if (!slips.length) continue;
        html += `<div style="margin-top:14px;font-size:11px;color:${tierColor[t]};letter-spacing:1px;font-weight:600;margin-bottom:6px;">${tierLabel[t]} · ${slips.length}</div>`;
        for (const s of slips) html += renderSlipCard(s, all.indexOf(s));
      }
      html += `</div>`;
      main.innerHTML = html;
    }

    function renderSlipCard(slip, idx) {
      const _num = (v) => { const x = Number(v); return Number.isFinite(x) ? x : null; };   // Trap-1 guard
      const ls = slip.liveStateSummary || { worst: "ok", softCount: 0, deadCount: 0, reasons: [] };
      const soft = _num(ls.softCount) || 0;
      // Phase 1b protection badge. (Dead legs are excluded UPSTREAM before the slip
      // is assembled, so a slip never contains a dead leg — the protection here is
      // ok/soft. Surfacing "N legs removed (scratched)" needs a small backend add;
      // flagged as P1.1, not faked here.)
      const badgeColor = soft > 0 ? "#FBBF24" : "#34D399";
      const badgeText  = soft > 0 ? `⚠ ${soft} leg${soft === 1 ? "" : "s"} flagged` : "✓ lineups clear";

      const narrLines = String(slip.narrative || "").split(",").map((x) => x.trim()).filter(Boolean);
      const narrHtml = narrLines.map((l) => `<div style="font-size:12px;color:#D1D5DB;line-height:1.5;">• ${escapeHtml(l)}</div>`).join("");

      const combOdds = _oddsNice(slip.combinedAmericanOdds);
      const calProb = _num(slip.calibratedCombinedModelProb);
      const calProbTxt = calProb != null ? `${(calProb * 100).toFixed(0)}% model` : "";
      const evN = _num(slip.ev);
      // P2a fix 5 — variance honesty: a four-figure EV% next to a 2% prob reads as "free money."
      // On lotto-tier slips above a big-EV threshold, tag it as a moonshot (operator-tunable).
      const moonshot = (slip._tier === "lotto" && evN != null && evN > 2.0);
      const evTxt = evN != null
        ? `EV ${evN >= 0 ? "+" : ""}${(evN * 100).toFixed(0)}%${moonshot ? " · ⚡ moonshot, small stake" : ""}`
        : (moonshot ? "⚡ moonshot, small stake" : "");

      const bookName = slip.book || (slip.legs && slip.legs[0] && slip.legs[0].book) || "";
      const bookUrl = SLIP_BOOK_URLS[_slipBookKey(bookName)] || null;

      const reasonByPlayer = {};
      for (const lr of (slip.legReasonings || [])) { if (lr && lr.player) reasonByPlayer[String(lr.player).toLowerCase()] = lr.reason; }

      const legsHtml = (slip.legs || []).map((l) => {
        const st = (l.liveState && l.liveState.status) || "ok";
        const icon = st === "soft"
          ? `<span style="color:#FBBF24;" title="${escapeHtml((l.liveState && l.liveState.reason) || "")}">⚠</span>`
          : `<span style="color:#34D399;">✓</span>`;
        const reasonLine = (st === "soft" && l.liveState && l.liveState.reason)
          ? `<div style="font-size:10px;color:#FBBF24;padding:0 0 4px 0;">${escapeHtml(l.liveState.reason)}</div>` : "";
        return `<div style="font-size:12px;color:#D1D5DB;padding:5px 0;border-top:1px solid #1F2937;display:flex;justify-content:space-between;gap:8px;">
            <span><span style="color:#9CA3AF;">${escapeHtml(l.player || "")}</span> · ${_famNice(l.statFamily || l.propType)} ${_sideNice(l.side)} ${l.line == null ? "" : l.line}</span>
            <span style="white-space:nowrap;">${_oddsNice(l.odds)} ${icon}</span>
          </div>${reasonLine}`;
      }).join("");

      const expId = `slip-exp-${idx}`;
      const lrHtml = (slip.legs || []).map((l) => {
        const r = reasonByPlayer[String(l.player || "").toLowerCase()];
        return r ? `<div style="font-size:11px;color:#9CA3AF;padding:2px 0;"><span style="color:#D1D5DB;">${escapeHtml(l.player || "")}:</span> ${escapeHtml(r)}</div>` : "";
      }).join("");
      const f = slip.factors || {};
      const factorHtml = ["projection", "clv", "timing", "book", "archetype", "ladder", "diversification"]
        .filter((k) => _num(f[k]) != null)
        .map((k) => `<span style="font-size:10px;color:#6B7280;margin-right:8px;">${k} ${(f[k] * 100).toFixed(0)}</span>`).join("");
      const altBooks = (slip.alternativeBooks || []).filter((b) => isPreferredBook(b));
      const altHtml = altBooks.length ? `<div style="font-size:11px;color:#6B7280;margin-top:6px;">also at: ${altBooks.map(escapeHtml).join(", ")}</div>` : "";
      const corr = _num(slip.correlationScore);

      return `
        <div style="background:#141828;border-radius:10px;padding:12px;margin-bottom:10px;border-left:3px solid ${badgeColor};">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
            <span style="font-size:11px;background:#1F2937;color:#9CA3AF;padding:2px 6px;border-radius:4px;text-transform:uppercase;">${escapeHtml((slip._sport || "").toUpperCase())} · ${(slip.legs || []).length} legs · ${escapeHtml(bookName || "?")}</span>
            <span style="font-size:11px;font-weight:700;color:${badgeColor};">${badgeText}</span>
          </div>
          <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;">
            <span style="font-size:16px;font-weight:700;color:#F9FAFB;font-family:ui-monospace,monospace;">${combOdds}</span>
            <span style="font-size:11px;color:#9CA3AF;">${calProbTxt}${evTxt ? ` · ${evTxt}` : ""}</span>
          </div>
          <div data-slot="archetype-tags"></div>
          ${narrHtml ? `<div style="margin-top:8px;">${narrHtml}</div>` : ""}
          <div style="margin-top:8px;">${legsHtml}</div>
          <div data-slot="ladder-rungs"></div>
          <div style="margin-top:10px;display:flex;gap:8px;">
            ${bookUrl
              ? `<a href="${bookUrl}" target="_blank" rel="noopener" style="flex:1;text-align:center;font-size:12px;color:#0A0E1A;background:#FBBF24;padding:8px;border-radius:6px;text-decoration:none;font-weight:600;">Open ${escapeHtml(bookName)} ↗</a>`
              : `<span style="flex:1;text-align:center;font-size:12px;color:#6B7280;padding:8px;">${escapeHtml(bookName || "")}</span>`}
            <button id="copybtn-${idx}" onclick="copySlipLegs(${idx})" style="flex:1;font-size:12px;color:#D1D5DB;background:#1F2937;padding:8px;border-radius:6px;border:none;cursor:pointer;">Copy legs</button>
          </div>
          <div style="margin-top:10px;border-top:1px solid #1F2937;padding-top:8px;">

            <div style="display:none;margin-top:8px;">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="font-size:11px;color:#9CA3AF;">Stake $</span><input type="number" min="1" value="10" data-sc-stake="${idx}" oninput="slipCashout(${idx})" style="width:70px;background:#0A0E1A;border:1px solid #2A2F45;border-radius:6px;color:#E5E7EB;padding:5px 7px;font-size:12px;text-align:right;"></div>
              <div style="font-size:10px;color:#6B7280;margin-bottom:4px;">tap a leg the moment it HITS:</div>

              <div style="display:flex;align-items:center;gap:8px;margin-top:6px;"><span style="font-size:11px;color:#9CA3AF;">Hedge final-leg odds <span style="color:#6B7280;">(optional)</span></span><input data-sc-hedge="${idx}" placeholder="-120" oninput="slipCashout(${idx})" style="width:80px;background:#0A0E1A;border:1px solid #2A2F45;border-radius:6px;color:#E5E7EB;padding:5px 7px;font-size:12px;text-align:right;"></div>

          </div>

            ${lrHtml ? `<div style="font-size:11px;color:#6B7280;margin-bottom:4px;">PER-LEG REASONING</div>${lrHtml}` : ""}
            ${factorHtml ? `<div style="margin-top:8px;font-size:11px;color:#6B7280;margin-bottom:4px;">FACTORS</div><div>${factorHtml}</div>` : ""}
            ${corr != null ? `<div style="font-size:11px;color:#6B7280;margin-top:8px;">correlation ${(corr * 100).toFixed(0)}</div>` : ""}
            ${altHtml}
            <div style="font-size:10px;color:#4B5563;margin-top:8px;font-style:italic;">Display-only — opens the book, does not place the bet.</div>
          </div>

    }

    // Phase Cashout-Surface-1B (2026-06-16) — AUTO-FED cash-out/hedge on engine
    // slips. Reads the slip's own legs + odds + per-leg modelProb; operator only
    // taps which legs HIT (+ optional hedge odds). Reuses POST /api/ws/cashout.
    // Pre-game (0 legs hit) shows honest odds+payout, never a fake mid-game value.
    window.slipCashout = async function (idx) {
      const slip = (_slipsCache || [])[idx]; if (!slip) return;
      const out = document.getElementById(`sc-result-${idx}`); if (!out) return;
      const a2d = (o) => { const n = Number(o); if (!Number.isFinite(n) || n === 0) return null; return n > 0 ? 1 + n / 100 : 1 + 100 / Math.abs(n); };
      const $ = (x) => x == null ? "—" : "$" + (Math.round(x * 100) / 100).toFixed(2);
      const stakeEl = document.querySelector(`[data-sc-stake="${idx}"]`);
      const stake = Number(stakeEl && stakeEl.value) || 10;
      const legs = (slip.legs || []).map((l, li) => {
        const won = !!(document.querySelector(`[data-sc-leg="${idx}"][data-sc-li="${li}"]`) || {}).checked;
        const base = { oddsAmerican: l.odds, matchup: l.matchup || null, side: l.side || null, statFamily: l.statFamily || null, team: l.team || null, player: l.player || null, status: won ? "won" : "pending" };
        if (!won && l.modelProb != null) base.prob = l.modelProb;   // pass model prob (route labels source)
        return base;
      });
      const hitCount = legs.filter((l) => l.status === "won").length;
      // Pre-game honesty: no leg hit yet → show odds + potential payout only; no fake cash-out.
      if (hitCount === 0) {
        let dec = 1, okAll = true;
        for (const l of legs) { const d = a2d(l.oddsAmerican); if (d == null) { okAll = false; break; } dec *= d; }
        const payout = okAll ? stake * dec : null;
        out.innerHTML = `<div style="font-size:12px;color:#D1D5DB;">Combined odds <b>${_oddsNice(slip.combinedAmericanOdds)}</b> · potential payout <b style="color:#34D399;">${$(payout)}</b> on ${$(stake)}</div>
          <div style="font-size:10px;color:#6B7280;margin-top:4px;">Cash-out available once legs start hitting — tap each leg as it lands. Grading is nightly for now; a live in-game settlement poller is a future build.</div>`;
        return;
      }
      const hedgeEl = document.querySelector(`[data-sc-hedge="${idx}"]`);
      const hedgeRaw = (hedgeEl && hedgeEl.value || "").trim();
      const body = { stake, legs };
      if (hedgeRaw) body.hedgeOdds = Number(hedgeRaw);
      out.innerHTML = `<div style="font-size:11px;color:#6B7280;">Calculating…</div>`;
      try {
        const r = await fetch(`${API}/api/ws/cashout`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const j = await r.json();
        if (!j.ok) { out.innerHTML = `<div style="font-size:11px;color:#F87171;">${escapeHtml(j.error || "error")}</div>`; return; }
        out.innerHTML = renderSlipCashoutResult(j);
      } catch (e) { out.innerHTML = `<div style="font-size:11px;color:#F87171;">${escapeHtml(String((e && e.message) || e))}</div>`; }
    };

    function renderSlipCashoutResult(j) {
      const $ = (x) => x == null ? "—" : "$" + (Math.round(x * 100) / 100).toFixed(2);
      const pct = (x) => x == null ? "—" : (x * 100).toFixed(0) + "%";
      const c = j.cashout || {};
      let h = "";
      if (c.fairCashout != null) {
        h += `<div style="font-size:18px;font-weight:800;color:#34D399;">${$(c.fairCashout)} <span style="font-size:11px;font-weight:500;color:#9CA3AF;">fair cash-out</span></div>`;
        h += `<div style="font-size:10px;color:#6B7280;">potential ${$(c.potentialReturn)} × ${pct(j.jointPending)} remaining (${escapeHtml(j.jointMethod || "")})</div>`;
        if (c.offerBand) h += `<div style="font-size:11px;color:#D1D5DB;margin-top:3px;">book likely offers <b>${$(c.offerBand.low)}–${$(c.offerBand.high)}</b></div>`;
      } else {
        h += `<div style="font-size:11px;color:#9CA3AF;">${escapeHtml(c.note || "tap hit legs to compute")}</div>`;
        if (c.potentialReturn != null) h += `<div style="font-size:11px;color:#D1D5DB;">potential payout ${$(c.potentialReturn)}</div>`;
      }
      const pend = (j.perLeg || []).filter((l) => l.status === "pending");
      if (pend.length) h += `<div style="font-size:10px;color:#6B7280;margin-top:4px;">pending: ${pend.map((l) => `${escapeHtml(l.player || "?")} ${pct(l.prob)} (${escapeHtml(l.source === "manual" ? "model" : (l.source || "?"))})`).join(" · ")}</div>`;
      if (j.hedge && !j.hedge.error) {
        h += `<div style="font-size:11px;color:#D1D5DB;margin-top:6px;">hedge ${$(j.hedge.hedgeStake)} on the opposite side → <b style="color:#34D399;">locks ${$(j.hedge.lockedProfit)}</b> either way${j.hedge.lockedProfit < 0 ? " (caps a loss)" : ""}</div>`;
      } else if (j.hedge && j.hedge.error) {
        h += `<div style="font-size:10px;color:#F87171;">${escapeHtml(j.hedge.error)}</div>`;
      }
      (j.notes || []).forEach((n) => h += `<div style="font-size:10px;color:#FBBF24;margin-top:3px;">⚠ ${escapeHtml(n)}</div>`);
      h += `<div style="font-size:10px;color:#4B5563;margin-top:5px;">display-only · grading nightly · live poller = future build</div>`;
      return h;
    }

    // ── GAMES drill-down renderer ──────────────────────────────────────
    let _gamesBrowserCache = null;
    async function renderGamesBrowser(main) {
      main.innerHTML = `<div class="loading" style="padding:20px;color:#9CA3AF;">Loading games…</div>`;
      try {
        const r = await fetch(`${API}/api/ws/games-browser`);
        const d = await r.json();

        document.getElementById("gamesCount").textContent = d.gameCount || 0;

          for (const g of sg) {

                    <span style="font-size:13px;color:#D1D5DB;font-weight:600;">${escapeHtml(player.player)}</span>
                    <span style="float:right;font-size:11px;color:#9CA3AF;">${player.props.length} prop${player.props.length === 1 ? "" : "s"}${playerStarCount ? ` <span style="color:#FBBF24;">⭐${playerStarCount}</span>` : ''} <span class="pchev" style="color:#6B7280;margin-left:6px;">▸</span></span>
                  </div>
                  <div id="${pId}" class="v2-card-exp" style="display:none;">`;
              for (let propI = 0; propI < player.props.length; propI++) {
                const prop = player.props[propI];
                // Each prop wrapped with a divider so it doesn't blend into siblings
                html += `<div class="${propI > 0 ? "v2-prop-divider" : ""}" style="padding:6px 0;">`;

        html += `</div>`;

    // ─────────────────────────────────────────────────────────────
    // v0.2.0: Parlay tab renderer. Shows combined odds, single-book buildability,
    // legs list with per-leg remove. localStorage-backed so it persists.
    function renderParlay(main) {
      if (state.parlay.length === 0) {
        main.innerHTML = `<div class="parlay-empty">
          <div class="big">🎯</div>
          <div>Your parlay is empty.</div>
          <div style="margin-top: 8px; color: #4B5563;">Tap <strong style="color:#A78BFA">+</strong> on any play in MLB or NBA to build your slip.</div>
        </div>`;
        return;
      }
      const { combinedAmerican, combinedDecimal, combinedProb } = computeCombinedOdds(state.parlay);
      const build = computeBuildability(state.parlay);
      const oddsTxt = combinedAmerican == null ? "—"
                    : combinedAmerican > 0 ? `+${combinedAmerican}` : `${combinedAmerican}`;
      const probTxt = combinedProb == null ? "—" : `${(combinedProb * 100).toFixed(1)}%`;
      const decTxt = combinedDecimal == null ? "—" : combinedDecimal.toFixed(2);

      // Buildability message + styling
      let buildHtml = "";
      if (build.status === "single") {
        buildHtml = `<div class="ps-buildable ok">✓ Buildable on ${escapeHtml(build.book)} (single-book)</div>`;
      } else if (build.status === "mixed") {
        buildHtml = `<div class="ps-buildable warn">⚠ Mixed books (${build.books.length}) — can't construct at one sportsbook</div>`;
      } else if (build.status === "missing") {
        buildHtml = `<div class="ps-buildable bad">⚠ Some legs missing book info — can't verify buildability</div>`;
      }

      const summaryHtml = `
        <div class="parlay-summary">
          <div class="ps-top">
            <div class="ps-title">Tonight's Parlay · ${state.parlay.length} legs</div>
            <button class="ps-clear" onclick="clearParlayConfirm()">Clear All</button>
          </div>
          <div class="ps-odds">${oddsTxt}</div>
          <div class="ps-row"><span class="lbl">Combined decimal</span><span class="val">${decTxt}</span></div>
          <div class="ps-row"><span class="lbl">Implied hit rate</span><span class="val">${probTxt}</span></div>
          ${buildHtml}
        </div>
      `;

      const legsHtml = state.parlay.map((l, i) => {
        const sideTxt = String(l.side || "").toUpperCase();
        const oddsT = l.oddsAmerican == null ? "—" : (l.oddsAmerican > 0 ? `+${l.oddsAmerican}` : `${l.oddsAmerican}`);
        const teamTxt = l.team || (l.sport === "nba" ? "team pending" : "");
        return `
          <div class="parlay-leg">
            <div class="leg-main">
              <div class="leg-player">${escapeHtml(l.player || "?")}${teamTxt ? ` <span style="color:#6B7280; font-weight:500; font-size:11px;">· ${escapeHtml(teamTxt)}</span>` : ""}</div>
              <div class="leg-prop">${sideTxt} ${escapeHtml(String(l.propType || ""))} ${l.line ?? ""} <span class="leg-book">· ${escapeHtml(l.sportsbook || l.book || "?")}</span></div>
            </div>
            <div class="leg-odds">${oddsT}</div>
            <button class="leg-remove" onclick="removeLegFromParlay(${i})" aria-label="Remove leg">×</button>
          </div>
        `;
      }).join("");

      // Phase Cashout-Surface-1A (2026-06-15) — cash-out / hedge card.
      const cashoutCardHtml = `
        <div class="cashout-card">
          <div class="co-title">💸 Cash-out / Hedge</div>
          <div class="co-sub">For an in-progress ticket: tick the legs that already HIT, set your stake, and (optionally) the current odds of the opposite side of your last pending leg. You'll get the fair cash-out value, the book's likely 70–90% offer band, and the hedge that locks the same profit either way. Read-only — enter odds from your book; never auto-bets.</div>
          <div class="co-row"><label>Stake ($)</label><input id="coStake" type="number" min="1" step="1" value="10"></div>
          <div class="co-legs">${state.parlay.map((l, i) => {
            const oddsT = l.oddsAmerican == null ? "—" : (l.oddsAmerican > 0 ? `+${l.oddsAmerican}` : `${l.oddsAmerican}`);
            return `<label class="co-leg"><input type="checkbox" data-coleg="${i}"><span>${escapeHtml(l.player || "?")} ${escapeHtml(String(l.side || "").toUpperCase())} ${escapeHtml(String(l.propType || ""))} ${l.line ?? ""} (${oddsT})</span><em>hit?</em></label>`;

          <div class="co-row"><label>Hedge side odds (last leg)</label><input id="coHedge" placeholder="-120 or 2.2"></div>
          <div class="co-row"><label>Override pending hit% (optional)</label><input id="coJoint" placeholder="e.g. 30"></div>
          <button class="co-btn" onclick="cashoutCalc()">Calculate cash-out / hedge</button>
          <div id="coResult" class="co-result"></div>
        </div>
