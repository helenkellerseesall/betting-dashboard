        const modelEntry = arr.find(p => Number(p.line) === Number(fp.bestLine));
        if (!modelEntry) return inWindow;
        // Mark the entry so the FE can highlight it as the model's pick.
        modelEntry._isModelPick = true;
        return [modelEntry, ...inWindow];
      }
      const oversDisplay  = ensureModelLineVisible(overs, "over", 4);
      const undersDisplay = ensureModelLineVisible(unders, "under", 3);

      const renderProp = (pp, isOver) => {
        const oddsTxt = pp.odds == null ? "—" : (pp.odds > 0 ? `+${pp.odds}` : `${pp.odds}`);
        const oddsColor = pp.odds > 0 ? "#34D399" : "#D1D5DB";
        const candForAdd = {
          player: player.player, team: player.team, sport,
          propType: fam, statFamily: fam.toLowerCase().replace(/\s+/g, "_"),
          side: pp.side, line: pp.line, odds: pp.odds, oddsAmerican: pp.odds,
          sportsbook: pp.book, book: pp.book,
        };
        const sig = legSig(candForAdd);
        const inParlay = state.parlay.some(l => legSig(l) === sig);
        // Stash candidate so + button can pull by data attribute
        const stashKey = `gv:${sport}:${player.player}:${fam}:${pp.side}:${pp.line}:${pp.book}`;
        state._gameViewStash = state._gameViewStash || {};
        state._gameViewStash[stashKey] = candForAdd;

        // Multi-book chip — show the count of OTHER books offering the same
        // side+line. Tap-target tooltip lists them. This is the "collapse
        // noise" fix from operator 2026-05-23: same line from 3 books used
        // to be 3 rows; now it's 1 row with a small "+2" chip.
        const otherBooks = Array.isArray(pp.books) ? pp.books.filter(b => b.book !== pp.book) : [];
        const bookChip = otherBooks.length > 0
          ? `<span title="${escapeHtml(otherBooks.map(b => `${b.book}: ${b.odds > 0 ? '+' : ''}${b.odds}`).join(' · '))}"
                   style="font-size: 9px; padding: 1px 4px; border-radius: 3px;
                          background: rgba(96, 165, 250, 0.15); color: #93C5FD;
                          letter-spacing: 0.3px;">+${otherBooks.length}</span>`
          : "";

        // Per-row model signal — surfaces what the cognition thinks about
        // THIS line (modelProb + edge). Backend joins from tracked_bets.
        // Calibration discount (2026-05-23): when the lane is known
        // miscalibrated (e.g. OVERCONFIDENT 8pp), subtract the calibration
        // delta from the displayed edge so the model can't brag past its
        // actual track record. Calibrated lanes pass through unchanged.
        let modelChip = "";
        if (Number.isFinite(pp.modelProb)) {
          const rawEdgePp = Number.isFinite(pp.edge) ? pp.edge * 100 : null;
          const calDelta = pp.laneCalibration && Number.isFinite(pp.laneCalibration.calibrationDelta)
                            ? pp.laneCalibration.calibrationDelta * 100
                            : 0;
          // Calibration delta is (modelAvg − hitRate). Positive = model overconfident
          // → discount the edge by that amount. Negative = underconfident → small bump.
          const adjEdgePp = rawEdgePp == null ? null : rawEdgePp - calDelta;
          const edgeColor = adjEdgePp == null ? "#9CA3AF"
                          : adjEdgePp >= 5 ? "#34D399"
                          : adjEdgePp >= 0 ? "#FBBF24"
                          : "#F87171";
          let edgeTxt = "";
          let tipParts = [`raw model edge ${rawEdgePp == null ? "—" : (rawEdgePp >= 0 ? "+" : "") + rawEdgePp.toFixed(1) + "pp"}`];
          if (rawEdgePp != null) {
            if (Math.abs(calDelta) >= 1) {
              edgeTxt = ` · ${adjEdgePp >= 0 ? "+" : ""}${adjEdgePp.toFixed(0)}pp est`;
              tipParts.push(`calibration discount ${calDelta >= 0 ? "-" : "+"}${Math.abs(calDelta).toFixed(1)}pp`);
              tipParts.push(`adjusted ${adjEdgePp >= 0 ? "+" : ""}${adjEdgePp.toFixed(1)}pp`);
            } else {
              edgeTxt = ` · ${rawEdgePp >= 0 ? "+" : ""}${rawEdgePp.toFixed(0)}pp edge`;
            }
          }
          modelChip = `<span title="${escapeHtml(tipParts.join(' · '))}"
                              style="font-size: 9px; padding: 1px 5px; border-radius: 3px;
                                     background: rgba(167, 139, 250, 0.12); color: ${edgeColor};
                                     font-family: ui-monospace, monospace; letter-spacing: 0.2px;">
                        ${(pp.modelProb * 100).toFixed(0)}%${edgeTxt}
                      </span>`;
        }

        // Contradiction flag (2026-05-23) — when the model picks UNDER N but
        // the player's L5 avg is materially ABOVE N (or vice versa), surface
        // a red warning. This catches the "Brunson L5 avg 26.6 → model says
        // UNDER 20.5" pathology where the model contradicts its own visible
        // evidence. Threshold: |L5 − line| > 15% of the line.
        let contradictionTag = "";
        const l5avg = player?.recentForm?.last5_avg;
        if (Number.isFinite(l5avg) && Number.isFinite(pp.line) && Number.isFinite(pp.modelProb)) {
          const delta = l5avg - pp.line;
          const tol = Math.max(0.5, Math.abs(pp.line) * 0.15);
          const sideStr = String(pp.side || "").toLowerCase();
          const isOverSide = sideStr === "over" || sideStr === "yes";
          const isUnderSide = sideStr === "under" || sideStr === "no";
          const contradicts =
            (isUnderSide && delta > tol) ||
            (isOverSide && delta < -tol);
          if (contradicts) {
            const dir = isUnderSide ? "above" : "below";
            contradictionTag = `<span title="Model picked ${escapeHtml(sideStr.toUpperCase())} ${pp.line} but recent L5 avg (${l5avg.toFixed(1)}) is ${dir} the line by ${Math.abs(delta).toFixed(1)} pts. Verify the model has matchup-specific reasoning before trusting."
                                       style="font-size: 9px; padding: 1px 5px; border-radius: 3px;
                                              background: rgba(248, 113, 113, 0.18); color: #F87171;
                                              font-weight: 700; letter-spacing: 0.3px;">
                                  vs L5 ${l5avg.toFixed(1)}
                                </span>`;
          }
        }

        // Model-pick visual marker — when ensureModelLineVisible promoted
        // this line into the ladder because it's the model's top pick, we
        // render a subtle purple left-border so the operator instantly knows
        // which row the family projection header is referencing.
        const isModelPickRow = pp._isModelPick === true;
        const rowBg = isModelPickRow
          ? (isOver ? "rgba(167, 139, 250, 0.08)" : "rgba(167, 139, 250, 0.08)")
          : (isOver ? "rgba(52, 211, 153, 0.04)" : "rgba(248, 113, 113, 0.04)");
        const rowBorder = isModelPickRow ? "2px solid #A78BFA" : "2px solid transparent";

        return `
          <div style="display: flex; align-items: center; gap: 8px; padding: 4px 6px;
                      font-size: 12px; border-radius: 6px; flex-wrap: wrap;
                      background: ${rowBg};
                      border-left: ${rowBorder};">
            <span style="font-weight: 700; min-width: 42px; color: ${isOver ? "#34D399" : "#F87171"};">${isOver ? "OVER" : "UNDER"}</span>
            <span style="min-width: 38px; font-family: ui-monospace, monospace; color: #F9FAFB;">${pp.line ?? "—"}</span>
            <span style="font-family: ui-monospace, monospace; color: ${oddsColor}; min-width: 50px;">${oddsTxt}</span>
            <span style="font-size: 9px; padding: 1px 5px; border-radius: 3px;
                         background: rgba(75, 85, 99, 0.3); color: #9CA3AF; letter-spacing: 0.3px;">${escapeHtml(pp.book || "—")}</span>
            ${bookChip}
            ${modelChip}
            ${contradictionTag}
            <button onclick="addLegFromGameView('${escapeHtml(stashKey).replace(/'/g, "\\'")}', '${sport}'); event.stopPropagation();"
                    style="margin-left: auto; width: 24px; height: 24px; border-radius: 50%;
                           background: ${inParlay ? "#A78BFA" : "rgba(167, 139, 250, 0.12)"};
                           border: 1px solid rgba(167, 139, 250, 0.35);
                           color: ${inParlay ? "#0A0E1A" : "#A78BFA"};
                           font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer;
                           display: flex; align-items: center; justify-content: center;">${inParlay ? "✓" : "+"}</button>
          </div>
        `;
      };

      const oversHtml  = oversDisplay.map(p => renderProp(p, true)).join("");
      const undersHtml = undersDisplay.map(p => renderProp(p, false)).join("");

      // Calibration overlay (2026-05-23) — badge tells the operator if the
      // model has earned trust on THIS prop family. Sourced from
      // scorecards/lane_calibration.json via the backend overlay.
      // Pull from any prop entry (they all share the family-level verdict)
      // or fall back to player.familyCalibration if set on the player.
      const calSource = (props && props[0] && props[0].laneCalibration) || (player.familyCalibration && player.familyCalibration[fam]) || null;
      let calBadge = "";
      if (calSource && calSource.badge) {
        const tone = calSource.badge.tone;
        const toneColors = {
          green: { bg: "rgba(52, 211, 153, 0.15)", fg: "#34D399" },
          amber: { bg: "rgba(251, 191, 36, 0.15)", fg: "#FBBF24" },
          red:   { bg: "rgba(248, 113, 113, 0.15)", fg: "#F87171" },
          grey:  { bg: "rgba(156, 163, 175, 0.15)", fg: "#9CA3AF" },
        };
        const c = toneColors[tone] || toneColors.grey;
        const sampleTxt = calSource.sample ? ` ${calSource.sample}` : "";
        const tipParts = [calSource.badge.tip];
        if (calSource.roi != null) tipParts.push(`ROI ${calSource.roi > 0 ? "+" : ""}${(calSource.roi * 100).toFixed(0)}%`);
        if (calSource.hitRate != null) tipParts.push(`hits ${(calSource.hitRate * 100).toFixed(0)}%`);
        const tip = tipParts.join(" · ");
        calBadge = `<span title="${escapeHtml(tip)}"
                          style="font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
                                 background: ${c.bg}; color: ${c.fg}; letter-spacing: 0.4px; margin-left: 6px;">
                      ${escapeHtml(calSource.badge.label)}${sampleTxt}
                    </span>`;
      }

      // Family-level projection header (2026-05-23) — surfaces the cognition's
      // top pick. Discounted by lane calibration delta so the model can't
      // brag past its actual track record. Also shows L5 avg next to the
      // pick so contradictions are visible at a glance.
      let projectionLine = "";
      if (fp && Number.isFinite(fp.bestEdge)) {
        const rawEdgePp = fp.bestEdge * 100;
        const calDelta = calSource && Number.isFinite(calSource.calibrationDelta)
                         ? calSource.calibrationDelta * 100 : 0;
        const adjEdgePp = rawEdgePp - calDelta;
        const edgeColor = adjEdgePp >= 5 ? "#34D399" : adjEdgePp >= 0 ? "#FBBF24" : "#F87171";
        const sideTxt = (fp.bestSide || "").toUpperCase();
        const sideColor = fp.bestSide === "over" || fp.bestSide === "yes" ? "#34D399" : "#F87171";
        const l5 = player?.recentForm?.last5_avg;
        const l5Tag = Number.isFinite(l5)
          ? `<span style="color: #6B7280; margin-left: 4px;">· L5 ${l5.toFixed(1)}</span>` : "";
        const calTag = Math.abs(calDelta) >= 1
          ? `<span style="color: #6B7280; font-size: 9px;">(raw +${rawEdgePp.toFixed(0)}pp − ${calDelta.toFixed(0)}pp cal)</span>`
          : "";
        projectionLine = `
          <div style="font-size: 10px; color: #9CA3AF; padding: 2px 0 4px; line-height: 1.4;">
            <span style="color: #A78BFA;">model</span> →
            <span style="font-weight: 700; color: ${sideColor};">${escapeHtml(sideTxt)}</span>
            <span style="font-family: ui-monospace, monospace; color: #F9FAFB;">${fp.bestLine ?? ""}</span>
            <span style="color: ${edgeColor}; font-family: ui-monospace, monospace;">${adjEdgePp >= 0 ? "+" : ""}${adjEdgePp.toFixed(0)}pp est</span>
            ${fp.tier ? `<span style="font-size: 9px; color: #6B7280; margin-left: 4px;">(${escapeHtml(fp.tier)})</span>` : ""}
            ${l5Tag}
            ${calTag ? `<div style="font-size: 9px; color: #6B7280; margin-top: 2px; padding-left: 50px;">${calTag}</div>` : ""}
          </div>
        `;
      }

      return `
        <div style="margin-bottom: 8px;">
          <div style="display: flex; align-items: center; padding: 2px 0 4px;">
            <span style="font-size: 10px; font-weight: 700; color: #9CA3AF;
                         text-transform: uppercase; letter-spacing: 0.5px;">${escapeHtml(fam)}</span>
            ${calBadge}
          </div>
          ${projectionLine}
          <div style="display: flex; flex-direction: column; gap: 2px;">
            ${oversHtml}
            ${undersHtml}
          </div>
        </div>
      `;
    }

    window.addLegFromGameView = function (stashKey, sport) {
      const cand = (state._gameViewStash || {})[stashKey];
      if (cand) addLeg(cand, sport);
    };

    // ─────────────────────────────────────────────────────────────
    // Feedback loop — GRADES tab (yesterday's logged picks)
    // ─────────────────────────────────────────────────────────────
    async function fetchGrades() {
      if (state.grades.loading) return;
      state.grades.loading = true;
      state.grades.error = null;
      try {
        const r = await fetch(`${API}/api/ws/ledger/yesterday`);
        const data = await r.json();
        if (!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
        state.grades.date   = data.date;
        state.grades.picks  = Array.isArray(data.picks) ? data.picks : [];
        state.grades.totals = data.totals || null;
      } catch (err) {
        state.grades.error = String(err && err.message || err);
      } finally {
        state.grades.loading = false;
        // Update grades tab count badge
        const el = document.getElementById("gradesCount");
        if (el) el.textContent = state.grades.picks.length || "0";
        if (state.activeSport === "grades") render();
      }
    }

    async function triggerGrade(sport) {
      if (state.grades.grading) return;
      state.grades.grading = true;
      state.grades.gradeNote = `Grading ${sport.toUpperCase()}…`;
      if (state.activeSport === "grades") render();
      try {
        const r = await fetch(`${API}/api/ws/ledger/grade`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sport, date: state.grades.date || undefined }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
          const sR = data?.steps?.ledgerSettle;
          const settled = sR?.settled != null ? sR.settled : (sR?.skipped ? "0 (nothing to settle yet)" : "?");
          state.grades.gradeNote = `✓ ${sport.toUpperCase()} graded — ${settled} bet${settled === 1 ? "" : "s"} settled.`;
        } else if (data?.deferred) {
          state.grades.gradeNote = `⏳ ${sport.toUpperCase()} not ready — ${data.reason || "slate incomplete"}.`;
        } else {
          state.grades.gradeNote = `✗ ${data?.error || `HTTP ${r.status}`}`;
        }
        await fetchGrades();
      } catch (err) {
        state.grades.gradeNote = `✗ ${String(err && err.message || err)}`;
      } finally {
        state.grades.grading = false;
        if (state.activeSport === "grades") render();
      }
    }
    window.triggerGrade = triggerGrade;

    function fmtOdds(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return v > 0 ? `+${v}` : `${v}`;
    }
    function fmtNum(n, decimals = 2) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return v.toFixed(decimals);
    }
    function fmtPct(n, decimals = 1) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return `${(v * 100).toFixed(decimals)}%`;
    }

    // POSTs to /api/ws/ledger/log which wraps buildPersonalLedger.addOrUpdateBet.
    // Idempotent on stableId — re-tapping same play won't duplicate.
    window.logPickFromGameView = async function (stashKey, sport, btnEl) {
      const cand = (state._gameViewStash || {})[stashKey];
      if (!cand) return;
      const originalLabel = btnEl ? btnEl.textContent : null;
      try {
        if (btnEl) { btnEl.textContent = "…"; btnEl.disabled = true; }
        const r = await fetch(`${API}/api/ws/ledger/log`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sport,
            sportsbook:     cand.sportsbook || cand.book,
            player:         cand.player,
            team:           cand.team,
            statFamily:     cand.statFamily,
            prop:           cand.propType,
            side:           cand.side,
            line:           cand.line,
            odds:           cand.odds,
            stake:          10,
            confidenceTier: cand.tier || null,
            decisionType:   "followed",
            modelProb:      cand.modelProb,
            edge:           cand.edge,
            archetype:      cand.archetype || null,
          }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
          if (btnEl) {
            btnEl.textContent = "✓";
            btnEl.style.background = "#FBBF24";
            btnEl.style.color = "#0A0E1A";
            setTimeout(() => {
              if (!btnEl) return;
              btnEl.textContent = originalLabel || "L";
              btnEl.style.background = "rgba(251, 191, 36, 0.12)";
              btnEl.style.color = "#FBBF24";
              btnEl.disabled = false;
            }, 1400);
          }
        } else {
          if (btnEl) {
            btnEl.textContent = "!";
            btnEl.title = data.error || `HTTP ${r.status}`;
            setTimeout(() => {
              if (!btnEl) return;
              btnEl.textContent = originalLabel || "L";
              btnEl.disabled = false;
            }, 1800);
          }
        }
      } catch (err) {
        if (btnEl) {
          btnEl.textContent = "!";
          btnEl.title = String(err && err.message || err);
          setTimeout(() => {
            if (!btnEl) return;
            btnEl.textContent = originalLabel || "L";
            btnEl.disabled = false;
          }, 1800);
        }
      }
    };

    // ─────────────────────────────────────────────────────────────
    // v0.2.8: Player Search (Wemby / SGA / any star, regardless of edge)
    // ─────────────────────────────────────────────────────────────
    function renderSearchBar(sport, searchState) {
      const placeholderHints = sport === "nba"
        ? "Search player — try 'wemby', 'sga', 'castle', 'mobley'…"
        : "Search player — try 'judge', 'soto', 'ohtani'…";
      return `
        <div style="margin-bottom: 12px;">
          <input id="search-${sport}" type="text"
                 placeholder="${placeholderHints}"
                 value="${escapeHtml(searchState.q || "")}"
                 oninput="onSearchInput('${sport}', this.value)"
                 style="width: 100%; padding: 10px 12px;
                        background: #141828; border: 1px solid ${searchState.q ? "#38BDF8" : "#1F2937"};
                        color: #E5E7EB; border-radius: 10px; font-size: 14px;
                        font-family: inherit; box-sizing: border-box;
                        transition: border-color 0.15s ease;" />
        </div>
      `;
    }

    function renderSearchResults(sport, searchState) {
      if (searchState.loading) {
        return `<div class="empty" style="padding: 24px;">Searching…</div>`;
      }
      const results = searchState.results;
      if (!results || results.length === 0) {
        return `<div class="empty" style="padding: 24px;">
          No props found for "${escapeHtml(searchState.q)}" in tonight's ${sport.toUpperCase()} slate.<br>
          <span style="font-size: 11px; color: #6B7280;">Try a different spelling, nickname, or check NBA tab if MLB</span>
        </div>`;
      }
      // Group by player + propType so all of "Wemby Points" props are together
      const groups = new Map();
      for (const r of results) {
        const key = `${r.player}|${r.propType}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      let html = `<div style="font-size: 11px; color: #9CA3AF; padding: 0 4px 8px; text-transform: uppercase; letter-spacing: 0.5px;">
        ${results.length} prop${results.length === 1 ? "" : "s"} across ${groups.size} player-prop combos
      </div>`;
      let idx = 0;
      for (const [key, group] of groups) {
        const [player, propType] = key.split("|");
        const teamTxt = group[0].team || "team pending";
        html += `<div style="margin-bottom: 14px;">
          <div style="padding: 4px 4px 6px; font-size: 13px;">
            <span style="font-weight: 700; color: #F9FAFB;">${escapeHtml(player)}</span>
            <span style="color: #6B7280; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px;"> · ${escapeHtml(teamTxt)} · ${escapeHtml(propType)}</span>
          </div>
          <div class="card-grid">
            ${group.map(r => renderSearchResultCard(r, sport, idx++)).join("")}
          </div>
        </div>`;
      }
      return html;
    }

    function renderSearchResultCard(c, sport, idx) {
      // Cache in renderedIndex so + add-to-parlay button works
      if (state._renderedIndex) state._renderedIndex[sport + ":" + idx] = c;
      const inParlay = isLegInParlay(c);
      const side = String(c.side || "").toLowerCase();
      const sideCls = side === "over" ? "side-over" : side === "under" ? "side-under" : "";
      const sideTxt = side ? side.toUpperCase() : "—";
      const odds = c.oddsAmerican ?? c.odds;
      const oddsTxt = fmtOdds(odds);
      const oddsCls = (typeof odds === "number" && odds > 0) ? "positive" : "";
      const book = c.sportsbook || c.book || "—";
      const bookCls = bookClass(book);
      const propLabel = c.propType ? String(c.propType) : "";
      return `
        <div class="card" data-idx="${idx}">
          <button class="add-leg-btn ${inParlay ? "added" : ""}"
                  onclick="addLegFromCard(${idx}, '${sport}'); event.stopPropagation();"
                  title="${inParlay ? "Already in parlay" : "Add to parlay"}">${inParlay ? "✓" : "+"}</button>
          <div class="prop-line">
            <span class="side ${sideCls}">${sideTxt}</span>
            <strong>${escapeHtml(propLabel)}</strong> ${c.line ?? "—"}
          </div>
          <div class="odds-book-row">
            <div class="odds ${oddsCls}">${oddsTxt}</div>
            <div class="book-pill ${bookCls}">${escapeHtml(book)}</div>
          </div>
        </div>
      `;
    }

    // v0.2.8b: search updates ONLY #search-results-region — never re-renders
    // the input element, never calls render(). This is what keeps the iPhone
    // keyboard alive while typing (each render() destroys + recreates DOM,
    // Safari dismisses the keyboard when the focused input disappears).
    let _searchDebounce = null;
    function onSearchInput(sport, value) {
      if (!state.search[sport]) state.search[sport] = { q: "", results: null, loading: false };
      state.search[sport].q = value;
      clearTimeout(_searchDebounce);

      const region = document.getElementById("search-results-region");

      if (!value || value.length < 2) {
        state.search[sport].results = null;
        state.search[sport].loading = false;
        // Clear the search results region but DON'T re-render — that would
        // destroy the input + close the keyboard. The user can manually clear
        // and the normal display reappears on next tab switch / refresh.
        if (region) region.innerHTML = "";
        return;
      }

      state.search[sport].loading = true;
      // Show a quick "Searching…" placeholder in the region while we fetch
      if (region) region.innerHTML = `<div class="empty" style="padding: 24px;">Searching…</div>`;

      _searchDebounce = setTimeout(async () => {
        try {
          const r = await fetch(`${API}/api/ws/player-search?sport=${sport}&q=${encodeURIComponent(value)}`);
          const json = await r.json();
          state.search[sport].results = (r.ok && json.ok && Array.isArray(json.results)) ? json.results : [];
        } catch (_) {
          state.search[sport].results = [];
        }
        state.search[sport].loading = false;
        // Only update if user is still on this tab and still typing this query
        if (state.activeSport === sport && state.search[sport].q === value) {
          const liveRegion = document.getElementById("search-results-region");
          if (liveRegion) {
            liveRegion.innerHTML = renderSearchResults(sport, state.search[sport]);
          }
        }
      }, 300);
    }
    window.onSearchInput = onSearchInput;

    // ─────────────────────────────────────────────────────────────
    // v0.2.0: Parlay tab renderer. Shows combined odds, single-book buildability,
    // legs list with per-leg remove. localStorage-backed so it persists.
    function renderParlay(main) {

        main.innerHTML = `<div class="parlay-empty">

          <div>Your parlay is empty.</div>

        </div>`;
        return;
      }
      const { combinedAmerican, combinedDecimal, combinedProb } = computeCombinedOdds(state.parlay);
      const build = computeBuildability(state.parlay);
      const oddsTxt = combinedAmerican == null ? "—"
                    : combinedAmerican > 0 ? `+${combinedAmerican}` : `${combinedAmerican}`;
      const probTxt = combinedProb == null ? "—" : `${(combinedProb * 100).toFixed(1)}%`;
      const decTxt = combinedDecimal == null ? "—" : combinedDecimal.toFixed(2);

      // Buildability message + styling
      let buildHtml = "";
      if (build.status === "single") {
        buildHtml = `<div class="ps-buildable ok">✓ Buildable on ${escapeHtml(build.book)} (single-book)</div>`;
      } else if (build.status === "mixed") {
        buildHtml = `<div class="ps-buildable warn">⚠ Mixed books (${build.books.length}) — can't construct at one sportsbook</div>`;
      } else if (build.status === "missing") {
        buildHtml = `<div class="ps-buildable bad">⚠ Some legs missing book info — can't verify buildability</div>`;
      }

      const summaryHtml = `
        <div class="parlay-summary">
          <div class="ps-top">
            <div class="ps-title">Tonight's Parlay · ${state.parlay.length} legs</div>
            <button class="ps-clear" onclick="clearParlayConfirm()">Clear All</button>
          </div>
          <div class="ps-odds">${oddsTxt}</div>
          <div class="ps-row"><span class="lbl">Combined decimal</span><span class="val">${decTxt}</span></div>
          <div class="ps-row"><span class="lbl">Implied hit rate</span><span class="val">${probTxt}</span></div>
          ${buildHtml}
        </div>
      `;

      const legsHtml = state.parlay.map((l, i) => {
        const sideTxt = String(l.side || "").toUpperCase();
        const oddsT = l.oddsAmerican == null ? "—" : (l.oddsAmerican > 0 ? `+${l.oddsAmerican}` : `${l.oddsAmerican}`);
        const teamTxt = l.team || (l.sport === "nba" ? "team pending" : "");
        return `
          <div class="parlay-leg">
            <div class="leg-main">
              <div class="leg-player">${escapeHtml(l.player || "?")}${teamTxt ? ` <span style="color:#6B7280; font-weight:500; font-size:11px;">· ${escapeHtml(teamTxt)}</span>` : ""}</div>
              <div class="leg-prop">${sideTxt} ${escapeHtml(String(l.propType || ""))} ${l.line ?? ""} <span class="leg-book">· ${escapeHtml(l.sportsbook || l.book || "?")}</span></div>
            </div>
            <div class="leg-odds">${oddsT}</div>
            <button class="leg-remove" onclick="removeLegFromParlay(${i})" aria-label="Remove leg">×</button>
          </div>
        `;
      }).join("");

      main.innerHTML = summaryHtml + legsHtml + `<div class="diag-footer">parlay v0.2.0 · persisted in browser · single-book discipline enforced</div>`;
    }

        const lineInput = isMilestone

          : `<input placeholder="Line (e.g. 1.5 or 19.5)" type="number" step="0.5" inputmode="decimal"
                    value="${leg.line}" oninput="updateAnalyzeLeg(${i}, 'line', this.value)" />`;
        return `
          <div class="leg-form" data-leg-idx="${i}">
            <div class="leg-form-header">
              <div class="leg-form-title">Leg ${i + 1}</div>
              ${a.legs.length > 1 ? `<button class="leg-form-remove" onclick="removeAnalyzeLeg(${i})">×</button>` : ""}
            </div>
            <input class="full" placeholder="Player name (e.g. Jalen Williams)"
                   value="${escapeHtml(leg.player || "")}"
                   oninput="updateAnalyzeLeg(${i}, 'player', this.value)" />
            <div class="leg-form-grid">
              <select onchange="onPropTypeChange(${i}, this.value)">
                ${propOptions.map(p => `<option value="${p}" ${leg.propType === p ? "selected" : ""}>${p}</option>`).join("")}
              </select>
              <select onchange="updateAnalyzeLeg(${i}, 'side', this.value)">
                ${sideOptions.map(([v, l]) => `<option value="${v}" ${leg.side === v ? "selected" : ""}>${l}</option>`).join("")}
              </select>
              ${lineInput}
              <input placeholder="Odds (+150 or -110)" type="text" inputmode="numeric"
                     value="${leg.odds}"
                     oninput="updateAnalyzeLeg(${i}, 'odds', this.value)" />
              <select class="full" onchange="updateAnalyzeLeg(${i}, 'sportsbook', this.value)">
                ${bookOptions.map(b => `<option value="${b}" ${leg.sportsbook === b ? "selected" : ""}>${b}</option>`).join("")}
              </select>
            </div>
          </div>
        `;
      }).join("");

      // v0.2.3: image OCR via Anthropic Vision — drop a screenshot, get legs.
      // Phase A.5: removed the redundant Quick-Paste textarea — operator said
      // OCR makes it unnecessary. If OCR breaks, paste-parse is still
      // available via parseAndPopulate() as a fallback handler (no UI).
      const ocrStatus = state.analyze.ocrStatus || "";
      const ocrHtml = `
        <div class="leg-form" style="border-color: rgba(56, 189, 248, 0.5); background: linear-gradient(180deg, #11202E 0%, #141828 100%);">
          <div class="leg-form-title" style="margin-bottom: 6px;">📸 Drop a screenshot (Claude Vision OCR)</div>
          <input type="file" id="anaImageInput" accept="image/*" style="display: none;"
                 onchange="handleImageFile(this.files[0])" />
          <button onclick="document.getElementById('anaImageInput').click()" class="add-leg-form-btn" style="margin-top: 0; margin-bottom: 6px;">
            📷 Choose image / take photo
          </button>
          <div id="anaOcrStatus" style="font-size: 11px; color: ${ocrStatus.includes("error") ? "#F87171" : ocrStatus.includes("Parsed") ? "#34D399" : "#9CA3AF"}; min-height: 14px; text-align: center; padding: 2px 0;">
            ${escapeHtml(ocrStatus) || "Or paste an image (Cmd-V) anywhere on this page."}
          </div>
        </div>
      `;

      const validLegs = a.legs.filter(legHasMinFields).length;
      const canSubmit = validLegs >= 1 && !a.submitting;

      const submitHtml = `
        <button class="add-leg-form-btn" onclick="addAnalyzeLeg()">+ Add another leg</button>
        <button class="analyze-submit-btn" onclick="submitAnalyze()" ${canSubmit ? "" : "disabled"}>
          ${a.submitting ? "Analyzing…" : `Analyze Slip (${validLegs} leg${validLegs === 1 ? "" : "s"})`}
        </button>
      `;

      const resultHtml = a.result ? renderVerdict(a.result) : "";

      main.innerHTML = introHtml + metaHtml + ocrHtml + legsHtml + submitHtml + resultHtml +
        `<div class="diag-footer">analyze v0.2.3 · Claude Vision OCR + paste-parse · backend POST /api/ws/screenshots/{ocr,ingest}</div>`;
    }

    // v0.2.3: Image upload + OCR via /api/ws/screenshots/ocr.
    // Operator drops a sportsbook screenshot, we send to Anthropic Vision,
    // get back parsed legs, populate the form. Operator just clicks "Analyze Slip."
    async function handleImageFile(file) {
      if (!file) return;
      const statusEl = document.getElementById("anaOcrStatus");
      const setStatus = (msg, color) => {
        if (statusEl) {
          statusEl.textContent = msg;
          if (color) statusEl.style.color = color;
        }
        state.analyze.ocrStatus = msg;
      };
      if (file.size > 9 * 1024 * 1024) {
        setStatus("Image too large (>9MB). Try a screenshot crop.", "#F87171");
        return;
      }
      setStatus("Reading image…", "#9CA3AF");
      try {
        // v0.2.4: convert ANY input image to JPEG via canvas. Handles HEIC,
        // HEIF, and any other format iPhone Safari might hand us. Anthropic
        // Vision only accepts jpeg/png/gif/webp, so we normalize to jpeg.
        // Also caps max dimension at 1600px to keep request size reasonable.
        const dataUrl = await convertImageToJpeg(file, 1600, 0.9);
        setStatus("Sending to Claude Vision…", "#38BDF8");
        const r = await fetch(`${API}/api/ws/screenshots/ocr`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64: dataUrl, mediaType: "image/jpeg" }),
        });
        const json = await r.json();
        if (!r.ok || !json.ok) {
          if (json?.code === "ANTHROPIC_KEY_MISSING") {
            setStatus("Need ANTHROPIC_API_KEY in backend .env. See instructions in chat.", "#F87171");
          } else {
            setStatus(`OCR error: ${json?.error || `HTTP ${r.status}`}`, "#F87171");
          }
          return;
        }
        if (!Array.isArray(json.legs) || json.legs.length === 0) {
          setStatus("Couldn't read any legs from this image. Try a clearer crop.", "#FBBF24");
          return;
        }
        // Populate legs from OCR result
        state.analyze.legs = json.legs.map(l => ({
          player: l.player || "",
          propType: l.propType || "Points",
          line: l.line == null ? "" : String(l.line),
          side: l.side || (isMilestoneProp(l.propType) ? "yes" : "over"),
          odds: l.odds == null ? "" : String(l.odds),
          sportsbook: l.sportsbook || json.sportsbook || "DraftKings",
        }));
        const noteParts = [`Parsed ${json.legs.length} legs from image`];
        if (json.sportsbook) noteParts.push(`book: ${json.sportsbook}`);
        if (json.combinedOdds) noteParts.push(`combined: +${json.combinedOdds}`);
        setStatus(`✓ ${noteParts.join(" · ")}`, "#34D399");
        render();
      } catch (e) {
        setStatus(`OCR error: ${e.message || String(e)}`, "#F87171");
      }
    }
    window.handleImageFile = handleImageFile;

    // v0.2.4: Convert any browser-readable image (HEIC/HEIF/JPEG/PNG/WebP) to
    // a clean JPEG data URL via canvas. Bulletproof against iPhone HEIC.
    // Also resizes to maxDim so we don't send 4000x3000 screenshots.
    async function convertImageToJpeg(file, maxDim, quality) {
      const objectUrl = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error("Image could not be decoded (unsupported format?)"));
          i.src = objectUrl;
        });
        // Compute resize dimensions preserving aspect ratio
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        // White background — JPEG doesn't support alpha, prevents black bg on PNGs
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        return canvas.toDataURL("image/jpeg", quality);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    // Page-level paste handler — operator copies an image (Cmd-V on Mac, share-paste
    // on iPhone), we route it into the OCR flow. Only fires when ANALYZE tab is active.
    document.addEventListener("paste", (e) => {
      if (state.activeSport !== "analyze") return;
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            handleImageFile(file);
            return;
          }
        }
      }
    });

    // v0.2.2: prop type change handler — also auto-flips side to "yes" when
    // switching to a milestone prop, and clears the line (not applicable).
    function onPropTypeChange(idx, newPropType) {
      const leg = state.analyze.legs[idx];
      if (!leg) return;
      leg.propType = newPropType;
      if (isMilestoneProp(newPropType)) {
        leg.side = "yes";
        leg.line = "";
      } else if (leg.side === "yes" || leg.side === "no") {
        leg.side = "over";
      }
      render();
    }

    // v0.2.2: pasted-text → structured legs parser.
    // Handles common formats: "X To Score Y+ Points", "X Y+ Points", "X Over Y.5",
    // "X To Record A Double-Double", "X Anytime Touchdown", "X HR", etc.
    function parseSlipText(text) {
      if (!text || typeof text !== "string") return [];
      const legs = [];
      // Split on commas and "and" — common slip delimiters
      const chunks = text
        .replace(/\bAND\b/gi, ",")
        .replace(/[\r\n]+/g, ",")
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);

      const PROP_KEYWORDS = [
        // [regex, propType, sport]
        [/\bpoints?\b/i, "Points"],
        [/\brebounds?\b/i, "Rebounds"],
        [/\bassists?\b/i, "Assists"],
        [/\bthrees?\b|\b3\s*-?\s*pointers?\b|\b3pt\b/i, "Threes"],
        [/\bsteals?\b/i, "Steals"],
        [/\bblocks?\b/i, "Blocks"],
        [/\bpra\b|\bpts\s*\+\s*reb\s*\+\s*ast\b/i, "PRA"],
        [/\bpts\s*\+\s*reb\b|\bpoints\s*\+\s*rebounds\b/i, "Pts+Reb"],
        [/\bpts\s*\+\s*ast\b|\bpoints\s*\+\s*assists\b/i, "Pts+Ast"],
        [/\breb\s*\+\s*ast\b|\brebounds\s*\+\s*assists\b/i, "Reb+Ast"],
        [/\bhome\s*runs?\b|\bhr\b/i, "Home Runs"],
        [/\btotal\s*bases?\b|\btb\b/i, "Total Bases"],
        [/\bhits?\b/i, "Hits"],
        [/\brbis?\b/i, "RBIs"],
        [/\bruns?\s*scored\b|\bruns?\b/i, "Runs Scored"],
        [/\bstolen\s*bases?\b|\bsb\b/i, "Stolen Bases"],
        [/\bstrikeouts?\b|\bks?\b/i, "Strikeouts"],
        [/\bwalks?\b|\bbb\b/i, "Walks"],
      ];
      const MILESTONE_KEYWORDS = [
        [/\bdouble[- ]?double\b/i, "Double-Double"],
        [/\btriple[- ]?double\b/i, "Triple-Double"],
        [/\bfirst\s*basket\b/i, "First Basket"],
        [/\banytime\s*touchdown\b|\banytime\s*td\b/i, "Anytime TD"],
        [/\banytime\s*goal\s*(scorer)?\b/i, "Anytime Goal"],
        [/\bto\s*hit\s*a?\s*hr\b|\bto\s*hit\s*a?\s*home\s*run\b|\bhr\b|\bhome\s*run\b/i, "Hit a HR"],
      ];

      for (const chunk of chunks) {
        let propType = null;
        let isMilestone = false;
        // Try milestones first (more specific)
        for (const [re, p] of MILESTONE_KEYWORDS) {
          if (re.test(chunk)) { propType = p; isMilestone = true; break; }
        }
        // Fall back to threshold props
        if (!propType) {
          for (const [re, p] of PROP_KEYWORDS) {
            if (re.test(chunk)) { propType = p; break; }
          }
        }
        if (!propType) continue;  // chunk doesn't look like a prop

        // Extract threshold/line: patterns like "20+", "Over 19.5", "Under 22.5", "1+"
        let line = "";
        let side = isMilestone ? "yes" : "over";
        const plusMatch = chunk.match(/(\d+(?:\.\d+)?)\s*\+/);
        const overMatch = chunk.match(/\bover\s*(\d+(?:\.\d+)?)/i);
        const underMatch = chunk.match(/\bunder\s*(\d+(?:\.\d+)?)/i);
        if (underMatch) {
          line = String(Number(underMatch[1]));
          side = "under";
        } else if (overMatch) {
          line = String(Number(overMatch[1]));
          side = "over";
        } else if (plusMatch && !isMilestone) {
          // "20+" → over 19.5 (the threshold convention sportsbooks use)
          const n = Number(plusMatch[1]);
          line = String(n - 0.5);
          side = "over";
        }

        // Extract player name: take everything before the prop keyword,
        // strip common slip-language like "To Score", "To Record", "A".
        let beforeProp = chunk;
        if (propType) {
          const re = new RegExp(`^(.*?)\\s+(to\\s+(score|record|hit|get|reach|have)\\s+(a\\s+)?)?\\d*\\+?\\s*${propType.replace(/[-+]/g, "\\$&")}`, "i");
          // Simpler: just take text before the first keyword match
          const firstKeywordMatch = chunk.search(/\b(points?|rebounds?|assists?|threes?|3pt|pra|pts|home\s*runs?|hr|hits?|rbis?|runs?|stolen|strikeouts?|ks?|walks?|bb|double[- ]?double|triple[- ]?double|first\s*basket|anytime|to\s+(score|record|hit))\b/i);
          if (firstKeywordMatch > 0) {
            beforeProp = chunk.slice(0, firstKeywordMatch).trim();
          }
        }
        // Clean: strip "To", trailing punctuation, etc.
        const player = beforeProp
          .replace(/\s+to$/i, "")
          .replace(/\s+(over|under)$/i, "")
          .replace(/[,;.]+$/, "")
          .trim();
        if (!player || player.length < 2) continue;

        legs.push({
          player,
          propType,
          side,
          line,
          odds: "",          // operator fills in
          sportsbook: state.analyze.legs[0]?.sportsbook || "DraftKings",
        });
      }
      return legs;
    }

    function parseAndPopulate() {
      const textarea = document.getElementById("anaPasteText");
      if (!textarea) return;
      const text = textarea.value;
      if (!text || !text.trim()) return;
      const parsed = parseSlipText(text);
      if (parsed.length === 0) {
        alert("Couldn't parse any legs from that text. Try a format like:\n\nJalen Williams 20+ Points, Wembanyama 30+ Points, SGA 8+ Assists, Stephon Castle Double-Double");
        return;
      }
      state.analyze.legs = parsed;
      textarea.value = "";
      render();
    }

    window.onPropTypeChange = onPropTypeChange;
    window.parseAndPopulate = parseAndPopulate;

    function legHasMinFields(leg) {
      // v0.2.3: operator feedback — sportsbook screenshots usually only show
      // the COMBINED parlay odds, not per-leg odds. So per-leg odds are now
      // OPTIONAL. Milestone props (Double-Double etc.) don't need line either.
      if (!String(leg.player || "").trim()) return false;
      if (!isMilestoneProp(leg.propType) && !String(leg.line ?? "").length) return false;
      return true;
    }

    function updateAnalyzeMeta(key, val) {
      state.analyze.meta[key] = val;
      // No re-render needed — just store. Re-render only on add/remove legs.
    }

    function updateAnalyzeLeg(idx, key, val) {
      if (!state.analyze.legs[idx]) return;
      state.analyze.legs[idx][key] = val;
      // Don't re-render on every keystroke — only update the submit button enabled state.
      const validLegs = state.analyze.legs.filter(legHasMinFields).length;
      const btn = document.querySelector(".analyze-submit-btn");
      if (btn) {
        btn.disabled = !(validLegs >= 1 && !state.analyze.submitting);
        btn.textContent = state.analyze.submitting ? "Analyzing…" : `Analyze Slip (${validLegs} leg${validLegs === 1 ? "" : "s"})`;
      }
    }

    function addAnalyzeLeg() {
      // Default new leg to same book as previous leg for single-book discipline
      const lastBook = state.analyze.legs.length > 0
        ? state.analyze.legs[state.analyze.legs.length - 1].sportsbook
        : "DraftKings";
      const newLeg = emptyLeg();
      newLeg.sportsbook = lastBook;
      state.analyze.legs.push(newLeg);
      render();
    }

    function removeAnalyzeLeg(idx) {
      if (state.analyze.legs.length <= 1) return;
      state.analyze.legs.splice(idx, 1);
      render();
    }

    async function submitAnalyze() {
      const a = state.analyze;
      const legs = a.legs.filter(legHasMinFields).map(leg => {
        const rawOdds = String(leg.odds || "").replace(/[+\s]/g, "");
        const oddsNum = rawOdds ? Number(rawOdds) : null;
        const milestone = isMilestoneProp(leg.propType);
        // v0.2.7: milestone props (Double-Double, Anytime HR, etc.) don't have
        // a line. Backend resolveSlipLegToPrediction.js requires line non-null
        // (fails MISSING_LINE → "could not map this leg" error). Pass synthetic
        // line=0.5 so resolution succeeds; downstream cognition can detect
        // milestone via propType.
        const lineValue = milestone
          ? 0.5
          : (leg.line === "" ? null : Number(leg.line));
        return {
          player: String(leg.player).trim(),
          statFamily: String(leg.propType).toLowerCase().replace(/\s+/g, "_"),
          propType: leg.propType,
          side: leg.side,
          line: lineValue,
          odds: Number.isFinite(oddsNum) ? oddsNum : null,
          sportsbook: leg.sportsbook,
        };
      });
      if (legs.length === 0) return;

      // v0.2.5: auto-detect sport from prop types when operator left "auto-detect"
      // selected. Backend resolveSlipLegToPrediction bails MISSING_SPORT if sport
      // is null — every leg becomes "unresolved" which is why earlier slips
      // scored 1/100 UNKNOWN. Same for slateDate — default to today.
      const detectedSport = a.meta.sport || autoDetectSportFromLegs(legs);
      const todayDate = new Date().toISOString().slice(0, 10);  // YYYY-MM-DD

      const payload = {
        sourceType:  a.meta.sourceType || "screenshot",
        sourceLabel: a.meta.attribution || null,
        attribution: a.meta.attribution || null,
        sport:       detectedSport,
        slateDate:   todayDate,
        slip:        { legs },
      };

      a.submitting = true;
      a.result = null;
      render();

      try {
        const r = await fetch(`${API}/api/ws/screenshots/ingest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const json = await r.json();
        if (!r.ok || !json.ok) {
          a.result = { _error: json?.error || `HTTP ${r.status}` };
        } else {
          a.result = json.results && json.results[0] ? json.results[0] : json;
        }
      } catch (e) {
        a.result = { _error: e.message || String(e) };
      } finally {
        a.submitting = false;
        render();
      }
    }

    function renderVerdict(r) {
      if (r._error) {
        return `<div class="verdict-card" style="border-color: rgba(248, 113, 113, 0.4);">
          <div style="color: #F87171; font-weight: 700; margin-bottom: 6px;">Analysis failed</div>
          <div style="font-family: ui-monospace, monospace; font-size: 11px; color: #9CA3AF;">${escapeHtml(r._error)}</div>
        </div>`;
      }
      const cs = Number(r.compositeScore);
      const csTxt = Number.isFinite(cs) ? Math.round(cs) : "—";
      const csCls = !Number.isFinite(cs) ? "" : cs >= 70 ? "high" : cs >= 50 ? "mid" : "low";
      const archetype = r.archetype || "unclassified";
      const signalsHtml = [];
      if (r.sharpSignal) signalsHtml.push(`<span class="verdict-signal vs-sharp">SHARP</span>`);
      if (r.baitSignal)  signalsHtml.push(`<span class="verdict-signal vs-bait">BAIT</span>`);
      if (r.verdict?.viral_signal) signalsHtml.push(`<span class="verdict-signal vs-viral">VIRAL</span>`);

      // v0.2.7: Build SLIP-LEVEL structural intelligence from the submitted
      // legs themselves. Even when deep cognition can't grade individual legs,
      // parlay math + structural read gives the operator real value.
      const legs = state.analyze.legs.filter(legHasMinFields);
      const structureHtml = renderSlipStructureAnalysis(legs);

      const verdict = r.verdict || null;
      let detailHtml = "";
      if (verdict?.verdictSummary && !/could not map|no live/i.test(verdict.verdictSummary)) {
        detailHtml += `<div class="verdict-section">
          <div class="label">Cognition verdict</div>
          <div>${escapeHtml(verdict.verdictSummary)}</div>
        </div>`;
      }
      if (verdict?.bettorLanguageSummary && !/could not map|no live/i.test(verdict.bettorLanguageSummary)) {
        detailHtml += `<div class="verdict-section">
          <div class="label">Bettor-language read</div>
          <div>${escapeHtml(verdict.bettorLanguageSummary)}</div>
        </div>`;
      }
      if (verdict?.strongestLeg) {
        const sl = verdict.strongestLeg;
        detailHtml += `<div class="verdict-section">
          <div class="label">Strongest leg</div>
          <div>Leg ${sl.legIndex + 1}${sl.reason ? ` — ${escapeHtml(sl.reason)}` : ""}</div>
        </div>`;
      }
      if (verdict?.weakestLeg) {
        const wl = verdict.weakestLeg;
        detailHtml += `<div class="verdict-section">
          <div class="label">Weakest leg</div>
          <div>Leg ${wl.legIndex + 1}${wl.reason ? ` — ${escapeHtml(wl.reason)}` : ""}</div>
        </div>`;
      }
      if (Array.isArray(verdict?.contradictionFlags) && verdict.contradictionFlags.length > 0) {
        detailHtml += `<div class="verdict-section">
          <div class="label">Contradictions flagged</div>
          <div>${verdict.contradictionFlags.map(f => escapeHtml(String(f))).join(" · ")}</div>
        </div>`;
      }

      return `
        <div class="verdict-card">
          <div class="verdict-score-row">
            <div class="verdict-score ${csCls}">${csTxt}<span style="font-size: 14px; color: #6B7280;">/100</span></div>
            <div class="verdict-archetype">${escapeHtml(String(archetype).replace(/_/g, " "))}</div>
          </div>
          ${signalsHtml.length ? `<div class="verdict-signals">${signalsHtml.join("")}</div>` : ""}
          ${structureHtml}
          ${detailHtml}
          <div style="margin-top: 12px; text-align: center;">
            <button class="ps-clear" onclick="resetAnalyze()">Analyze another slip</button>
          </div>
        </div>
      `;
    }

    // v0.2.7: Slip-level structural intelligence rendered directly from the
    // submitted legs. Independent of the backend cognition's grade — gives
    // useful read EVEN when individual legs can't be deep-analyzed.
    function renderSlipStructureAnalysis(legs) {
      if (!legs || legs.length === 0) return "";

      // Combined odds math
      const oddsToDecimal = (am) => {
        const n = Number(String(am).replace(/[+\s]/g, ""));
        if (!Number.isFinite(n) || n === 0) return null;
        return n > 0 ? (n / 100 + 1) : (100 / Math.abs(n) + 1);
      };
      const legDecimals = legs.map(l => oddsToDecimal(l.odds)).filter(Number.isFinite);
      const hasFullOdds = legDecimals.length === legs.length;
      let combinedDecimal = null, combinedAmerican = null, impliedHitRate = null;
      if (hasFullOdds && legDecimals.length > 0) {
        combinedDecimal = legDecimals.reduce((a, b) => a * b, 1);
        combinedAmerican = combinedDecimal >= 2
          ? Math.round((combinedDecimal - 1) * 100)
          : -Math.round(100 / (combinedDecimal - 1));
        impliedHitRate = 1 / combinedDecimal;
      }

      // Structural reads
      const milestone = legs.filter(l => isMilestoneProp(l.propType)).length;
      const altLines  = legs.filter(l => {
        const pt = String(l.propType || "").toLowerCase();
        const ln = Number(l.line);
        // Heuristic: stretched alt lines (Points 25+, Rebounds 12+, etc.) — high payout per leg
        if (!Number.isFinite(ln)) return false;
        if (pt.includes("points") && ln >= 24.5) return true;
        if (pt.includes("rebounds") && ln >= 9.5) return true;
        if (pt.includes("assists") && ln >= 7.5) return true;
        if (pt.includes("hits") && ln >= 1.5) return true;
        return false;
      }).length;

      // Single-book check
      const books = new Set(legs.map(l => String(l.sportsbook || "").trim()).filter(Boolean));
      const singleBook = books.size === 1 ? [...books][0] : null;

      // Structural verdict heuristics
      const verdicts = [];
      if (impliedHitRate != null) {
        if (impliedHitRate < 0.01) verdicts.push("Extreme variance play (<1% implied hit rate)");
        else if (impliedHitRate < 0.05) verdicts.push("Lottery-tier longshot (1-5% implied hit rate)");
        else if (impliedHitRate < 0.15) verdicts.push("High-variance parlay (5-15% hit rate)");
        else if (impliedHitRate < 0.35) verdicts.push("Medium-variance parlay (15-35% hit rate)");
        else verdicts.push("Reasonable hit rate (>35% implied)");
      }
      if (legs.length >= 5) verdicts.push(`${legs.length}-leg same-game style — exponential variance compounding`);
      if (altLines >= 2) verdicts.push(`${altLines} stretched alt lines — depends on tail-event performance`);
      if (milestone > 0) verdicts.push(`${milestone} milestone bet${milestone > 1 ? "s" : ""} (yes/no, low base rate)`);
      if (!singleBook && books.size > 1) verdicts.push(`Mixed books (${books.size}) — not constructable as single-book parlay`);
      else if (singleBook) verdicts.push(`Buildable on ${singleBook} (single-book)`);

      // Display
      const fmtOdds = (am) => am == null ? "—" : (am > 0 ? `+${am}` : `${am}`);
      const fmtPct = (p) => p == null ? "—" : (p * 100).toFixed(p < 0.01 ? 3 : p < 0.1 ? 2 : 1) + "%";

      return `
        <div class="verdict-section" style="border-color: rgba(56, 189, 248, 0.3);">
          <div class="label">Parlay math</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12px; margin-top: 4px;">
            <span style="color: #9CA3AF;">Legs</span><span style="font-family: ui-monospace, monospace;">${legs.length}</span>
            <span style="color: #9CA3AF;">Combined odds</span><span style="font-family: ui-monospace, monospace; color: ${combinedAmerican != null && combinedAmerican > 0 ? "#34D399" : "#F9FAFB"};">${hasFullOdds ? fmtOdds(combinedAmerican) : "(needs per-leg odds)"}</span>
            <span style="color: #9CA3AF;">Implied hit rate</span><span style="font-family: ui-monospace, monospace; color: ${impliedHitRate != null && impliedHitRate < 0.05 ? "#F87171" : "#FBBF24"};">${fmtPct(impliedHitRate)}</span>
          </div>
        </div>
        ${verdicts.length ? `
          <div class="verdict-section">
            <div class="label">Structural read</div>
            <div style="font-size: 12px; line-height: 1.6;">
              ${verdicts.map(v => `<div>• ${escapeHtml(v)}</div>`).join("")}
            </div>
          </div>` : ""}
      `;
    }

    function resetAnalyze() {
      state.analyze.result = null;
      state.analyze.legs = [emptyLeg()];
      render();
    }

    // Expose handlers
    window.updateAnalyzeMeta = updateAnalyzeMeta;
    window.updateAnalyzeLeg = updateAnalyzeLeg;
    window.addAnalyzeLeg = addAnalyzeLeg;
    window.removeAnalyzeLeg = removeAnalyzeLeg;
    window.submitAnalyze = submitAnalyze;
    window.resetAnalyze = resetAnalyze;

    // ─────────────────────────────────────────────────────────────
    // Fetch + refresh
    // ─────────────────────────────────────────────────────────────
    async function fetchSport(sport) {
      try {
        const r = await fetch(`${API}/api/ws/state?sport=${sport}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        state.data[sport] = j;
      } catch (e) {
        state.data[sport] = { _error: e.message || String(e) };
      }
    }

    async function refresh(forceRefresh = false) {
      if (state.fetching) return;
      if (!forceRefresh && state.lastFetchAt && (Date.now() - state.lastFetchAt) < REFRESH_MIN_INTERVAL_MS) return;
      state.fetching = true;
      const btn = document.getElementById("refreshBtn");
      btn.classList.add("spinning");

      // If forceRefresh: hit /refresh-snapshot endpoints first
      if (forceRefresh) {
        try {
          await Promise.allSettled([
            fetch(`${API}/refresh-snapshot?sport=baseball_mlb`).catch(() => {}),
            fetch(`${API}/refresh-snapshot/hard-reset`).catch(() => {}),
          ]);
        } catch (_) {}
      }

      await Promise.all([fetchSport("mlb"), fetchSport("nba")]);
      state.lastFetchAt = Date.now();
      state.fetching = false;
      btn.classList.remove("spinning");
      render();
    }

    document.getElementById("refreshBtn").addEventListener("click", () => refresh(true));

    // Tab switching
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        state.activeSport = tab.dataset.sport;
        render();
      });
    });

    // v0.1.5: cheap fetch only on initial load — operator 2026-05-21 caught
    // that force-refreshing on every PWA open would burn ~80 odds-API calls
    // per launch. Initial load now just reads whatever the backend has cached
    // (cheap), and the refresh button stays a manual one-tap when operator
    // wants fresh data. The header "X ago" makes staleness visible so the
    // operator knows when to tap.
    refresh(false);

    // Periodic "X seconds ago" tick for the header
    setInterval(() => {
      if (state.lastFetchAt) {
        const secs = Math.round((Date.now() - state.lastFetchAt) / 1000);
        document.getElementById("lastUpdate").textContent =
          secs < 60 ? `${secs}s ago` : `${Math.round(secs / 60)}m ago`;
      }
    }, 5000);
  </script>
</body>
</html>
